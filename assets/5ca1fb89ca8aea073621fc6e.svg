ke-width="2.2"/><polygon points="550,970.0 555,958.0 545,958.0" fill="#506781" stroke="none"/><path d="M 1070.0,430 L 1080,430 L 1080,1020 L 710.0,1020" fill="none" stroke="#506781" stroke-width="2.2"/><polygon points="710.0,1020 722.0,1025 722.0,1015" fill="#506781" stroke="none"/><path d="M 180,850.0 L 180,1020 L 390.0,1020" fill="none" stroke="#506781" stroke-width="2.2"/><polygon points="390.0,1020 378.0,1015 378.0,1025" fill="#506781" stroke="none"/><path d="M 30.0,800 L 10,800 L 10,130 L 420.0,130" fill="none" stroke="#506781" stroke-width="2.2" stroke-dasharray="7 4"/><polygon points="420.0,130 408.0,125 408.0,135" fill="#506781" stroke="none"/><path d="M 550,1070.0 L 550,1165.0" fill="none" stroke="#506781" stroke-width="2.2"/><polygon points="550,1165.0 555,1153.0 545,1153.0" fill="#506781" stroke="none"/><rect x="440.0" y="0.0" width="220" height="50" rx="25" fill="#e8f1fa" stroke="#3f6085"/><rect x="420.0" y="92.0" width="260" height="76" rx="0" fill="#f7faff" stroke="#3f6085"/><polygon points="550,210.0 670.0,270 550,330.0 430.0,270" fill="#fff5df" stroke="#a87c2c"/><rect x="420.0" y="392.0" width="260" height="76" rx="0" fill="#f7faff" stroke="#3f6085"/><polygon points="550,530.0 670.0,590 550,650.0 430.0,590" fill="#fff5df" stroke="#a87c2c"/><rect x="730.0" y="365.0" width="340" height="130" rx="0" fill="#f7faff" stroke="#3f6085"/><rect x="420.0" y="762.0" width="260" height="76" rx="0" fill="#f7faff" stroke="#3f6085"/><rect x="30.0" y="750.0" width="300" height="100" rx="0" fill="#f7faff" stroke="#3f6085"/><rect x="390.0" y="970.0" width="320" height="100" rx="0" fill="#f7faff" stroke="#3f6085"/><rect x="440.0" y="1165.0" width="220" height="50" rx="25" fill="#e8f1fa" stroke="#3f6085"/><text x="550" y="32" text-anchor="middle" font-size="20"><tspan x="550" dy="0">开始</tspan></text><text x="550" y="137" text-anchor="middle" font-size="20"><tspan x="550" dy="0">采图并绑定产品编号</tspan></text><text x="550" y="277" text-anchor="middle" font-size="20"><tspan x="550" dy="0">图像是否可用？</tspan></text><text x="550" y="437" text-anchor="middle" font-size="20"><tspan x="550" dy="0">模型检测并记录版本/分数</tspan></text><text x="550" y="597" text-anchor="middle" font-size="20"><tspan x="550" dy="0">按缺陷分数分流</tspan></text><text x="900" y="409" text-anchor="middle" font-size="20"><tspan x="900" dy="0">图像差先补拍一次</tspan><tspan x="900" dy="28">仍不可用查实物；不确定则复核</tspan><tspan x="900" dy="28">合格放行/不合格隔离/不明待检</tspan></text><text x="550" y="807" text-anchor="middle" font-size="20"><tspan x="550" dy="0">自动放行</tspan></text><text x="180" y="793" text-anchor="middle" font-size="20"><tspan x="180" dy="0">隔离，交质量人员处置</tspan><tspan x="180" dy="28">放行/返工/报废；返工重检</tspan></text><text x="550" y="1013" text-anchor="middle" font-size="20"><tspan x="550" dy="0">记录人员、理由、时间与状态</tspan><tspan x="550" dy="28">仅当前已放行可进入包装</tspan></text><text x="550" y="1197" text-anchor="middle" font-size="20"><tspan x="550" dy="0">结束本次检测</tspan></text><rect x="560.5" y="356" width="29" height="25" fill="white" stroke="none"/><text x="575" y="375" text-anchor="middle" font-size="17">是</text><rect x="770.5" y="234" width="29" height="25" fill="white" stroke="none"/><text x="785" y="253" text-anchor="middle" font-size="17">否</text><rect x="567.0" y="706" width="66" height="25" fill="white" stroke="none"/><text x="600" y="725" text-anchor="middle" font-size="17">&lt; 0.20</text><rect x="735.0" y="601" width="180" height="25" fill="white" stroke="none"/><text x="825" y="620" text-anchor="middle" font-size="17">0.20 ≤ 分数 &lt; 0.80</text><rect x="298.0" y="551" width="74" height="25" fill="white" stroke="none"/><text x="335" y="570" text-anchor="middle" font-size="17">≥ 0.80</text><rect x="51.5" y="96" width="97" height="25" fill="white" stroke="none"/><text x="100" y="115" text-anchor="middle" font-size="17">返工后重检</text></g></svg>