3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>F1\u003c/td>\n\u003ctd>0.664\u003c/td>\n\u003ctd>0.667\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>混淆矩阵\u003c/td>\n\u003ctd>[[246,42],[33,74]]\u003c/td>\n\u003ctd>[[251,37],[35,72]]\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>乳制品召回率\u003c/td>\n\u003ctd>66.7%\u003c/td>\n\u003ctd>61.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>冷冻食品召回率\u003c/td>\n\u003ctd>13.3%\u003c/td>\n\u003ctd>6.7%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cul>\n\u003cli>课件与当前代码的训练/测试参数一致；本机 pandas 2.2.3、scikit-learn 1.6.1 复跑如右列。课件没有提供原始CSV及运行环境，不能确定其实际用的数据是否相同，也不能确定正文数值差异的来源。\u003c/li>\n\u003cli>按课件复习时识别左列，实际运行以自己的输出解释；不要修改随机种子或固定参数来凑数。两种数值都指向冷冻食品召回明显偏低。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供数据文件cold_chain_shipments.csv，需完成以下操作:\u003c/p>\u003cp>数据字段说明：\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"冷链运输 cold_chain_shipments.csv · 数据字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"shipment-fields\">\u003ccolgroup>\u003ccol style=\"width:31%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:49%\">\u003c/colgroup>\u003ccaption>冷链运输 cold_chain_shipments.csv · 数据字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">shipment_id\u003c/th>\u003ctd>运输单号\u003c/td>\u003ctd>同一编号代表同一运输任务，原始数据中包含少量重复记录\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">depart_time\u003c/th>\u003ctd>发车时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">route_region\u003c/th>\u003ctd>线路区域\u003c/td>\u003ctd>华东、华南、华北或西南\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">vehicle_type\u003c/th>\u003ctd>车辆类型\u003c/td>\u003ctd>冷藏车、冷冻车或混合温区车\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">cargo_type\u003c/th>\u003ctd>货物类型\u003c/td>\u003ctd>疫苗、生鲜食品、冷冻食品或乳制品\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">planned_hours\u003c/th>\u003ctd>计划运输时长\u003c/td>\u003ctd>单位：小时，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">outside_temp\u003c/th>\u003ctd>外部温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">avg_temp\u003c/th>\u003ctd>车厢平均温度\u003c/td>\u003ctd>单位：℃，存在少量缺失值\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">max_temp\u003c/th>\u003ctd>车厢最高温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">door_open_count\u003c/th>\u003ctd>开门次数\u003c/td>\u003ctd>非负整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">sensor_missing_rate\u003c/th>\u003ctd>传感器缺失率\u003c/td>\u003ctd>0～1，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">driver_experience_years\u003c/th>\u003ctd>驾驶经验\u003c/td>\u003ctd>单位：年\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">temp_alarm\u003c/th>\u003ctd>温控异常标签\u003c/td>\u003ctd>1表示异常，0表示正常\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>任务一：数据清洗与业务分布分析在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率及平均传感器缺失率。\u003c/h4>\u003ch4>任务二：算法训练与测试在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型在测试集中的召回率。\u003c/h4>\u003ch4>任务三：形成算法测试结论结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测试表现存在明显差异的情况提出一项改进措施。\u003c/h4>\u003c/div>"}, "B2-T3": {"id": "B2-T3", "exam": "B2", "exam_title": "冷链运输温控异常预警算法测试与数据分析", "source": "某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输\n\n时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供\n\n数据文件cold_chain_shipments.csv，需完成以下操作:\n\n  数据字段说明：\n\n字段           含义     说明\n\n                    同一编号代表同一运输任务，原始数据中包含少量\nshipment_id        运输单号\n                    重复记录\n\ndepart_time        发车时间  格式为年-月-日时:分:秒\n\nroute_region       线路区域  华东、华南、华北或西南\n\nvehicle_type       车辆类型  冷藏车、冷冻车或混合温区车\n\ncargo_type        货物类型  疫苗、生鲜食品、冷冻食品或乳制品\n\n             计划运输时\nplanned_hours             单位：小时，少量非法值需清理\n             长\n\noutside_temp       外部温度  单位：℃\n\n             车厢平均温\navg_temp               单位：℃，存在少量缺失值\n             度\n\n             车厢最高温\nmax_temp                单位：℃\n             度\n\ndoor_open_count      开门次数  非负整数\n\n             传感器缺失\nsensor_missing_rate           0～1，少量非法值需清理\n             率\n\ndriver_experience_years  驾驶经验  单位：年\n\n             温控异常标\ntemp_alarm                             1 表示异常，0 表示正常\n             签\n\n  任务一：数据清洗与业务分布分析\n\n    在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按\n\n货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率\n\n及平均传感器缺失率。\n\n  任务二：算法训练与测试\n\n    在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集\n\n和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型\n\n在测试集中的召回率。\n\n  任务三：形成算法测试结论\n\n  结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测\n试表现存在明显差异的情况提出一项改进措施。", "pages": [23, 24], "title": "任务3：算法测试结论", "prompts": ["（1）说明冷链预警应优先关注的分类指标及理由。", "（2）对货物类型表现明显不一致提出一项改进与验证措施。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T3-section-1\">\u003ch3 id=\"B2-T3-section-1\">（1）优先指标与理由\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>优先关注异常类\u003cstrong>召回率\u003c/strong>：漏报意味着异常运输没有被提示，可能损害货物质量；课件列值为107条异常漏掉33条，当前实跑漏掉35条；结论均是漏报风险需要优先控制。\u003c/li>\n\u003cli>同时看精确率、F1 和误报数量，避免为追求召回让工作人员被无效报警淹没。\u003c/li>\n\u003cli>分货物类型报告召回率，尤其冷冻食品低召回不能被总体指标掩盖。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T3-section-2\">\u003ch3 id=\"B2-T3-section-2\">（2）一项改进及验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>针对冷冻食品低召回，补充并复核该类异常样本，检查其温控阈值与特征是否适配；在训练/验证集内补采或过采样、调整权重或分类阈值；也可加入最高温度减平均温度等波动特征。过采样只能在训练集内做。\u003c/li>\n\u003cli>用未参与调参的新数据验证该类召回是否改善，并检查其他货物类别及整体误报是否恶化，不能反复调最终测试集。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T3-section-3\">\u003ch3 id=\"B2-T3-section-3\">易错点：本题模板与真实预警\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>本题按给定框架练习；真实验证中，中位数和编码应在训练数据上拟合，再应用到测试集。\u003c/li>\n\u003cli>平均温度、最高温度、开门次数等可能是运输结束后才完整获得的统计，必须核对预警时点的可得性；本次离线指标不等于证明可提前预警。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供数据文件cold_chain_shipments.csv，需完成以下操作:\u003c/p>\u003cp>数据字段说明：\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"冷链运输 cold_chain_shipments.csv · 数据字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"shipment-fields\">\u003ccolgroup>\u003ccol style=\"width:31%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:49%\">\u003c/colgroup>\u003ccaption>冷链运输 cold_chain_shipments.csv · 数据字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">shipment_id\u003c/th>\u003ctd>运输单号\u003c/td>\u003ctd>同一编号代表同一运输任务，原始数据中包含少量重复记录\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">depart_time\u003c/th>\u003ctd>发车时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">route_region\u003c/th>\u003ctd>线路区域\u003c/td>\u003ctd>华东、华南、华北或西南\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">vehicle_type\u003c/th>\u003ctd>车辆类型\u003c/td>\u003ctd>冷藏车、冷冻车或混合温区车\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">cargo_type\u003c/th>\u003ctd>货物类型\u003c/td>\u003ctd>疫苗、生鲜食品、冷冻食品或乳制品\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">planned_hours\u003c/th>\u003ctd>计划运输时长\u003c/td>\u003ctd>单位：小时，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">outside_temp\u003c/th>\u003ctd>外部温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">avg_temp\u003c/th>\u003ctd>车厢平均温度\u003c/td>\u003ctd>单位：℃，存在少量缺失值\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">max_temp\u003c/th>\u003ctd>车厢最高温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">door_open_count\u003c/th>\u003ctd>开门次数\u003c/td>\u003ctd>非负整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">sensor_missing_rate\u003c/th>\u003ctd>传感器缺失率\u003c/td>\u003ctd>0～1，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">driver_experience_years\u003c/th>\u003ctd>驾驶经验\u003c/td>\u003ctd>单位：年\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">temp_alarm\u003c/th>\u003ctd>温控异常标签\u003c/td>\u003ctd>1表示异常，0表示正常\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>任务一：数据清洗与业务分布分析在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率及平均传感器缺失率。\u003c/h4>\u003ch4>任务二：算法训练与测试在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型在测试集中的召回率。\u003c/h4>\u003ch4>任务三：形成算法测试结论结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测试表现存在明显差异的情况提出一项改进措施。\u003c/h4>\u003c/div>"}, "B3-T1": {"id": "B3-T1", "exam": "B3", "exam_title": "智慧园区能源预测与智能调度解决方案设计", "source": "你是某智慧园区运营企业的人工智能训练师，正在参与园区能源管理系统升级。园区包含\n\n办公楼、商业配套、地下车库、新能源汽车充电区和储能设备。经调研，目前能源管理存在以\n\n下问题：\n\n      1. 园区最大用电负荷为1680kW，高峰负荷主要依靠人工观察后处理，容易产生需量费用；\n\n      2. 月均电费约125 万元，空调、储能和充电设施缺少统一调度；\n\n      3. 能源数据完整率为91%，部分仪表离线后不能及时补偿或告警；\n\n      4. 从发现高峰风险到执行调节的平均时间为25 分钟，响应速度较慢；\n\n      5. 设备数据、预测结果、控制指令和执行反馈分散，无法形成完整追溯记录。\n\n  企业计划应用以下3 类智能产品：\n\n       - 能源IoT 采集终端；\n\n       - AI 负荷预测与能源优化平台；\n\n       - 智能控制网关。\n\n  园区现有电表、楼宇自控系统、储能系统和充电平台均可通过接口交换数据。AI 平台可结\n\n合历史负荷、天气预报、工作日类型、园区活动和分时电价，输出未来30 分钟负荷预测、峰值\n\n风险及推荐调度方案。智能控制网关可接收经过确认的策略，对非关键空调负荷、储能充放电\n\n和充电设施功率进行调节，并返回执行状态。\n\n  解决方案必须遵守以下约束：\n\n      1. 能源数据连续缺失超过5 分钟时，系统重试采集并标记异常；重试后仍无数据则使用最\n\n近可靠值形成临时估计，同时通知运维人员核查；\n\n      2. 预测未来30 分钟园区负荷达到或超过1500kW 时，系统判定为峰值风险并生成削峰建\n\n议；\n\n      3. 办公区域温度应保持在24～27℃，消防、安防、数据机房等关键负荷不得自动削减；\n\n      4. 调节指令发出后60 秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班\n\n人员；\n\n      5. 策略、审批人、设备指令、执行结果和时间必须完整留痕；高风险策略必须由能源管理\n\n员确认后执行。\n\n  任务一：智能产品应用方案设计\n\n  （1）完成智能产品应用设计表\n\n智能产品       解决的业务问题   主要数据输入   系统输出或下游动作\n\n能源IoT 采集终端\n\nAI 负荷预测与能源优\n化平台\n\n智能控制网关\n\n  （2）完成运行规则表\n\n  根据题目给出的约束，填写判断条件和处理动作。\n\n情况             判断条件          处理动作\n\n能源数据连续缺失\n\n预测出现峰值风险\n\n调度方案触及运行边界\n\n控制指令执行失败\n\n  （3）绘制多产品协同流程图\n\n  根据题目给出的业务现状、智能产品和运行约束，自主设计多产品协同流程图。流程应体\n\n现不同智能产品之间的信息传递、业务判断及分支处理、人机协作和结果闭环。主要节点控制\n\n在6～8 个，节点顺序和分支逻辑应合理。\n\n  任务二：实施与运营设计\n\n  （1）计算并填写验收指标\n\n  建设目标为：最大用电负荷比现状降低12%；月均电费比现状降低8%；能源数据完整率\n\n达到99%以上；峰值风险平均响应时间缩短至5 分钟以内。\n\n指标          上线前    建设目标      验收目标值\n\n最大用电负荷            1680 kW     降低12%\n\n月均电费                125 万元    降低8%\n\n能源数据完整率          91%       达到99%以上\n\n峰值风险平均响应时间    25 分钟    缩短至5 分钟以内\n\n  （2）制定三阶段实施计划\n\n  项目总周期为8 周。按照“数据接入与基线建立—策略仿真与小范围试点—推广上线与指\n\n标验收”的顺序，填写各阶段关键任务、验收输出和主要责任人。\n\n阶段名称          时间周期   关键任务  验收输出  主要责任人\n\n数据接入与基线建立      第1～2 周\n\n策略仿真与小范围试点     第3～5 周\n\n推广上线与指标验收      第6～8 周\n\n  （3）明确人机协作边界，说明列出智能系统和工作人员的工作边界。\n\n  （4）制定运行风险控制措施，包括仪表离线或采集数据异常，负荷预测随季节和业态变\n\n化失准，控制指令未执行或设备状态异常。", "pages": [26, 28], "title": "任务1：智能产品应用方案设计", "prompts": ["（1）填写三类产品的业务问题、数据输入、输出/下游动作。", "（2）按约束填写缺失、峰值、运行边界、执行失败四项规则。", "（3）画多产品协同流程，主要节点 6～8 个，体现判断、人机协作及闭环。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T1-section-1\">\u003ch3 id=\"B3-T1-section-1\">（1）智能产品应用设计表\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>智能产品\u003c/th>\n\u003cth>解决的业务问题\u003c/th>\n\u003cth>主要数据输入\u003c/th>\n\u003cth>系统输出或下游动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>能源 IoT 采集终端\u003c/td>\n\u003ctd>数据不完整、离线发现晚\u003c/td>\n\u003ctd>电表、楼控、储能、充电设施的功率、电量、设备状态、时间\u003c/td>\n\u003ctd>带质量标记的标准数据，缺失重试与运维告警，传给 AI 平台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 负荷预测与能源优化平台\u003c/td>\n\u003ctd>高峰靠人工观察、设施缺少统一调度\u003c/td>\n\u003ctd>历史负荷、天气预报、工作日、活动、分时电价、设备约束\u003c/td>\n\u003ctd>未来 30 分钟负荷、峰值风险、削峰建议与待确认策略\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>智能控制网关\u003c/td>\n\u003ctd>执行慢、控制与反馈脱节\u003c/td>\n\u003ctd>经确认策略、设备编号、控制目标与边界、指令编号\u003c/td>\n\u003ctd>调节非关键空调、储能、充电功率，回传执行状态和时间\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T1-section-2\">\u003ch3 id=\"B3-T1-section-2\">（2）运行规则表\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>情况\u003c/th>\n\u003cth>判断条件\u003c/th>\n\u003cth>处理动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>能源数据连续缺失\u003c/td>\n\u003ctd>连续缺失超过 5 分钟\u003c/td>\n\u003ctd>重试并标记异常；仍无数据时用最近可靠值临时估计，标识估计值并通知运维\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>预测出现峰值风险\u003c/td>\n\u003ctd>未来 30 分钟预测负荷 ≥ 1500 kW\u003c/td>\n\u003ctd>生成削峰建议，考虑电价、设备及舒适性边界，高风险策略由能源管理员确认\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>调度方案触及运行边界\u003c/td>\n\u003ctd>可能使办公温度越出 24～27℃，或削减关键负荷\u003c/td>\n\u003ctd>拒绝执行，消防、安防、数据机房关键负荷不得自动削减；人员调整方案后重新校验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>控制指令执行失败\u003c/td>\n\u003ctd>发出后 60 秒内无成功反馈，含失败或超时\u003c/td>\n\u003ctd>停止继续下发，恢复安全策略，通知值班人员；记录失败与恢复结果\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T1-section-3\">\u003ch3 id=\"B3-T1-section-3\">（3）多产品协同流程图（主干 8 节点）\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>\u003cimg src=\"assets/f9e2a095617e5616910c16bf.svg\" alt=\"能源协同流程\">\u003c/p>\n\u003cul>\n\u003cli>数据带质量标记流转；估计值不能冒充实测。先检查安全边界和人工确认，再由网关执行。\u003c/li>\n\u003cli>主线为采集、缺失检查、预测、风险判断、策略确认、执行、反馈判断、记录；异常处置在侧支说明。\u003c/li>\n\u003cli>贯穿保存策略版本、审批人、设备指令、执行结果、时间和关联编号。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>你是某智慧园区运营企业的人工智能训练师，正在参与园区能源管理系统升级。园区包含办公楼、商业配套、地下车库、新能源汽车充电区和储能设备。经调研，目前能源管理存在以下问题：\u003c/p>\u003cp>1. 园区最大用电负荷为1680kW，高峰负荷主要依靠人工观察后处理，容易产生需量费用；\u003c/p>\u003cp>2. 月均电费约125 万元，空调、储能和充电设施缺少统一调度；\u003c/p>\u003cp>3. 能源数据完整率为91%，部分仪表离线后不能及时补偿或告警；\u003c/p>\u003cp>4. 从发现高峰风险到执行调节的平均时间为25 分钟，响应速度较慢；\u003c/p>\u003cp>5. 设备数据、预测结果、控制指令和执行反馈分散，无法形成完整追溯记录。\u003c/p>\u003cp>企业计划应用以下3 类智能产品：\u003c/p>\u003cp>- 能源IoT 采集终端；\u003c/p>\u003cp>- AI 负荷预测与能源优化平台；\u003c/p>\u003cp>- 智能控制网关。\u003c/p>\u003cp>园区现有电表、楼宇自控系统、储能系统和充电平台均可通过接口交换数据。AI 平台可结合历史负荷、天气预报、工作日类型、园区活动和分时电价，输出未来30 分钟负荷预测、峰值风险及推荐调度方案。智能控制网关可接收经过确认的策略，对非关键空调负荷、储能充放电和充电设施功率进行调节，并返回执行状态。\u003c/p>\u003cp>解决方案必须遵守以下约束：\u003c/p>\u003cp>1. 能源数据连续缺失超过5 分钟时，系统重试采集并标记异常；重试后仍无数据则使用最近可靠值形成临时估计，同时通知运维人员核查；\u003c/p>\u003cp>2. 预测未来30 分钟园区负荷达到或超过1500kW 时，系统判定为峰值风险并生成削峰建议；\u003c/p>\u003cp>3. 办公区域温度应保持在24～27℃，消防、安防、数据机房等关键负荷不得自动削减；\u003c/p>\u003cp>4. 调节指令发出后60 秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班人员；\u003c/p>\u003cp>5. 策略、审批人、设备指令、执行结果和时间必须完整留痕；高风险策略必须由能源管理员确认后执行。\u003c/p>\u003ch4>任务一：智能产品应用方案设计\u003c/h4>\u003cp>（1）完成智能产品应用设计表\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（1）智能产品应用设计表\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-products\">\u003ccolgroup>\u003ccol style=\"width:24%\">\u003ccol style=\"width:25%\">\u003ccol style=\"width:23%\">\u003ccol style=\"width:28%\">\u003c/colgroup>\u003ccaption>（1）智能产品应用设计表\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">智能产品\u003c/th>\u003cth scope=\"col\">解决的业务问题\u003c/th>\u003cth scope=\"col\">主要数据输入\u003c/th>\u003cth scope=\"col\">系统输出或下游动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">能源IoT采集终端\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">AI负荷预测与能源优化平台\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">智能控制网关\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（2）完成运行规则表根据题目给出的约束，填写判断条件和处理动作。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（2）运行规则表\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-rules\">\u003ccolgroup>\u003ccol style=\"width:29%\">\u003ccol style=\"width:31%\">\u003ccol style=\"width:40%\">\u003c/colgroup>\u003ccaption>（2）运行规则表\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">情况\u003c/th>\u003cth scope=\"col\">判断条件\u003c/th>\u003cth scope=\"col\">处理动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">能源数据连续缺失\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">预测出现峰值风险\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">调度方案触及运行边界\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">控制指令执行失败\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（3）绘制多产品协同流程图根据题目给出的业务现状、智能产品和运行约束，自主设计多产品协同流程图。流程应体现不同智能产品之间的信息传递、业务判断及分支处理、人机协作和结果闭环。主要节点控制在6～8 个，节点顺序和分支逻辑应合理。\u003c/p>\u003ch4>任务二：实施与运营设计\u003c/h4>\u003cp>（1）计算并填写验收指标建设目标为：最大用电负荷比现状降低12%；月均电费比现状降低8%；能源数据完整率达到99%以上；峰值风险平均响应时间缩短至5 分钟以内。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（1）验收指标\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-targets\">\u003ccolgroup>\u003ccol style=\"width:30%\">\u003ccol style=\"width:19%\">\u003ccol style=\"width:26%\">\u003ccol style=\"width:25%\">\u003c/colgroup>\u003ccaption>（1）验收指标\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">指标\u003c/th>\u003cth scope=\"col\">上线前\u003c/th>\u003cth scope=\"col\">建设目标\u003c/th>\u003cth scope=\"col\">验收目标值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">最大用电负荷\u003c/th>\u003ctd>1680 kW\u003c/td>\u003ctd>降低12%\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">月均电费\u003c/th>\u003ctd>125万元\u003c/td>\u003ctd>降低8%\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">能源数据完整率\u003c/th>\u003ctd>91%\u003c/td>\u003ctd>达到99%以上\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">峰值风险平均响应时间\u003c/th>\u003ctd>25分钟\u003c/td>\u003ctd>缩短至5分钟以内\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（2）制定三阶段实施计划项目总周期为8 周。按照“数据接入与基线建立—策略仿真与小范围试点—推广上线与指标验收”的顺序，填写各阶段关键任务、验收输出和主要责任人。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（2）三阶段实施计划\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-plan\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:14%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:20%\">\u003c/colgroup>\u003ccaption>（2）三阶段实施计划\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">阶段名称\u003c/th>\u003cth scope=\"col\">时间周期\u003c/th>\u003cth scope=\"col\">关键任务\u003c/th>\u003cth scope=\"col\">验收输出\u003c/th>\u003cth scope=\"col\">主要责任人\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">数据接入与基线建立\u003c/th>\u003ctd>第1～2周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">策略仿真与小范围试点\u003c/th>\u003ctd>第3～5周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">推广上线与指标验收\u003c/th>\u003ctd>第6～8周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（3）明确人机协作边界，说明列出智能系统和工作人员的工作边界。\u003c/p>\u003cp>（4）制定运行风险控制措施，包括仪表离线或采集数据异常，负荷预测随季节和业态变化失准，控制指令未执行或设备状态异常。\u003c/p>\u003c/div>"}, "B3-T2": {"id": "B3-T2", "exam": "B3", "exam_title": "智慧园区能源预测与智能调度解决方案设计", "source": "你是某智慧园区运营企业的人工智能训练师，正在参与园区能源管理系统升级。园区包含\n\n办公楼、商业配套、地下车库、新能源汽车充电区和储能设备。经调研，目前能源管理存在以\n\n下问题：\n\n      1. 园区最大用电负荷为1680kW，高峰负荷主要依靠人工观察后处理，容易产生需量费用；\n\n      2. 月均电费约125 万元，空调、储能和充电设施缺少统一调度；\n\n      3. 能源数据完整率为91%，部分仪表离线后不能及时补偿或告警；\n\n      4. 从发现高峰风险到执行调节的平均时间为25 分钟，响应速度较慢；\n\n      5. 设备数据、预测结果、控制指令和执行反馈分散，无法形成完整追溯记录。\n\n  企业计划应用以下3 类智能产品：\n\n       - 能源IoT 采集终端；\n\n       - AI 负荷预测与能源优化平台；\n\n       - 智能控制网关。\n\n  园区现有电表、楼宇自控系统、储能系统和充电平台均可通过接口交换数据。AI 平台可结\n\n合历史负荷、天气预报、工作日类型、园区活动和分时电价，输出未来30 分钟负荷预测、峰值\n\n风险及推荐调度方案。智能控制网关可接收经过确认的策略，对非关键空调负荷、储能充放电\n\n和充电设施功率进行调节，并返回执行状态。\n\n  解决方案必须遵守以下约束：\n\n      1. 能源数据连续缺失超过5 分钟时，系统重试采集并标记异常；重试后仍无数据则使用最\n\n近可靠值形成临时估计，同时通知运维人员核查；\n\n      2. 预测未来30 分钟园区负荷达到或超过1500kW 时，系统判定为峰值风险并生成削峰建\n\n议；\n\n      3. 办公区域温度应保持在24～27℃，消防、安防、数据机房等关键负荷不得自动削减；\n\n      4. 调节指令发出后60 秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班\n\n人员；\n\n      5. 策略、审批人、设备指令、执行结果和时间必须完整留痕；高风险策略必须由能源管理\n\n员确认后执行。\n\n  任务一：智能产品应用方案设计\n\n  （1）完成智能产品应用设计表\n\n智能产品       解决的业务问题   主要数据输入   系统输出或下游动作\n\n能源IoT 采集终端\n\nAI 负荷预测与能源优\n化平台\n\n智能控制网关\n\n  （2）完成运行规则表\n\n  根据题目给出的约束，填写判断条件和处理动作。\n\n情况             判断条件          处理动作\n\n能源数据连续缺失\n\n预测出现峰值风险\n\n调度方案触及运行边界\n\n控制指令执行失败\n\n  （3）绘制多产品协同流程图\n\n  根据题目给出的业务现状、智能产品和运行约束，自主设计多产品协同流程图。流程应体\n\n现不同智能产品之间的信息传递、业务判断及分支处理、人机协作和结果闭环。主要节点控制\n\n在6～8 个，节点顺序和分支逻辑应合理。\n\n  任务二：实施与运营设计\n\n  （1）计算并填写验收指标\n\n  建设目标为：最大用电负荷比现状降低12%；月均电费比现状降低8%；能源数据完整率\n\n达到99%以上；峰值风险平均响应时间缩短至5 分钟以内。\n\n指标          上线前    建设目标      验收目标值\n\n最大用电负荷            1680 kW     降低12%\n\n月均电费                125 万元    降低8%\n\n能源数据完整率          91%       达到99%以上\n\n峰值风险平均响应时间    25 分钟    缩短至5 分钟以内\n\n  （2）制定三阶段实施计划\n\n  项目总周期为8 周。按照“数据接入与基线建立—策略仿真与小范围试点—推广上线与指\n\n标验收”的顺序，填写各阶段关键任务、验收输出和主要责任人。\n\n阶段名称          时间周期   关键任务  验收输出  主要责任人\n\n数据接入与基线建立      第1～2 周\n\n策略仿真与小范围试点     第3～5 周\n\n推广上线与指标验收      第6～8 周\n\n  （3）明确人机协作边界，说明列出智能系统和工作人员的工作边界。\n\n  （4）制定运行风险控制措施，包括仪表离线或采集数据异常，负荷预测随季节和业态变\n\n化失准，控制指令未执行或设备状态异常。", "pages": [26, 28], "title": "任务2：实施与运营设计", "prompts": ["（1）计算四项验收目标值。", "（2）按第1～2、第3～5、第6～8周制定三阶段实施计划，总8周。", "（3）明确系统与工作人员的边界。", "（4）给出数据异常、预测失准、执行异常的运行风险控制。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T2-section-1\">\u003ch3 id=\"B3-T2-section-1\">（1）验收指标计算表\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>上线前\u003c/th>\n\u003cth>建设目标\u003c/th>\n\u003cth>验收目标值\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>最大用电负荷\u003c/td>\n\u003ctd>1680 kW\u003c/td>\n\u003ctd>降低 12%\u003c/td>\n\u003ctd>≤ 1680 × 0.88 = \u003cstrong>1478.4 kW\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>月均电费\u003c/td>\n\u003ctd>125 万元\u003c/td>\n\u003ctd>降低 8%\u003c/td>\n\u003ctd>≤ 125 × 0.92 = \u003cstrong>115 万元\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>能源数据完整率\u003c/td>\n\u003ctd>91%\u003c/td>\n\u003ctd>达到 99% 以上\u003c/td>\n\u003ctd>\u003cstrong>≥ 99%\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>峰值风险平均响应时间\u003c/td>\n\u003ctd>25 分钟\u003c/td>\n\u003ctd>缩短至 5 分钟以内\u003c/td>\n\u003ctd>\u003cstrong>≤ 5 分钟\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cul>\n\u003cli>1500 kW 是预测告警阈值，1478.4 kW 是建设验收目标，不能混为同一个数。\u003c/li>\n\u003cli>完整率 = 有效实测记录数/应采集记录数，临时估计不算有效实测；响应时间从风险发现到调节执行。\u003c/li>\n\u003cli>比较相近天气、业态、营业时间及电价条件，核对舒适性与关键负荷约束，不能用停业来制造“节能”。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T2-section-2\">\u003ch3 id=\"B3-T2-section-2\">（2）三阶段实施计划（共 8 周）\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>阶段\u003c/th>\n\u003cth>时间\u003c/th>\n\u003cth>关键任务\u003c/th>\n\u003cth>验收输出\u003c/th>\n\u003cth>主要责任人\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>数据接入与基线建立\u003c/td>\n\u003ctd>第 1～2 周\u003c/td>\n\u003ctd>接入四类系统，校验时间与数据，建立功率、电费和完整率基线，收集历史负荷、天气及电价训练初版预测模型\u003c/td>\n\u003ctd>接口与点位清单、质量报告、基线报告、初版模型与回测结果\u003c/td>\n\u003ctd>物业能源负责人、IT、仪表/接口工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>策略仿真与小范围试点\u003c/td>\n\u003ctd>第 3～5 周\u003c/td>\n\u003ctd>验证预测，仿真削峰，校验温度与关键负荷，演练审批和超时回退\u003c/td>\n\u003ctd>仿真报告、试点记录、异常演练与问题清单\u003c/td>\n\u003ctd>算法工程师、能源管理员、网关工程师\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>推广上线与指标验收\u003c/td>\n\u003ctd>第 6～8 周\u003c/td>\n\u003ctd>分批推广、人员培训、按同口径验收四指标，移交运维\u003c/td>\n\u003ctd>验收报告、审计记录、操作手册、回退方案\u003c/td>\n\u003ctd>项目负责人、运营/能源主管、供应商\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T2-section-3\">\u003ch3 id=\"B3-T2-section-3\">（3）人机协作边界\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>系统采集、检测缺失、预测、推荐、执行获批策略、检查反馈和留痕；安全规则不能被模型分数覆盖。\u003c/li>\n\u003cli>能源管理员确认高风险策略；运维核查异常仪表，值班人员处理执行失败和恢复，负责人确认验收。\u003c/li>\n\u003cli>人工不能在系统未知状态时默认执行成功；恢复后先核实设备状态，再按权限恢复调度。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B3-T2-section-4\">\u003ch3 id=\"B3-T2-section-4\">（4）运行风险控制措施\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>离线/异常数据\u003c/strong>：检查采集心跳与质量，超过 5 分钟按重试—临时估计—通知运维处理；估计值单独标识、不用于结算。每日核对完整率，关键测点可配冗余。\u003c/li>\n\u003cli>\u003cstrong>季节/业态漂移\u003c/strong>：按季节、楼栋监控预测误差，定期回测与更新；明显失准时降低自动化程度并回到保守策略。\u003c/li>\n\u003cli>\u003cstrong>未执行/设备异常\u003c/strong>：60 秒无成功反馈停止下发、恢复安全策略、通知人员，核查日志与设备实况，故障排除后再恢复。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>你是某智慧园区运营企业的人工智能训练师，正在参与园区能源管理系统升级。园区包含办公楼、商业配套、地下车库、新能源汽车充电区和储能设备。经调研，目前能源管理存在以下问题：\u003c/p>\u003cp>1. 园区最大用电负荷为1680kW，高峰负荷主要依靠人工观察后处理，容易产生需量费用；\u003c/p>\u003cp>2. 月均电费约125 万元，空调、储能和充电设施缺少统一调度；\u003c/p>\u003cp>3. 能源数据完整率为91%，部分仪表离线后不能及时补偿或告警；\u003c/p>\u003cp>4. 从发现高峰风险到执行调节的平均时间为25 分钟，响应速度较慢；\u003c/p>\u003cp>5. 设备数据、预测结果、控制指令和执行反馈分散，无法形成完整追溯记录。\u003c/p>\u003cp>企业计划应用以下3 类智能产品：\u003c/p>\u003cp>- 能源IoT 采集终端；\u003c/p>\u003cp>- AI 负荷预测与能源优化平台；\u003c/p>\u003cp>- 智能控制网关。\u003c/p>\u003cp>园区现有电表、楼宇自控系统、储能系统和充电平台均可通过接口交换数据。AI 平台可结合历史负荷、天气预报、工作日类型、园区活动和分时电价，输出未来30 分钟负荷预测、峰值风险及推荐调度方案。智能控制网关可接收经过确认的策略，对非关键空调负荷、储能充放电和充电设施功率进行调节，并返回执行状态。\u003c/p>\u003cp>解决方案必须遵守以下约束：\u003c/p>\u003cp>1. 能源数据连续缺失超过5 分钟时，系统重试采集并标记异常；重试后仍无数据则使用最近可靠值形成临时估计，同时通知运维人员核查；\u003c/p>\u003cp>2. 预测未来30 分钟园区负荷达到或超过1500kW 时，系统判定为峰值风险并生成削峰建议；\u003c/p>\u003cp>3. 办公区域温度应保持在24～27℃，消防、安防、数据机房等关键负荷不得自动削减；\u003c/p>\u003cp>4. 调节指令发出后60 秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班人员；\u003c/p>\u003cp>5. 策略、审批人、设备指令、执行结果和时间必须完整留痕；高风险策略必须由能源管理员确认后执行。\u003c/p>\u003ch4>任务一：智能产品应用方案设计\u003c/h4>\u003cp>（1）完成智能产品应用设计表\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（1）智能产品应用设计表\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-products\">\u003ccolgroup>\u003ccol style=\"width:24%\">\u003ccol style=\"width:25%\">\u003ccol style=\"width:23%\">\u003ccol style=\"width:28%\">\u003c/colgroup>\u003ccaption>（1）智能产品应用设计表\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">智能产品\u003c/th>\u003cth scope=\"col\">解决的业务问题\u003c/th>\u003cth scope=\"col\">主要数据输入\u003c/th>\u003cth scope=\"col\">系统输出或下游动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">能源IoT采集终端\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">AI负荷预测与能源优化平台\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">智能控制网关\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（2）完成运行规则表根据题目给出的约束，填写判断条件和处理动作。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（2）运行规则表\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-rules\">\u003ccolgroup>\u003ccol style=\"width:29%\">\u003ccol style=\"width:31%\">\u003ccol style=\"width:40%\">\u003c/colgroup>\u003ccaption>（2）运行规则表\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">情况\u003c/th>\u003cth scope=\"col\">判断条件\u003c/th>\u003cth scope=\"col\">处理动作\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">能源数据连续缺失\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">预测出现峰值风险\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">调度方案触及运行边界\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">控制指令执行失败\u003c/th>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（3）绘制多产品协同流程图根据题目给出的业务现状、智能产品和运行约束，自主设计多产品协同流程图。流程应体现不同智能产品之间的信息传递、业务判断及分支处理、人机协作和结果闭环。主要节点控制在6～8 个，节点顺序和分支逻辑应合理。\u003c/p>\u003ch4>任务二：实施与运营设计\u003c/h4>\u003cp>（1）计算并填写验收指标建设目标为：最大用电负荷比现状降低12%；月均电费比现状降低8%；能源数据完整率达到99%以上；峰值风险平均响应时间缩短至5 分钟以内。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（1）验收指标\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-targets\">\u003ccolgroup>\u003ccol style=\"width:30%\">\u003ccol style=\"width:19%\">\u003ccol style=\"width:26%\">\u003ccol style=\"width:25%\">\u003c/colgroup>\u003ccaption>（1）验收指标\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">指标\u003c/th>\u003cth scope=\"col\">上线前\u003c/th>\u003cth scope=\"col\">建设目标\u003c/th>\u003cth scope=\"col\">验收目标值\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">最大用电负荷\u003c/th>\u003ctd>1680 kW\u003c/td>\u003ctd>降低12%\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">月均电费\u003c/th>\u003ctd>125万元\u003c/td>\u003ctd>降低8%\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">能源数据完整率\u003c/th>\u003ctd>91%\u003c/td>\u003ctd>达到99%以上\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">峰值风险平均响应时间\u003c/th>\u003ctd>25分钟\u003c/td>\u003ctd>缩短至5分钟以内\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（2）制定三阶段实施计划项目总周期为8 周。按照“数据接入与基线建立—策略仿真与小范围试点—推广上线与指标验收”的顺序，填写各阶段关键任务、验收输出和主要责任人。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"（2）三阶段实施计划\">\u003ctable class=\"original-source-table\" data-source-table=\"energy-plan\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:14%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:20%\">\u003c/colgroup>\u003ccaption>（2）三阶段实施计划\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">阶段名称\u003c/th>\u003cth scope=\"col\">时间周期\u003c/th>\u003cth scope=\"col\">关键任务\u003c/th>\u003cth scope=\"col\">验收输出\u003c/th>\u003cth scope=\"col\">主要责任人\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">数据接入与基线建立\u003c/th>\u003ctd>第1～2周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">策略仿真与小范围试点\u003c/th>\u003ctd>第3～5周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">推广上线与指标验收\u003c/th>\u003ctd>第6～8周\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003ctd class=\"source-empty\" aria-label=\"原题留空\">\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>（3）明确人机协作边界，说明列出智能系统和工作人员的工作边界。\u003c/p>\u003cp>（4）制定运行风险控制措施，包括仪表离线或采集数据异常，负荷预测随季节和业态变化失准，控制指令未执行或设备状态异常。\u003c/p>\u003c/div>"}, "B4-T1": {"id": "B4-T1", "exam": "B4", "exam_title": "智能客服工单辅助系统上岗培训与现场指导方案设计", "source": "你作为人工智能训练师二级人员，需为三级/高级工及以下级别人员开展智能客服工单辅助\n\n系统培训。该系统可完成对话摘要、客户意图识别、知识条目推荐和回复草稿生成。请完成以\n\n下任务：\n\n  （1）编制一份智能客服工单辅助系统培训计划，分别写出1 项知识培训内容和1 项技术\n\n培训内容。\n\n  （2）针对技术培训中的“人工智能回复核验与纠错”，写出1 个最为优先的培训关键点，\n\n并制定相应的教学方法。\n\n  （3）简要阐述如何通过培训，使学员掌握知识依据核对、错误回复修订及不确定结果处\n\n理，写出培训思路。", "pages": [30, 30], "title": "任务1：培训计划、关键点与现场指导", "prompts": ["（1）培训计划分别写1项知识内容、1项技术内容。", "（2）对“AI回复核验与纠错”选1个最优先关键点，并设计教学方法。", "（3）说明如何教会知识依据核对、错误回复修订、不确定结果处理。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B4-T1-section-1\">\u003ch3 id=\"B4-T1-section-1\">（1）知识培训与技术培训计划\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>对象与目标\u003c/strong>：三级/高级工及以下人员；学会把系统当辅助工具，能够独立核验、修订并转交不确定问题。\u003c/li>\n\u003cli>\u003cstrong>知识培训 1 项\u003c/strong>：系统功能与职责边界，讲清摘要、意图识别、知识推荐、回复草稿的用途；强调人工负责发布，模型可能编造或引用过期知识。\u003c/li>\n\u003cli>\u003cstrong>技术培训 1 项\u003c/strong>：回复核验与纠错，用脱敏工单演示“查依据—核事实—修订—复核—发送/转人工”。\u003c/li>\n\u003cli>\u003cstrong>组织与考核\u003c/strong>：先讲解案例，再教师示范、学员跟做、独立操作；检查依据引用、错误修订和升级记录。课时按企业排班拟定，原题没有“两天”要求。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B4-T1-section-2\">\u003ch3 id=\"B4-T1-section-2\">（2）最优先关键点及教学方法\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>关键点\u003c/strong>：先核对有效知识依据与适用条件，再决定是否采用 AI 回复；不能只看语气是否流畅。\u003c/li>\n\u003cli>\u003cstrong>案例\u003c/strong>：草稿承诺“任何商品都能无条件退款”，学员查有效退款规则，指出品类、时限、渠道等条件，再修订承诺。\u003c/li>\n\u003cli>\u003cstrong>教法\u003c/strong>：展示正确与错误草稿 → 示范按条查证 → 分组练习 → 独立处理另一工单 → 说明依据并纠错复测。\u003c/li>\n\u003cli>给出核验清单：客户问题、知识版本/时效、适用条件、关键金额/时限、权限、是否需升级。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B4-T1-section-3\">\u003ch3 id=\"B4-T1-section-3\">（3）知识核对、错误修订与不确定结果处理\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>核对\u003c/strong>：定位当前有效知识条目，核对来源、版本、客户情境与适用范围，保留引用。\u003c/li>\n\u003cli>\u003cstrong>修订\u003c/strong>：标出错因，改正事实、条件和措辞，再与依据逐项核验；不擅自承诺优惠、赔偿或退款。\u003c/li>\n\u003cli>\u003cstrong>不确定\u003c/strong>：知识缺失、冲突、低置信度或超权限时，不猜测；补问必要信息或升级主管/专业人员。\u003c/li>\n\u003cli>\u003cstrong>成果与复测\u003c/strong>：提交原草稿、引用依据、修订稿与升级理由；用新案例独立复测，不能只以小组作品判断个人掌握。\u003c/li>\n\u003cli>\u003cstrong>讲—看—练—考\u003c/strong>：讲清“有据才发、错必修订、拿不准升级”；看教师完整演示；练正确、错误、无依据三类工单；独立考核后上岗。\u003c/li>\n\u003cli>\u003cstrong>考核例子\u003c/strong>：10条草稿核验正确率≥90%，并检查修订质量、升级判断；上岗首周抽查工单，发现问题再辅导。数值为课件拟定示例。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>你作为人工智能训练师二级人员，需为三级/高级工及以下级别人员开展智能客服工单辅助系统培训。该系统可完成对话摘要、客户意图识别、知识条目推荐和回复草稿生成。请完成以下任务：\u003c/p>\u003cp>（1）编制一份智能客服工单辅助系统培训计划，分别写出1 项知识培训内容和1 项技术培训内容。\u003c/p>\u003cp>（2）针对技术培训中的“人工智能回复核验与纠错”，写出1 个最为优先的培训关键点，并制定相应的教学方法。\u003c/p>\u003cp>（3）简要阐述如何通过培训，使学员掌握知识依据核对、错误回复修订及不确定结果处理，写出培训思路。\u003c/p>\u003c/div>"}, "C-T1": {"id": "C-T1", "exam": "C", "exam_title": "大型场馆智能客流预测与疏导系统产品设计及实现", "source": "某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集\n\n中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和\n\n执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\n\n  系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和\n\n近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调\n\n度建议，经值班负责人确认后发布，并记录执行结果。\n\n  任务一：产品功能定义\n\n  按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3\n\n项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\n\n    功能编号：F-XX\n\n    功能名称：\n\n    使用角色及触发条件：\n\n    功能行为：\n\n    输出结果：\n\n    验收标准：\n\n  任务二：产品方案设计\n\n  （1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统\n\n协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\n\n   （2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口\n\nforecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值\n\nqueue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\n\n  （3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\n\n   （4）写出3 项运营统计或审计内容。\n\n  任务三：产品规则配置与运行验证\n\n  （1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\n\n每个等级应说明判断依据、系统响应和业务处置方式。\n\n  （2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各\n\n状态的进入条件。\n\n  （3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工\n\n作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。", "pages": [32, 33], "title": "任务1：产品功能定义", "prompts": ["设计客流态势监测、疏导方案生成、处置反馈闭环三张功能卡。", "每卡包含编号、名称、角色与触发、行为、输出和1条量化验收标准。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T1-section-1\">\u003ch3 id=\"C-T1-section-1\">功能卡 F-01 · 客流态势监测\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>角色与触发\u003c/strong>：值班监控员；每场活动开启并持续运行。\u003c/li>\n\u003cli>\u003cstrong>行为\u003c/strong>：汇总闸机、票务、传感器和终端数据，计算人数/密度，结合容量及近期变化预测未来15分钟风险。\u003c/li>\n\u003cli>\u003cstrong>输出\u003c/strong>：区域热力看板、预测人数、风险等级及数据质量标记。\u003c/li>\n\u003cli>\u003cstrong>验收示例\u003c/strong>：人数刷新延迟≤10秒；未来15分钟预测 MAPE≤15%（零人数场景另约定误差口径）。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T1-section-2\">\u003ch3 id=\"C-T1-section-2\">功能卡 F-02 · 疏导方案生成\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>角色与触发\u003c/strong>：值班负责人；预测人数或排队等待达到阈值。\u003c/li>\n\u003cli>\u003cstrong>行为\u003c/strong>：生成入口分流、路线引导、人员调度方案，经负责人确认后发布。\u003c/li>\n\u003cli>\u003cstrong>输出\u003c/strong>：待确认方案、路线、岗位、预估缓解时间；发布后形成执行任务。\u003c/li>\n\u003cli>\u003cstrong>验收示例\u003c/strong>：触发到生成≤60秒，方案100%确认后发布。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T1-section-3\">\u003ch3 id=\"C-T1-section-3\">功能卡 F-03 · 处置反馈闭环\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>角色与触发\u003c/strong>：现场工作人员、值班负责人；任务发布后。\u003c/li>\n\u003cli>\u003cstrong>行为\u003c/strong>：回传执行状态，比对处置前后客流，未缓解则升级，结束后归档。\u003c/li>\n\u003cli>\u003cstrong>输出\u003c/strong>：执行记录、效果评价和可查询导出的任务档案。\u003c/li>\n\u003cli>\u003cstrong>验收示例\u003c/strong>：任务100%保留生成、确认、执行、反馈与归档记录。\u003c/li>\n\u003cli>以上量化验收值按指定课件设计，属于方案目标，不是已经实测达到的性能。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\u003c/p>\u003cp>系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调度建议，经值班负责人确认后发布，并记录执行结果。\u003c/p>\u003ch4>任务一：产品功能定义按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\u003c/h4>\u003cp>• 功能编号：F-XX\u003c/p>\u003cp>• 功能名称：\u003c/p>\u003cp>• 使用角色及触发条件：\u003c/p>\u003cp>• 功能行为：\u003c/p>\u003cp>• 输出结果：\u003c/p>\u003cp>• 验收标准：\u003c/p>\u003ch4>任务二：产品方案设计\u003c/h4>\u003cp>（1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\u003c/p>\u003cp>（2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口forecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值queue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\u003c/p>\u003cp>（3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\u003c/p>\u003cp>（4）写出3 项运营统计或审计内容。\u003c/p>\u003ch4>任务三：产品规则配置与运行验证\u003c/h4>\u003cp>（1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\u003c/p>\u003cp>每个等级应说明判断依据、系统响应和业务处置方式。\u003c/p>\u003cp>（2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各状态的进入条件。\u003c/p>\u003cp>（3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。\u003c/p>\u003c/div>"}, "C-T2": {"id": "C-T2", "exam": "C", "exam_title": "大型场馆智能客流预测与疏导系统产品设计及实现", "source": "某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集\n\n中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和\n\n执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\n\n  系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和\n\n近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调\n\n度建议，经值班负责人确认后发布，并记录执行结果。\n\n  任务一：产品功能定义\n\n  按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3\n\n项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\n\n    功能编号：F-XX\n\n    功能名称：\n\n    使用角色及触发条件：\n\n    功能行为：\n\n    输出结果：\n\n    验收标准：\n\n  任务二：产品方案设计\n\n  （1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统\n\n协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\n\n   （2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口\n\nforecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值\n\nqueue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\n\n  （3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\n\n   （4）写出3 项运营统计或审计内容。\n\n  任务三：产品规则配置与运行验证\n\n  （1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\n\n每个等级应说明判断依据、系统响应和业务处置方式。\n\n  （2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各\n\n状态的进入条件。\n\n  （3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工\n\n作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。", "pages": [32, 33], "title": "任务2：产品方案设计", "prompts": ["（1）协同流程主要节点6～8个，体现系统判断、人员协作和完整闭环。", "（2）JSON含 forecast_window_minutes、risk_threshold、queue_wait_threshold_minutes、manual_confirm_required。", "（3）设计输入输出接口，列来源/去向和关键字段。", "（4）写3项运营统计或审计内容。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T2-section-1\">\u003ch3 id=\"C-T2-section-1\">（1）系统协同流程图\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>\u003cimg src=\"assets/8f61cb15edc0f83aef72ed1e.svg\" alt=\"客流协同流程\">\u003c/p>\n\u003cul>\n\u003cli>多源接入→预测未来15分钟风险→阈值判断→生成方案→负责人确认→发布执行→反馈评估与归档。\u003c/li>\n\u003cli>数据异常先降级、通知核查；未缓解则升级方案并重新确认，不能自动结单。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T2-section-2\">\u003ch3 id=\"C-T2-section-2\">（2）运行参数配置 JSON\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-json\">{\n  &quot;forecast_window_minutes&quot;: 15,\n  &quot;risk_threshold&quot;: 0.85,\n  &quot;queue_wait_threshold_minutes&quot;: 10,\n  &quot;manual_confirm_required&quot;: true,\n  &quot;data_refresh_seconds&quot;: 10,\n  &quot;escalation_minutes&quot;: 10\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>risk_threshold\u003c/code> 是预测人数/区域容量，达到85%或排队等待≥10分钟生成方案；风险分级见下一题。\u003c/li>\n\u003cli>预测窗口15分钟为原题要求，其他数值按课件示例；JSON 内不写 \u003ccode>//\u003c/code> 注释。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T2-section-3\">\u003ch3 id=\"C-T2-section-3\">（3）数据输入输出接口\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>闸机/票务 → 平台\u003c/strong>：通道ID、方向、通过时间、票种、核验结果。\u003c/li>\n\u003cli>\u003cstrong>区域传感器 → 平台\u003c/strong>：区域ID、采样时间、人数、密度、排队等待和数据质量。\u003c/li>\n\u003cli>\u003cstrong>工作人员终端 → 平台\u003c/strong>：人员ID、岗位、任务ID、执行状态和反馈时间。\u003c/li>\n\u003cli>\u003cstrong>基础数据 → 平台\u003c/strong>：区域容量、活动场次与预售数据。\u003c/li>\n\u003cli>\u003cstrong>平台 → 负责人工作台\u003c/strong>：预测人数、风险等级、建议方案和确认状态。\u003c/li>\n\u003cli>\u003cstrong>平台 → 广播/屏显/终端\u003c/strong>：已确认任务ID、分流路线、岗位职责和生效时间。\u003c/li>\n\u003cli>\u003cstrong>平台 → 审计库\u003c/strong>：触发、方案版本、确认人、执行结果、效果和各环节时间。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T2-section-4\">\u003ch3 id=\"C-T2-section-4\">（4）三项运营统计或审计\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>预警质量\u003c/strong>：预警次数、拥堵命中率和误报率，按区域、活动和时段统计。\u003c/li>\n\u003cli>\u003cstrong>响应时效\u003c/strong>：触发→确认→发布→见效各环节耗时，检查是否满足时效要求（如确认≤2分钟）。\u003c/li>\n\u003cli>\u003cstrong>确认合规\u003c/strong>：检查100%确认后发布、有无越权及绕过确认，记录人员、时间、版本和操作结果。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\u003c/p>\u003cp>系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调度建议，经值班负责人确认后发布，并记录执行结果。\u003c/p>\u003ch4>任务一：产品功能定义按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\u003c/h4>\u003cp>• 功能编号：F-XX\u003c/p>\u003cp>• 功能名称：\u003c/p>\u003cp>• 使用角色及触发条件：\u003c/p>\u003cp>• 功能行为：\u003c/p>\u003cp>• 输出结果：\u003c/p>\u003cp>• 验收标准：\u003c/p>\u003ch4>任务二：产品方案设计\u003c/h4>\u003cp>（1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\u003c/p>\u003cp>（2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口forecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值queue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\u003c/p>\u003cp>（3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\u003c/p>\u003cp>（4）写出3 项运营统计或审计内容。\u003c/p>\u003ch4>任务三：产品规则配置与运行验证\u003c/h4>\u003cp>（1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\u003c/p>\u003cp>每个等级应说明判断依据、系统响应和业务处置方式。\u003c/p>\u003cp>（2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各状态的进入条件。\u003c/p>\u003cp>（3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。\u003c/p>\u003c/div>"}, "C-T3": {"id": "C-T3", "exam": "C", "exam_title": "大型场馆智能客流预测与疏导系统产品设计及实现", "source": "某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集\n\n中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和\n\n执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\n\n  系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和\n\n近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调\n\n度建议，经值班负责人确认后发布，并记录执行结果。\n\n  任务一：产品功能定义\n\n  按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3\n\n项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\n\n    功能编号：F-XX\n\n    功能名称：\n\n    使用角色及触发条件：\n\n    功能行为：\n\n    输出结果：\n\n    验收标准：\n\n  任务二：产品方案设计\n\n  （1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统\n\n协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\n\n   （2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口\n\nforecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值\n\nqueue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\n\n  （3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\n\n   （4）写出3 项运营统计或审计内容。\n\n  任务三：产品规则配置与运行验证\n\n  （1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\n\n每个等级应说明判断依据、系统响应和业务处置方式。\n\n  （2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各\n\n状态的进入条件。\n\n  （3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工\n\n作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。", "pages": [32, 33], "title": "任务3：规则配置与运行验证", "prompts": ["（1）至少3个风险等级，写判断依据、系统响应和业务处置。", "（2）任务从生成到结束的4个主要状态及进入条件。", "（3）分别用日常、高峰、数据异常场景验证业务条件、协同处理和最终记录。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T3-section-1\">\u003ch3 id=\"C-T3-section-1\">（1）三个风险等级与处置规则\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>先验证数据，命中多个条件按最高风险处理；人数占比指未来15分钟预测人数/区域容量。\u003c/li>\n\u003cli>\u003cstrong>蓝色·关注\u003c/strong>：占比70%～&lt;85%，或等待接近10分钟且未达更高等级；看板提示、准备方案和人员，不发布正式疏导任务。\u003c/li>\n\u003cli>\u003cstrong>黄色·预警\u003c/strong>：占比85%～&lt;95%，或等待≥10分钟，且未达红色；生成分流/引导方案，负责人确认后发布，启用备用通道并组织现场分流。\u003c/li>\n\u003cli>\u003cstrong>红色·紧急\u003c/strong>：占比≥95%，或实时密度触及场馆安全红线；紧急方案强提醒负责人及安保，确认后广播执行，暂停相关入口、增派安保，必要时启动应急预案。\u003c/li>\n\u003cli>占比&lt;70%且等待正常时常态监测。接近阈值的提前提醒区间应在实施时约定；安全红线依据场馆核定，不能随意拟定密度。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T3-section-2\">\u003ch3 id=\"C-T3-section-2\">（2）疏导任务的四个主要状态\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>待确认\u003c/strong>：达到阈值生成方案，等待负责人审核，尚未发布。\u003c/li>\n\u003cli>\u003cstrong>执行中\u003c/strong>：负责人确认并发布，工作人员接单执行，保留确认及执行时间。\u003c/li>\n\u003cli>\u003cstrong>效果观察\u003c/strong>：现场回报动作已完成，系统观察客流；10分钟仍未缓解则升级方案回到待确认。\u003c/li>\n\u003cli>\u003cstrong>已结束\u003c/strong>：风险回落并稳定，经核实后关闭归档；活动结束也须核查现场安全。驳回取消可记为结束，但须标明取消原因，不能计作成功疏导。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"C-T3-section-3\">\u003ch3 id=\"C-T3-section-3\">（3）三类运行场景验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>日常\u003c/strong>：预测占比50%、等待2分钟→常态看板和人员巡查→保留监测日志，不生成任务。\u003c/li>\n\u003cli>\u003cstrong>高峰\u003c/strong>：预测占比90%、等待8分钟→黄色方案→负责人2分钟内确认→广播/屏显/终端发布→人员执行→效果观察→风险解除后结束；未缓解则升级并再确认。\u003c/li>\n\u003cli>\u003cstrong>数据异常\u003c/strong>：传感器离线或不更新→标记降级，停止依赖该数据自动触发，用相邻区域/闸机作带标记的临时估计，通知运维及现场核查→记录离线起止、估计方式、处置人和恢复时间。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某大型体育场馆在演唱会和体育赛事散场时，入口、通道和停车接驳区会出现短时客流集中。现有系统只能显示当前人数，无法提前判断拥堵风险，也不能形成疏导方案、人员调度和执行反馈的闭环。场馆计划建设智能客流预测与疏导系统。\u003c/p>\u003cp>系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据，结合区域容量和近期客流变化预测未来15 分钟风险。预测达到阈值时，系统生成入口分流、路线引导和人员调度建议，经值班负责人确认后发布，并记录执行结果。\u003c/p>\u003ch4>任务一：产品功能定义按照下列功能卡模板，分别设计“客流态势监测”“疏导方案生成”“处置反馈闭环”3项功能。每项功能应写明使用角色、触发条件、功能行为、输出结果和1 条可量化验收标准。\u003c/h4>\u003cp>• 功能编号：F-XX\u003c/p>\u003cp>• 功能名称：\u003c/p>\u003cp>• 使用角色及触发条件：\u003c/p>\u003cp>• 功能行为：\u003c/p>\u003cp>• 输出结果：\u003c/p>\u003cp>• 验收标准：\u003c/p>\u003ch4>任务二：产品方案设计\u003c/h4>\u003cp>（1）绘制系统协同流程图。根据大型场馆客流管理业务，绘制智能客流预测与疏导系统协同流程图。流程应体现系统处理、业务判断及人员协作的完整闭环，主要节点控制在6～8 个。\u003c/p>\u003cp>（2 ）给出运行参数配置示例（JSON 格式），至少包含预测时间窗口forecast_window_minutes 、客流风险阈值  risk_threshold 、排队等待阈值queue_wait_threshold_minutes 和人工确认开关manual_confirm_required。\u003c/p>\u003cp>（3）设计系统的数据输入输出接口，说明输入来源及关键字段、输出去向及关键字段。\u003c/p>\u003cp>（4）写出3 项运营统计或审计内容。\u003c/p>\u003ch4>任务三：产品规则配置与运行验证\u003c/h4>\u003cp>（1）结合场馆客流变化特点，设计客流风险分级与处置规则，设置不少于3 个风险等级。\u003c/p>\u003cp>每个等级应说明判断依据、系统响应和业务处置方式。\u003c/p>\u003cp>（2）设计疏导任务的状态流转规则，给出任务从生成到结束的4 个主要状态，并说明各状态的进入条件。\u003c/p>\u003cp>（3）分别针对日常客流、高峰风险和数据异常3 类运行场景，说明业务条件、系统与工作人员的协同处理过程以及最终记录结果，用于验证产品方案的可实施性。\u003c/p>\u003c/div>"}};const records=[{"id": 1, "group": "A 理论简答", "title": "简答1：事件日志、职责分离和持续监控", "level": "改写", "sources": [{"page": 15, "where": "简答1题干", "quote": "申请、复核和放款由不同角色完成"}, {"page": 11, "where": "单选47题干", "quote": "所有查看敏感条款的操作都必须记录操作者、时间和对象，并保留180天"}, {"page": 1, "where": "判断3题干", "quote": "审计记录能够支持责任追溯"}, {"page": 5, "where": "单选17正确选项C", "quote": "协调跨部门流程绩效并推动持续改进"}], "answer": "按“申请→复核→放款”建立标准流程，三个环节由不同角色完成；日志记录工单对象、操作者、角色、时间和操作活动；保留日志支持责任追溯，持续检查并推动整改。", "remaining": "日志的工单号、活动、前后状态等字段还要补；符合性检查、违规判定和整改方法不能只抄标题。180天是合同系统那一题的条件，不能直接当成本题信贷日志的固定期限。", "tasks": ["A-SA-1"]}, {"id": 2, "group": "A 理论简答", "title": "简答2：广告增量评估中的分层比较和混杂因素", "level": "可摘片段", "sources": [{"page": 6, "where": "单选23正确选项C", "quote": "按渠道分层比较转化率并评估流量结构效应"}], "answer": "按渠道分层比较转化率并评估流量结构效应，避免渠道流量结构变化干扰效果判断。", "remaining": "这一句只覆盖混杂因素处理；对照组、随机实验或准实验、置信区间以及广告成本收益仍要自己写。新增和收入一起上升不能直接证明广告带来增量。", "tasks": ["A-SA-2"]}, {"id": 3, "group": "A 理论简答", "title": "简答3：模型评估中的独立测试与防泄漏", "level": "可摘片段", "sources": [{"page": 7, "where": "单选25正确选项C", "quote": "在模型选择完成后进行相对独立的最终评估"}, {"page": 14, "where": "多选5正确选项A", "quote": "在每个交叉验证训练折内重新拟合特征选择步骤"}, {"page": 14, "where": "多选5正确选项C", "quote": "把特征选择、预处理和模型训练封装在同一验证流程中"}, {"page": 14, "where": "多选5正确选项D", "quote": "保留未参与特征选择与调参的独立测试集用于最终评估"}], "answer": "保留未参与特征选择与调参的独立测试集用于最终评估；预处理、特征选择与模型训练放在同一验证流程中，相关步骤只在各训练折拟合。", "remaining": "时间序列题必须补上按时间先后切分、未来四周预测窗口和滚动回测；普通交叉验证写法不能替代时间顺序。基线与误差指标在题干里没有现成答案。", "tasks": ["A-SA-3"]}, {"id": 4, "group": "A 理论简答", "title": "简答4：分群性能和输入质量", "level": "可摘片段", "sources": [{"page": 14, "where": "多选7正确选项A", "quote": "同时查看少数类精确率、召回率以及PR曲线表现"}, {"page": 14, "where": "多选7正确选项B", "quote": "结合误报和漏报代价检查不同阈值下的混淆矩阵"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}, {"page": 14, "where": "多选3正确选项B", "quote": "检查地址等必填属性缺失情况的完整性"}, {"page": 14, "where": "多选3正确选项D", "quote": "检查源系统变化能否在规定时间内同步的及时性"}], "answer": "分别报告少数类和重要业务分群上的性能及样本量，同时查看精确率、召回率和混淆矩阵；检查输入字段缺失和数据同步延迟。", "remaining": "把“地址”改成本模型实际输入字段。告警阈值、人工复核、再训练触发、灰度上线及回滚要补充，不能靠这几句完成整题。", "tasks": ["A-SA-4"]}, {"id": 5, "group": "A 理论简答", "title": "简答5：标签一致性、测试集和长尾指标", "level": "可摘片段", "sources": [{"page": 2, "where": "单选1正确选项B", "quote": "暂停受影响批次，记录分歧，统一规则后复核"}, {"page": 14, "where": "多选5正确选项D", "quote": "保留未参与特征选择与调参的独立测试集用于最终评估"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}], "answer": "标注口径发生分歧时，记录分歧、统一规则后复核；保留独立测试集用于最终评估；分别报告少数类性能及样本量。", "remaining": "标签定义手册、长尾抽样、双人标注与仲裁、同一投诉去重隔离、Macro-F1及错误分析仍要自己展开。", "tasks": ["A-SA-5"]}, {"id": 6, "group": "A 理论简答", "title": "简答6：无障碍检查与定性证据", "level": "可摘片段", "sources": [{"page": 10, "where": "单选44正确选项B", "quote": "增加文字或图标标识，同时保证足够的颜色对比"}, {"page": 12, "where": "单选50正确选项C", "quote": "情境访谈与现场观察"}, {"page": 15, "where": "简答6题干", "quote": "让老年用户和视障用户都能独立完成身份核验"}], "answer": "招募老年用户和视障用户，安排独立完成身份核验的任务；增加文字或图标标识，同时保证足够的颜色对比；结合情境访谈与现场观察收集定性证据。", "remaining": "读屏、键盘与焦点、缩放、任务完成率与耗时、问题严重性分级及修复后复测还要写。题目没有给每组人数和具体对比度数值。", "tasks": ["A-SA-6"]}, {"id": 7, "group": "B1.1 质检", "title": "任务一：四个业务模块的名字和作用", "level": "改写", "sources": [{"page": 17, "where": "业务规则1", "quote": "先检查图像质量"}, {"page": 17, "where": "业务规则2", "quote": "图像可用时按分数分流"}, {"page": 17, "where": "业务规则3", "quote": "人工复核具有裁定权"}, {"page": 17, "where": "业务规则5", "quote": "必须记录状态"}], "answer": "①图像采集与质量检查：检查图像是否可用；②模型检测与分流：图像可用时按分数分流；③人工复核与隔离处置：由质检人员裁定并处理隔离品；④状态记录与包装控制：记录当前有效状态，只允许已放行产品进入包装。", "remaining": "四个模块名称是把规则归纳为模块后的写法，PDF没有逐字给出这四个名称；图像绑定产品编号和模型版本等追溯细节需要补。", "tasks": ["B1.1-T1"]}, {"id": 8, "group": "B1.1 质检", "title": "任务一：系统与质检人员职责边界", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行；大于或等于0.20且小于0.80，转人工复核；大于或等于0.80，自动隔离待质量人员处理"}, {"page": 17, "where": "业务规则3", "quote": "人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格"}, {"page": 17, "where": "业务规则4", "quote": "隔离产品由质量人员按企业标准决定放行、返工或报废"}], "answer": "系统按既定分数规则分流；质检员负责人工复核，质量主管处理无法判断的产品；隔离品由质量人员决定放行、返工或报废。", "remaining": "前半句只加了“系统负责”作衔接。模型分数不能代替最终质量结论，可补抄第16页的说明。", "tasks": ["B1.1-T1"]}, {"id": 9, "group": "B1.1 质检", "title": "任务一：追溯记录里能直接找到的字段", "level": "可摘片段", "sources": [{"page": 17, "where": "试运行记录表表头", "quote": "产品编号"}, {"page": 17, "where": "试运行记录表表头", "quote": "批次"}, {"page": 17, "where": "试运行记录表表头", "quote": "图像质量"}, {"page": 17, "where": "试运行记录表表头", "quote": "模型缺陷分数"}, {"page": 17, "where": "试运行记录表表头", "quote": "人工最终结论"}, {"page": 17, "where": "业务规则5", "quote": "人工改判需要记录人员、理由及时间"}], "answer": "字段可以直接取：产品编号、批次、图像质量、模型缺陷分数、人工最终结论，以及人工改判人员、理由、时间。", "remaining": "题目还要求输入/输出方向及来源/去向，须自行组织为“相机→系统、模型→规则模块、质检员→状态库、系统→包装”；图像编号、模型版本等结合第17页背景第4点补全。", "tasks": ["B1.1-T1"]}, {"id": 10, "group": "B1.1 质检", "title": "任务二：规则表——图像不可用", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则1", "quote": "模糊、严重反光或主体不完整时，原分数无效，先补拍一次"}, {"page": 17, "where": "业务规则1", "quote": "补拍后仍不可用，转质检员检查实物，不得自动放行"}], "answer": "条件：图像模糊、严重反光或主体不完整。动作：原分数无效，先补拍一次。去向：补拍后仍不可用，转质检员检查实物，不得自动放行。", "remaining": "将原文拆成“条件—处理动作—后续去向”三列即可。后续人工处理可接业务规则3。", "tasks": ["B1.1-T2"]}, {"id": 11, "group": "B1.1 质检", "title": "任务二：规则表——低分、中分、高分", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行"}, {"page": 17, "where": "业务规则2", "quote": "大于或等于0.20且小于0.80，转人工复核"}, {"page": 17, "where": "业务规则2", "quote": "大于或等于0.80，自动隔离待质量人员处理"}, {"page": 17, "where": "业务规则5", "quote": "只有当前有效状态为“已放行”的产品才能进入包装"}], "answer": "图像可用且分数\u003c0.20：自动放行，状态已放行才可包装；0.20≤分数\u003c0.80：转人工复核；分数≥0.80：自动隔离，交质量人员处理。", "remaining": "每一行都要保留“图像可用”这一前提，不能只看分数。0.20属于人工复核，0.80属于隔离。", "tasks": ["B1.1-T2"]}, {"id": 12, "group": "B1.1 质检", "title": "任务二：复核、隔离与返工后续路径", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则3", "quote": "人工确认合格可放行，确认不合格应隔离"}, {"page": 17, "where": "业务规则3", "quote": "暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格"}, {"page": 17, "where": "业务规则4", "quote": "返工完成后重新进入检测流程，不直接送包装"}], "answer": "人工合格→放行；人工不合格→隔离；无法判断→保持待检、质量主管继续处理；返工完成→重新检测。", "remaining": "把原文转换成箭头即可用于流程图，但仍需自己画节点及连线。", "tasks": ["B1.1-T2"]}, {"id": 13, "group": "B1.1 质检", "title": "任务二：P004与P005走哪条路径", "level": "结合原文推导", "sources": [{"page": 17, "where": "P004行", "quote": "模糊"}, {"page": 17, "where": "P005行", "quote": "0.12"}, {"page": 17, "where": "业务规则1", "quote": "原分数无效，先补拍一次"}, {"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行"}, {"page": 17, "where": "试运行记录说明", "quote": "人工结论不是预先可用的输入"}], "answer": "P004图像模糊，原0.04分无效，先补拍，仍不可用才转实物检查；P005图像清晰、0.12\u003c0.20，按拟上线规则自动放行。", "remaining": "这两条结论是“表格事实＋规则”推导出来的，原题没有现成完整句。不能先读取人工最终结论，把P005直接写成隔离。", "tasks": ["B1.1-T2"]}, {"id": 14, "group": "B1.1 质检", "title": "任务三：改进问题本身可以抄，改进方法不能抄", "level": "只给线索", "sources": [{"page": 17, "where": "背景第2点", "quote": "浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷"}, {"page": 17, "where": "P005人工说明", "quote": "细小凹陷漏检"}, {"page": 17, "where": "P006人工说明", "quote": "反光被误判为缺陷"}], "answer": "P005针对细小凹陷漏检；P006针对反光被误判为缺陷。", "remaining": "增加难例、优化光照、调模型或阈值、独立测试集验证、漏放率和误拦截率等，均需要自己补，不能把问题描述当成改进措施。", "tasks": ["B1.1-T3"]}, {"id": 15, "group": "B1.2 会议室", "title": "任务二：改进措施及其业务方向", "level": "可摘片段", "sources": [{"page": 20, "where": "业务背景", "quote": "智能提醒、预约确认和空间匹配"}, {"page": 21, "where": "预约效率优化任务", "quote": "为预约提醒和会议室释放策略提供依据"}, {"page": 22, "where": "空间匹配优化任务", "quote": "为空间分配提供依据"}], "answer": "预约效率：采用智能提醒、预约确认和会议室释放策略，减少无效占用；空间匹配：按会议需求匹配房间，为空间分配提供依据。", "remaining": "“减少无效占用”是结合问题补的业务价值。午间/傍晚爽约率、冬青室/星河室候选等发现必须从CSV计算，PDF没有给结果。", "tasks": ["B1.2-T2"]}, {"id": 16, "group": "B1.2 会议室", "title": "任务三：AI方案的数据及不能用的事后字段", "level": "可摘片段", "sources": [{"page": 21, "where": "预约记录表", "quote": "提交预约时间"}, {"page": 21, "where": "预约记录表", "quote": "预约开始时间"}, {"page": 21, "where": "预约记录表", "quote": "预约时段"}, {"page": 21, "where": "预约记录表", "quote": "预约部门"}, {"page": 21, "where": "预约记录表", "quote": "最终预约状态"}, {"page": 21, "where": "会议室资料表", "quote": "核定座位数"}], "answer": "字段可以从表中拿：提交预约时间、预约开始时间、时段、部门、会议室及容量；历史最终预约状态可以构造爽约标签。", "remaining": "字段名是现成的，但选择哪些作为特征、何时可获得要判断；最终状态和实际人数不能作为预约前预测的事先输入。算法模型、验证方式不在PDF里。", "tasks": ["B1.2-T3"]}, {"id": 17, "group": "B1.2 会议室", "title": "M1—M4：能从PDF复制的代码材料", "level": "字段可复制", "sources": [{"page": 21, "where": "字段说明", "quote": "booking_id"}, {"page": 21, "where": "字段说明", "quote": "room_id"}, {"page": 21, "where": "字段说明", "quote": "time_slot"}, {"page": 21, "where": "字段说明", "quote": "status"}, {"page": 21, "where": "字段说明", "quote": "attendees"}, {"page": 21, "where": "资料表字段", "quote": "capacity"}, {"page": 21, "where": "读取编码说明", "quote": "encoding=\"utf-8-sig\""}], "answer": "可复制字段名、状态值“已使用/爽约/已取消”、文件名和读取编码。", "remaining": "drop_duplicates、groupby、agg、merge、query等操作写法，以及used_count、avg_seat_util等自定义列名不是PDF给出的答案。12座、20场、40%是Notebook模板里的条件，不在这份PDF正文。", "tasks": ["B1.2-T1"]}, {"id": 18, "group": "B2 冷链", "title": "任务一、二：字段和算法/指标名称", "level": "字段可复制", "sources": [{"page": 23, "where": "字段表", "quote": "shipment_id"}, {"page": 23, "where": "字段表", "quote": "cargo_type"}, {"page": 24, "where": "字段表", "quote": "avg_temp"}, {"page": 24, "where": "字段表", "quote": "sensor_missing_rate"}, {"page": 24, "where": "字段表", "quote": "temp_alarm"}, {"page": 24, "where": "任务一", "quote": "按货物类型的中位数填补平均温度缺失值"}, {"page": 24, "where": "任务二", "quote": "采用分层随机划分形成训练集和测试集"}, {"page": 24, "where": "任务二", "quote": "训练随机森林分类器"}, {"page": 24, "where": "任务二", "quote": "计算精确率、召回率、F1值和混淆矩阵"}], "answer": "方法名、字段名和指标名能从题目拿；照着题目顺序完成“分组中位数填补→分层划分→随机森林→分类指标”。", "remaining": "Python语法、划分比例、100棵树/深度6等具体参数在Notebook模板中；清洗后1578条、模型指标和分货物表现要运行得到，不能说是从PDF抄到的。", "tasks": ["B2-T1", "B2-T2"]}, {"id": 19, "group": "B2 冷链", "title": "任务三：优先指标及分货物表现", "level": "可摘片段", "sources": [{"page": 14, "where": "多选7正确选项A", "quote": "同时查看少数类精确率、召回率以及PR曲线表现"}, {"page": 14, "where": "多选7正确选项B", "quote": "结合误报和漏报代价检查不同阈值下的混淆矩阵"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}], "answer": "结合误报和漏报代价检查混淆矩阵，分别报告各货物类型的性能及样本量；在冷链异常预警中优先关注异常召回率。", "remaining": "“优先召回率”及“漏报会漏掉温控异常、影响货物质量”的理由是结合业务推导的，不是本题原文已经给出的结论。补充异常样本、调阈值、独立验证等改进仍要自己提出。", "tasks": ["B2-T3"]}, {"id": 20, "group": "B3 能源", "title": "任务一（1）：三种产品名称、输入和输出", "level": "大段可摘", "sources": [{"page": 26, "where": "智能产品清单", "quote": "能源IoT采集终端"}, {"page": 27, "where": "智能产品清单", "quote": "AI负荷预测与能源优化平台"}, {"page": 27, "where": "智能产品清单", "quote": "智能控制网关"}, {"page": 27, "where": "产品说明", "quote": "历史负荷、天气预报、工作日类型、园区活动和分时电价"}, {"page": 27, "where": "产品说明", "quote": "输出未来30分钟负荷预测、峰值风险及推荐调度方案"}, {"page": 27, "where": "产品说明", "quote": "智能控制网关可接收经过确认的策略"}, {"page": 27, "where": "产品说明", "quote": "对非关键空调负荷、储能充放电和充电设施功率进行调节，并返回执行状态"}], "answer": "AI平台输入：历史负荷、天气预报、工作日类型、园区活动和分时电价；输出：未来30分钟负荷预测、峰值风险及推荐调度方案。网关输入：经过确认的策略；输出/动作：调节非关键空调、储能充放电和充电设施功率，返回执行状态。", "remaining": "IoT输入可用第27页的电表、楼控、储能、充电平台归纳；“解决的业务问题”要对应第26页五项现状，写成数据缺失、人工响应慢、缺少统一调度等。", "tasks": ["B3-T1"]}, {"id": 21, "group": "B3 能源", "title": "任务一（2）：规则表——数据缺失", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束1", "quote": "能源数据连续缺失超过5分钟时，系统重试采集并标记异常"}, {"page": 27, "where": "约束1", "quote": "重试后仍无数据则使用最近可靠值形成临时估计，同时通知运维人员核查"}], "answer": "判断条件：连续缺失超过5分钟。处理动作：重试采集并标记异常；仍无数据，使用最近可靠值临时估计并通知运维核查。", "remaining": "注意是“超过5分钟”，并保留“重试后仍无数据”的顺序；估计值不能说成有效实测数据。", "tasks": ["B3-T1"]}, {"id": 22, "group": "B3 能源", "title": "任务一（2）：规则表——峰值风险", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束2", "quote": "预测未来30分钟园区负荷达到或超过1500kW时，系统判定为峰值风险并生成削峰建议"}], "answer": "判断条件：预测未来30分钟负荷≥1500kW。处理动作：判定峰值风险并生成削峰建议。", "remaining": "高风险策略的人工确认要求接约束5。1500kW是告警阈值，不是建设目标1478.4kW。", "tasks": ["B3-T1"]}, {"id": 23, "group": "B3 能源", "title": "任务一（2）：规则表——运行边界", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束3", "quote": "办公区域温度应保持在24～27℃"}, {"page": 27, "where": "约束3", "quote": "消防、安防、数据机房等关键负荷不得自动削减"}], "answer": "判断条件：策略可能使办公温度超出24～27℃，或自动削减关键负荷。处理动作：不执行该越界策略，保证温度和关键负荷约束。", "remaining": "温度范围及不得削减的对象直接抄；“不执行/调整策略”是为了填动作栏作的必要改写。", "tasks": ["B3-T1"]}, {"id": 24, "group": "B3 能源", "title": "任务一（2）：规则表——执行失败", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束4", "quote": "调节指令发出后60秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班人员"}], "answer": "判断条件：指令发出后60秒内未收到成功反馈。处理动作：停止继续下发、恢复安全策略、通知值班人员。", "remaining": "这一行几乎照原文分列填写即可；别把“未收到成功反馈”写成“肯定执行成功”。", "tasks": ["B3-T1"]}, {"id": 25, "group": "B3 能源", "title": "任务一（3）及任务二（3）：流程、人机边界与审计记录", "level": "大段可摘", "sources": [{"page": 27, "where": "约束5", "quote": "策略、审批人、设备指令、执行结果和时间必须完整留痕"}, {"page": 27, "where": "约束5", "quote": "高风险策略必须由能源管理员确认后执行"}, {"page": 27, "where": "约束1", "quote": "同时通知运维人员核查"}, {"page": 27, "where": "约束4", "quote": "恢复安全策略并通知值班人员"}], "answer": "系统采集数据、预测、推荐、执行已确认策略、返回反馈并留痕；能源管理员确认高风险策略，运维核查数据异常，值班人员处理执行异常。留痕字段直接用策略、审批人、设备指令、执行结果和时间。", "remaining": "流程图仍需将这些动作组合为6～8个主节点；不要把“系统给建议”改成“系统无条件执行高风险策略”。", "tasks": ["B3-T1", "B3-T2"]}, {"id": 26, "group": "B3 能源", "title": "任务二（1）：四项验收值里哪些能抄", "level": "两项直接抄，两项计算", "sources": [{"page": 28, "where": "验收目标", "quote": "最大用电负荷比现状降低12%"}, {"page": 28, "where": "验收目标", "quote": "月均电费比现状降低8%"}, {"page": 28, "where": "验收目标", "quote": "能源数据完整率达到99%以上"}, {"page": 28, "where": "验收目标", "quote": "峰值风险平均响应时间缩短至5分钟以内"}], "answer": "完整率：≥99%；平均响应时间：≤5分钟。这两个目标值可直接由题目换成符号。最大负荷：1680×(1−12%)=1478.4kW；月电费：125×(1−8%)=115万元。", "remaining": "1478.4kW和115万元是计算结果，不能归类为原题直接给出的现成数值。", "tasks": ["B3-T2"]}, {"id": 27, "group": "B3 能源", "title": "任务二（2）：三阶段名称及时间", "level": "直接摘抄框架", "sources": [{"page": 28, "where": "实施计划表", "quote": "数据接入与基线建立"}, {"page": 28, "where": "实施计划表", "quote": "第1～2周"}, {"page": 28, "where": "实施计划表", "quote": "策略仿真与小范围试点"}, {"page": 28, "where": "实施计划表", "quote": "第3～5周"}, {"page": 28, "where": "实施计划表", "quote": "推广上线与指标验收"}, {"page": 28, "where": "实施计划表", "quote": "第6～8周"}], "answer": "数据接入与基线建立：第1～2周；策略仿真与小范围试点：第3～5周；推广上线与指标验收：第6～8周。", "remaining": "题目已经给好阶段和周数，别再背；关键任务、验收输出、主要责任人三列仍须填写。", "tasks": ["B3-T2"]}, {"id": 28, "group": "B3 能源", "title": "任务二（4）：运行风险控制中的两类现成措施", "level": "直接摘抄两类", "sources": [{"page": 27, "where": "约束1", "quote": "系统重试采集并标记异常"}, {"page": 27, "where": "约束1", "quote": "使用最近可靠值形成临时估计，同时通知运维人员核查"}, {"page": 27, "where": "约束4", "quote": "停止继续下发，恢复安全策略并通知值班人员"}], "answer": "仪表离线/数据异常：重试、标记、临时估计、通知运维。控制失败/设备异常：停止继续下发、恢复安全策略、通知值班。", "remaining": "季节或业态变化导致预测失准的监控、重训、回退措施没有现成完整答案，必须自己补。", "tasks": ["B3-T2"]}, {"id": 29, "group": "B4 客服培训", "title": "第（1）问：知识培训内容的核心可以抄", "level": "可摘片段", "sources": [{"page": 30, "where": "业务背景", "quote": "该系统可完成对话摘要、客户意图识别、知识条目推荐和回复草稿生成"}, {"page": 30, "where": "培训对象", "quote": "三级/高级工及以下级别人员"}], "answer": "知识培训：向三级/高级工及以下人员讲解系统的对话摘要、客户意图识别、知识条目推荐和回复草稿生成功能及使用边界。", "remaining": "四个系统功能直接抄；“培训计划”的目标、教法、考核及边界说明需要组织。技术培训可以用题干给的主题“人工智能回复核验与纠错”，但主题名不是完整培训方案。", "tasks": ["B4-T1"]}, {"id": 30, "group": "B4 客服培训", "title": "第（2）（3）问：能抄的只有主题和答题骨架", "level": "只给框架", "sources": [{"page": 30, "where": "第（2）问", "quote": "人工智能回复核验与纠错"}, {"page": 30, "where": "第（3）问", "quote": "知识依据核对、错误回复修订及不确定结果处理"}], "answer": "按“知识依据核对→错误回复修订→不确定结果处理”分三段写。", "remaining": "“优先核对依据”“正反例示范、学员实操”“拿不准升级人工”等具体方法要自己写；不能只把题干三项再抄一遍。", "tasks": ["B4-T1"]}, {"id": 31, "group": "C 客流系统", "title": "任务一：三张功能卡的名称与核心行为", "level": "大段可摘", "sources": [{"page": 32, "where": "功能卡题目", "quote": "客流态势监测"}, {"page": 32, "where": "功能卡题目", "quote": "疏导方案生成"}, {"page": 32, "where": "功能卡题目", "quote": "处置反馈闭环"}, {"page": 32, "where": "业务背景", "quote": "结合区域容量和近期客流变化预测未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "系统生成入口分流、路线引导和人员调度建议"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "F-01客流态势监测：结合区域容量及近期变化预测未来15分钟风险；F-02疏导方案生成：生成入口分流、路线引导和人员调度建议，负责人确认后发布；F-03处置反馈闭环：记录执行结果。", "remaining": "功能名称和核心行为是题干现成内容；角色、触发条件、输出字段及每张卡的量化验收标准还要补，尤其刷新秒数、预测误差等没有给定。", "tasks": ["C-T1"]}, {"id": 32, "group": "C 客流系统", "title": "任务二（1）：协同流程主干", "level": "改写成流程图", "sources": [{"page": 32, "where": "业务背景", "quote": "系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据"}, {"page": 32, "where": "业务背景", "quote": "预测未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "预测达到阈值时"}, {"page": 32, "where": "业务背景", "quote": "系统生成入口分流、路线引导和人员调度建议"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "数据接入→态势计算/预测→达到阈值？→生成方案→负责人确认→发布执行→记录反馈。", "remaining": "七个节点的主要动作基本来自背景，但“未达阈值回监测、未确认不发布、异常数据核查”等分支与闭环要自己连起来。", "tasks": ["C-T2"]}, {"id": 33, "group": "C 客流系统", "title": "任务二（2）：JSON四个键、两个确定值", "level": "键名直接抄，部分值推导", "sources": [{"page": 33, "where": "JSON要求", "quote": "forecast_window_minutes"}, {"page": 33, "where": "JSON要求", "quote": "risk_threshold"}, {"page": 33, "where": "JSON要求", "quote": "queue_wait_threshold_minutes"}, {"page": 33, "where": "JSON要求", "quote": "manual_confirm_required"}, {"page": 32, "where": "业务背景", "quote": "未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布"}], "answer": "四个键名全部复制。forecast_window_minutes填15；manual_confirm_required填true，因为题目要求人工确认后发布。", "remaining": "risk_threshold及queue_wait_threshold_minutes的数值需要自行设计并保持单位、规则一致。参考答案里的0.8或0.85、10分钟不是PDF给定答案。true是把人工确认要求翻译为布尔值。", "tasks": ["C-T2"]}, {"id": 34, "group": "C 客流系统", "title": "任务二（3）：输入接口来源", "level": "直接摘抄来源", "sources": [{"page": 32, "where": "业务背景", "quote": "闸机、票务核验、区域客流传感器和工作人员移动终端数据"}, {"page": 32, "where": "业务背景", "quote": "值班负责人"}], "answer": "输入来源可以直接写闸机、票务核验、区域客流传感器、工作人员移动终端；方案输出给值班负责人确认。", "remaining": "关键字段要补成事件/区域/任务编号、时间、人数、容量、执行状态等；广播、屏显、审计库等输出去向是设计方案，不是PDF原文已经给出的系统清单。", "tasks": ["C-T2"]}, {"id": 35, "group": "C 客流系统", "title": "任务三（3）：三类场景名字和部分处理过程", "level": "名字可抄，处理要补", "sources": [{"page": 33, "where": "任务三（3）", "quote": "日常客流、高峰风险和数据异常3类运行场景"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "按日常客流、高峰风险、数据异常三行作答；高峰风险的过程可用“预测达到阈值→生成分流/引导/调度建议→负责人确认→发布→记录执行结果”。", "remaining": "具体人数比例、等待时长、数据异常降级方法及日常不触发条件要自己设计。仅抄三个场景名称不算完整答案。", "tasks": ["C-T3"]}, {"id": 36, "group": "C 客流系统", "title": "任务二（4）和任务三（1）（2）：原题没有现成的设计答案", "level": "需要自己设计", "sources": [{"page": 33, "where": "任务二（4）", "quote": "写出3项运营统计或审计内容"}, {"page": 33, "where": "任务三（1）", "quote": "设置不少于3个风险等级"}, {"page": 33, "where": "任务三（2）", "quote": "给出任务从生成到结束的4个主要状态"}], "answer": "能直接拿的是题目要求的数量：3项统计/审计、至少3个等级、4个主要状态。", "remaining": "风险等级名称、各级阈值、四个状态名称及进入条件、三项审计的具体内容都要设计。可以用第32页业务动词组织，但不能说原题已给出完整答案。", "tasks": ["C-T2", "C-T3"]}];const $=id=>document.getElementById(id);let group='all';let timer;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const groups=[...new Set(records.map(r=>r.group))];function kind(r){if(['直接摘抄','大段可摘','两项直接抄，两项计算','直接摘抄两类'].includes(r.level))return 'direct';if(['改写','结合原文推导','改写成流程图'].includes(r.level))return 'adapt';if(['可摘片段','字段可复制','键名直接抄，部分值推导','直接摘抄来源'].includes(r.level))return 'fragment';return 'outline'}function highlight(text){const query=$('search').value.trim();const e=esc(text);return query?e.split(esc(query)).join('<mark>'+esc(query)+'</mark>'):e}function notify(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2200)}function nav(){const rows=[['all','全部题目',records.length],...groups.map(g=>[g,g,records.filter(r=>r.group===g).length])];$('groups').replaceChildren(...rows.map(([id,label,n])=>{const b=document.createElement('button');b.className=group===id?'active':'';b.innerHTML='<span>'+esc(label)+'</span><small>'+n+'</small>';b.onclick=()=>{group=id;nav();render();if(innerWidth>800)window.scrollTo(0,0)};return b}))}function fullTaskReference(r){return `<details class="full-answer-details"><summary>完整题目与详细参考答案（展开阅读）</summary><div class="full-answer-body">${r.tasks.map(id=>{const t=fullTasks[id];if(!t)return '';return `<section><h3>${esc(t.exam)} · ${esc(t.exam_title)} / ${esc(t.title)}</h3><details class="source-material"><summary>查看完整原题与材料 · 第${t.pages[0]}～${t.pages[1]}页</summary><div class="source-material-body">${t.source_html||`<pre class="source-verbatim">${esc(t.source)}</pre>`}</div></details><div class="original-question"><strong>本任务作答要求</strong><ul>${t.prompts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div><h4>详细参考答案</h4>${t.reference_html}</section>`}).join('')}</div></details>`;}
function render(){const query=$('search').value.trim().toLowerCase(),filter=$('kind').value;const filtered=records.filter(r=>(group==='all'||r.group===group)&&(filter==='all'||kind(r)===filter)&&(!query||[r.group,r.title,r.level,r.answer,r.remaining,...r.sources.map(s=>'P'+s.page+' 第'+s.page+'页 '+s.where+' '+s.quote)].join(' ').toLowerCase().includes(query)));$('count').textContent='当前显示 '+filtered.length+' / '+records.length+' 项'+(group==='all'?'':' · '+group);$('items').innerHTML=filtered.length?filtered.map(r=>`<article class="item" id="item-${r.id}"><header class="itemheader"><div class="meta"><span>${esc(r.group)}</span><span>· ${String(r.id).padStart(2,'0')}</span><span class="badge ${kind(r)==='direct'?'green':kind(r)==='outline'?'amber':''}">${esc(r.level)}</span></div><h3>${highlight(r.title)}</h3></header><div class="itembody"><div class="label">原题里有这些话</div><div class="sources">${r.sources.map(s=>`<div class="source"><small>原卷第 ${s.page} 页 · ${esc(s.where)}</small><blockquote>${highlight(s.quote)}</blockquote></div>`).join('')}</div><div class="answer"><div class="answerhead"><span>可以写进答案</span><button class="copy" data-copy="${r.id}">复制这段</button></div><p>${highlight(r.answer)}</p></div><div class="remain"><strong>还要补什么 / 哪里不能照搬</strong>${highlight(r.remaining)}</div>${fullTaskReference(r)}</div></article>`).join(''):'<div class="empty">没有找到匹配项，试试其他关键词或取材类型。</div>';$('items').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const r=records.find(r=>r.id===+b.dataset.copy);try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(r.answer);else{const ta=document.createElement('textarea');ta.value=r.answer;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy')}notify('已复制答案片段')}catch{notify('复制失败，请选中文字复制')}})}$('search').oninput=render;$('kind').onchange=render;const hash=decodeURIComponent(location.hash.slice(1));if(groups.includes(hash))group=hash;nav();render();
</script></body></html>
