</style></head><body><div class="layout"><aside><h1>题干取材对照</h1><p>根据参考答案，回原题找依据</p><div id="groups"></div><hr><div class="navlinks"><a href="index.html">← 返回样卷练习</a></div></aside><main><div class="breadcrumbs">人工智能训练师 / 样卷解析 / 题干取材</div><section class="hero"><h2>哪些答案，题目里已经有了？</h2><p>逐项看<strong>原文在哪、怎么写进答案、还缺什么</strong>。不仅找本题，也对照前面选择题的正确选项。</p><div class="stats"><span>36 项逐题对照</span><span>136 处原文依据</span><span>页码对应原卷页脚</span></div></section><div class="toolbar"><input id="search" type="search" aria-label="搜索对照内容" placeholder="搜题号、关键词、页码，例如 B3、召回率、P27"><select id="kind" aria-label="取材类型"><option value="all">全部取材类型</option><option value="direct">直接取用 / 大段摘抄</option><option value="adapt">改写 / 结合原文推导</option><option value="fragment">答案片段 / 代码字段</option><option value="outline">仅给框架 / 需要设计</option></select></div><div class="count" id="count" aria-live="polite"></div><div id="items"></div><p class="footer">“可写进答案”是对应片段，不代表整题已经答完。选择题取材按本地参考答案核对。原卷、解析课件及本清单保留各自的判断和设计示例。</p></main></div><div class="toast" id="toast" role="status"></div><script>
const records=[{"id": 1, "group": "A 理论简答", "title": "简答1：事件日志、职责分离和持续监控", "level": "改写", "sources": [{"page": 15, "where": "简答1题干", "quote": "申请、复核和放款由不同角色完成"}, {"page": 11, "where": "单选47题干", "quote": "所有查看敏感条款的操作都必须记录操作者、时间和对象，并保留180天"}, {"page": 1, "where": "判断3题干", "quote": "审计记录能够支持责任追溯"}, {"page": 5, "where": "单选17正确选项C", "quote": "协调跨部门流程绩效并推动持续改进"}], "answer": "按“申请→复核→放款”建立标准流程，三个环节由不同角色完成；日志记录工单对象、操作者、角色、时间和操作活动；保留日志支持责任追溯，持续检查并推动整改。", "remaining": "日志的工单号、活动、前后状态等字段还要补；符合性检查、违规判定和整改方法不能只抄标题。180天是合同系统那一题的条件，不能直接当成本题信贷日志的固定期限。"}, {"id": 2, "group": "A 理论简答", "title": "简答2：广告增量评估中的分层比较和混杂因素", "level": "可摘片段", "sources": [{"page": 6, "where": "单选23正确选项C", "quote": "按渠道分层比较转化率并评估流量结构效应"}], "answer": "按渠道分层比较转化率并评估流量结构效应，避免渠道流量结构变化干扰效果判断。", "remaining": "这一句只覆盖混杂因素处理；对照组、随机实验或准实验、置信区间以及广告成本收益仍要自己写。新增和收入一起上升不能直接证明广告带来增量。"}, {"id": 3, "group": "A 理论简答", "title": "简答3：模型评估中的独立测试与防泄漏", "level": "可摘片段", "sources": [{"page": 7, "where": "单选25正确选项C", "quote": "在模型选择完成后进行相对独立的最终评估"}, {"page": 14, "where": "多选5正确选项A", "quote": "在每个交叉验证训练折内重新拟合特征选择步骤"}, {"page": 14, "where": "多选5正确选项C", "quote": "把特征选择、预处理和模型训练封装在同一验证流程中"}, {"page": 14, "where": "多选5正确选项D", "quote": "保留未参与特征选择与调参的独立测试集用于最终评估"}], "answer": "保留未参与特征选择与调参的独立测试集用于最终评估；预处理、特征选择与模型训练放在同一验证流程中，相关步骤只在各训练折拟合。", "remaining": "时间序列题必须补上按时间先后切分、未来四周预测窗口和滚动回测；普通交叉验证写法不能替代时间顺序。基线与误差指标在题干里没有现成答案。"}, {"id": 4, "group": "A 理论简答", "title": "简答4：分群性能和输入质量", "level": "可摘片段", "sources": [{"page": 14, "where": "多选7正确选项A", "quote": "同时查看少数类精确率、召回率以及PR曲线表现"}, {"page": 14, "where": "多选7正确选项B", "quote": "结合误报和漏报代价检查不同阈值下的混淆矩阵"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}, {"page": 14, "where": "多选3正确选项B", "quote": "检查地址等必填属性缺失情况的完整性"}, {"page": 14, "where": "多选3正确选项D", "quote": "检查源系统变化能否在规定时间内同步的及时性"}], "answer": "分别报告少数类和重要业务分群上的性能及样本量，同时查看精确率、召回率和混淆矩阵；检查输入字段缺失和数据同步延迟。", "remaining": "把“地址”改成本模型实际输入字段。告警阈值、人工复核、再训练触发、灰度上线及回滚要补充，不能靠这几句完成整题。"}, {"id": 5, "group": "A 理论简答", "title": "简答5：标签一致性、测试集和长尾指标", "level": "可摘片段", "sources": [{"page": 2, "where": "单选1正确选项B", "quote": "暂停受影响批次，记录分歧，统一规则后复核"}, {"page": 14, "where": "多选5正确选项D", "quote": "保留未参与特征选择与调参的独立测试集用于最终评估"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}], "answer": "标注口径发生分歧时，记录分歧、统一规则后复核；保留独立测试集用于最终评估；分别报告少数类性能及样本量。", "remaining": "标签定义手册、长尾抽样、双人标注与仲裁、同一投诉去重隔离、Macro-F1及错误分析仍要自己展开。"}, {"id": 6, "group": "A 理论简答", "title": "简答6：无障碍检查与定性证据", "level": "可摘片段", "sources": [{"page": 10, "where": "单选44正确选项B", "quote": "增加文字或图标标识，同时保证足够的颜色对比"}, {"page": 12, "where": "单选50正确选项C", "quote": "情境访谈与现场观察"}, {"page": 15, "where": "简答6题干", "quote": "让老年用户和视障用户都能独立完成身份核验"}], "answer": "招募老年用户和视障用户，安排独立完成身份核验的任务；增加文字或图标标识，同时保证足够的颜色对比；结合情境访谈与现场观察收集定性证据。", "remaining": "读屏、键盘与焦点、缩放、任务完成率与耗时、问题严重性分级及修复后复测还要写。题目没有给每组人数和具体对比度数值。"}, {"id": 7, "group": "B1.1 质检", "title": "任务一：四个业务模块的名字和作用", "level": "改写", "sources": [{"page": 17, "where": "业务规则1", "quote": "先检查图像质量"}, {"page": 17, "where": "业务规则2", "quote": "图像可用时按分数分流"}, {"page": 17, "where": "业务规则3", "quote": "人工复核具有裁定权"}, {"page": 17, "where": "业务规则5", "quote": "必须记录状态"}], "answer": "①图像采集与质量检查：检查图像是否可用；②模型检测与分流：图像可用时按分数分流；③人工复核与隔离处置：由质检人员裁定并处理隔离品；④状态记录与包装控制：记录当前有效状态，只允许已放行产品进入包装。", "remaining": "四个模块名称是把规则归纳为模块后的写法，PDF没有逐字给出这四个名称；图像绑定产品编号和模型版本等追溯细节需要补。"}, {"id": 8, "group": "B1.1 质检", "title": "任务一：系统与质检人员职责边界", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行；大于或等于0.20且小于0.80，转人工复核；大于或等于0.80，自动隔离待质量人员处理"}, {"page": 17, "where": "业务规则3", "quote": "人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格"}, {"page": 17, "where": "业务规则4", "quote": "隔离产品由质量人员按企业标准决定放行、返工或报废"}], "answer": "系统按既定分数规则分流；质检员负责人工复核，质量主管处理无法判断的产品；隔离品由质量人员决定放行、返工或报废。", "remaining": "前半句只加了“系统负责”作衔接。模型分数不能代替最终质量结论，可补抄第16页的说明。"}, {"id": 9, "group": "B1.1 质检", "title": "任务一：追溯记录里能直接找到的字段", "level": "可摘片段", "sources": [{"page": 17, "where": "试运行记录表表头", "quote": "产品编号"}, {"page": 17, "where": "试运行记录表表头", "quote": "批次"}, {"page": 17, "where": "试运行记录表表头", "quote": "图像质量"}, {"page": 17, "where": "试运行记录表表头", "quote": "模型缺陷分数"}, {"page": 17, "where": "试运行记录表表头", "quote": "人工最终结论"}, {"page": 17, "where": "业务规则5", "quote": "人工改判需要记录人员、理由及时间"}], "answer": "字段可以直接取：产品编号、批次、图像质量、模型缺陷分数、人工最终结论，以及人工改判人员、理由、时间。", "remaining": "题目还要求输入/输出方向及来源/去向，须自行组织为“相机→系统、模型→规则模块、质检员→状态库、系统→包装”；图像编号、模型版本等结合第17页背景第4点补全。"}, {"id": 10, "group": "B1.1 质检", "title": "任务二：规则表——图像不可用", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则1", "quote": "模糊、严重反光或主体不完整时，原分数无效，先补拍一次"}, {"page": 17, "where": "业务规则1", "quote": "补拍后仍不可用，转质检员检查实物，不得自动放行"}], "answer": "条件：图像模糊、严重反光或主体不完整。动作：原分数无效，先补拍一次。去向：补拍后仍不可用，转质检员检查实物，不得自动放行。", "remaining": "将原文拆成“条件—处理动作—后续去向”三列即可。后续人工处理可接业务规则3。"}, {"id": 11, "group": "B1.1 质检", "title": "任务二：规则表——低分、中分、高分", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行"}, {"page": 17, "where": "业务规则2", "quote": "大于或等于0.20且小于0.80，转人工复核"}, {"page": 17, "where": "业务规则2", "quote": "大于或等于0.80，自动隔离待质量人员处理"}, {"page": 17, "where": "业务规则5", "quote": "只有当前有效状态为“已放行”的产品才能进入包装"}], "answer": "图像可用且分数<0.20：自动放行，状态已放行才可包装；0.20≤分数<0.80：转人工复核；分数≥0.80：自动隔离，交质量人员处理。", "remaining": "每一行都要保留“图像可用”这一前提，不能只看分数。0.20属于人工复核，0.80属于隔离。"}, {"id": 12, "group": "B1.1 质检", "title": "任务二：复核、隔离与返工后续路径", "level": "直接摘抄", "sources": [{"page": 17, "where": "业务规则3", "quote": "人工确认合格可放行，确认不合格应隔离"}, {"page": 17, "where": "业务规则3", "quote": "暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格"}, {"page": 17, "where": "业务规则4", "quote": "返工完成后重新进入检测流程，不直接送包装"}], "answer": "人工合格→放行；人工不合格→隔离；无法判断→保持待检、质量主管继续处理；返工完成→重新检测。", "remaining": "把原文转换成箭头即可用于流程图，但仍需自己画节点及连线。"}, {"id": 13, "group": "B1.1 质检", "title": "任务二：P004与P005走哪条路径", "level": "结合原文推导", "sources": [{"page": 17, "where": "P004行", "quote": "模糊"}, {"page": 17, "where": "P005行", "quote": "0.12"}, {"page": 17, "where": "业务规则1", "quote": "原分数无效，先补拍一次"}, {"page": 17, "where": "业务规则2", "quote": "缺陷分数小于0.20，自动放行"}, {"page": 17, "where": "试运行记录说明", "quote": "人工结论不是预先可用的输入"}], "answer": "P004图像模糊，原0.04分无效，先补拍，仍不可用才转实物检查；P005图像清晰、0.12<0.20，按拟上线规则自动放行。", "remaining": "这两条结论是“表格事实＋规则”推导出来的，原题没有现成完整句。不能先读取人工最终结论，把P005直接写成隔离。"}, {"id": 14, "group": "B1.1 质检", "title": "任务三：改进问题本身可以抄，改进方法不能抄", "level": "只给线索", "sources": [{"page": 17, "where": "背景第2点", "quote": "浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷"}, {"page": 17, "where": "P005人工说明", "quote": "细小凹陷漏检"}, {"page": 17, "where": "P006人工说明", "quote": "反光被误判为缺陷"}], "answer": "P005针对细小凹陷漏检；P006针对反光被误判为缺陷。", "remaining": "增加难例、优化光照、调模型或阈值、独立测试集验证、漏放率和误拦截率等，均需要自己补，不能把问题描述当成改进措施。"}, {"id": 15, "group": "B1.2 会议室", "title": "任务二：改进措施及其业务方向", "level": "可摘片段", "sources": [{"page": 20, "where": "业务背景", "quote": "智能提醒、预约确认和空间匹配"}, {"page": 21, "where": "预约效率优化任务", "quote": "为预约提醒和会议室释放策略提供依据"}, {"page": 22, "where": "空间匹配优化任务", "quote": "为空间分配提供依据"}], "answer": "预约效率：采用智能提醒、预约确认和会议室释放策略，减少无效占用；空间匹配：按会议需求匹配房间，为空间分配提供依据。", "remaining": "“减少无效占用”是结合问题补的业务价值。午间/傍晚爽约率、冬青室/星河室候选等发现必须从CSV计算，PDF没有给结果。"}, {"id": 16, "group": "B1.2 会议室", "title": "任务三：AI方案的数据及不能用的事后字段", "level": "可摘片段", "sources": [{"page": 21, "where": "预约记录表", "quote": "提交预约时间"}, {"page": 21, "where": "预约记录表", "quote": "预约开始时间"}, {"page": 21, "where": "预约记录表", "quote": "预约时段"}, {"page": 21, "where": "预约记录表", "quote": "预约部门"}, {"page": 21, "where": "预约记录表", "quote": "最终预约状态"}, {"page": 21, "where": "会议室资料表", "quote": "核定座位数"}], "answer": "字段可以从表中拿：提交预约时间、预约开始时间、时段、部门、会议室及容量；历史最终预约状态可以构造爽约标签。", "remaining": "字段名是现成的，但选择哪些作为特征、何时可获得要判断；最终状态和实际人数不能作为预约前预测的事先输入。算法模型、验证方式不在PDF里。"}, {"id": 17, "group": "B1.2 会议室", "title": "M1—M4：能从PDF复制的代码材料", "level": "字段可复制", "sources": [{"page": 21, "where": "字段说明", "quote": "booking_id"}, {"page": 21, "where": "字段说明", "quote": "room_id"}, {"page": 21, "where": "字段说明", "quote": "time_slot"}, {"page": 21, "where": "字段说明", "quote": "status"}, {"page": 21, "where": "字段说明", "quote": "attendees"}, {"page": 21, "where": "资料表字段", "quote": "capacity"}, {"page": 21, "where": "读取编码说明", "quote": "encoding=\"utf-8-sig\""}], "answer": "可复制字段名、状态值“已使用/爽约/已取消”、文件名和读取编码。", "remaining": "drop_duplicates、groupby、agg、merge、query等操作写法，以及used_count、avg_seat_util等自定义列名不是PDF给出的答案。12座、20场、40%是Notebook模板里的条件，不在这份PDF正文。"}, {"id": 18, "group": "B2 冷链", "title": "任务一、二：字段和算法/指标名称", "level": "字段可复制", "sources": [{"page": 23, "where": "字段表", "quote": "shipment_id"}, {"page": 23, "where": "字段表", "quote": "cargo_type"}, {"page": 24, "where": "字段表", "quote": "avg_temp"}, {"page": 24, "where": "字段表", "quote": "sensor_missing_rate"}, {"page": 24, "where": "字段表", "quote": "temp_alarm"}, {"page": 24, "where": "任务一", "quote": "按货物类型的中位数填补平均温度缺失值"}, {"page": 24, "where": "任务二", "quote": "采用分层随机划分形成训练集和测试集"}, {"page": 24, "where": "任务二", "quote": "训练随机森林分类器"}, {"page": 24, "where": "任务二", "quote": "计算精确率、召回率、F1值和混淆矩阵"}], "answer": "方法名、字段名和指标名能从题目拿；照着题目顺序完成“分组中位数填补→分层划分→随机森林→分类指标”。", "remaining": "Python语法、划分比例、100棵树/深度6等具体参数在Notebook模板中；清洗后1578条、模型指标和分货物表现要运行得到，不能说是从PDF抄到的。"}, {"id": 19, "group": "B2 冷链", "title": "任务三：优先指标及分货物表现", "level": "可摘片段", "sources": [{"page": 14, "where": "多选7正确选项A", "quote": "同时查看少数类精确率、召回率以及PR曲线表现"}, {"page": 14, "where": "多选7正确选项B", "quote": "结合误报和漏报代价检查不同阈值下的混淆矩阵"}, {"page": 14, "where": "多选7正确选项C", "quote": "分别报告少数类和重要业务分群上的性能及样本量"}], "answer": "结合误报和漏报代价检查混淆矩阵，分别报告各货物类型的性能及样本量；在冷链异常预警中优先关注异常召回率。", "remaining": "“优先召回率”及“漏报会漏掉温控异常、影响货物质量”的理由是结合业务推导的，不是本题原文已经给出的结论。补充异常样本、调阈值、独立验证等改进仍要自己提出。"}, {"id": 20, "group": "B3 能源", "title": "任务一（1）：三种产品名称、输入和输出", "level": "大段可摘", "sources": [{"page": 26, "where": "智能产品清单", "quote": "能源IoT采集终端"}, {"page": 27, "where": "智能产品清单", "quote": "AI负荷预测与能源优化平台"}, {"page": 27, "where": "智能产品清单", "quote": "智能控制网关"}, {"page": 27, "where": "产品说明", "quote": "历史负荷、天气预报、工作日类型、园区活动和分时电价"}, {"page": 27, "where": "产品说明", "quote": "输出未来30分钟负荷预测、峰值风险及推荐调度方案"}, {"page": 27, "where": "产品说明", "quote": "智能控制网关可接收经过确认的策略"}, {"page": 27, "where": "产品说明", "quote": "对非关键空调负荷、储能充放电和充电设施功率进行调节，并返回执行状态"}], "answer": "AI平台输入：历史负荷、天气预报、工作日类型、园区活动和分时电价；输出：未来30分钟负荷预测、峰值风险及推荐调度方案。网关输入：经过确认的策略；输出/动作：调节非关键空调、储能充放电和充电设施功率，返回执行状态。", "remaining": "IoT输入可用第27页的电表、楼控、储能、充电平台归纳；“解决的业务问题”要对应第26页五项现状，写成数据缺失、人工响应慢、缺少统一调度等。"}, {"id": 21, "group": "B3 能源", "title": "任务一（2）：规则表——数据缺失", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束1", "quote": "能源数据连续缺失超过5分钟时，系统重试采集并标记异常"}, {"page": 27, "where": "约束1", "quote": "重试后仍无数据则使用最近可靠值形成临时估计，同时通知运维人员核查"}], "answer": "判断条件：连续缺失超过5分钟。处理动作：重试采集并标记异常；仍无数据，使用最近可靠值临时估计并通知运维核查。", "remaining": "注意是“超过5分钟”，并保留“重试后仍无数据”的顺序；估计值不能说成有效实测数据。"}, {"id": 22, "group": "B3 能源", "title": "任务一（2）：规则表——峰值风险", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束2", "quote": "预测未来30分钟园区负荷达到或超过1500kW时，系统判定为峰值风险并生成削峰建议"}], "answer": "判断条件：预测未来30分钟负荷≥1500kW。处理动作：判定峰值风险并生成削峰建议。", "remaining": "高风险策略的人工确认要求接约束5。1500kW是告警阈值，不是建设目标1478.4kW。"}, {"id": 23, "group": "B3 能源", "title": "任务一（2）：规则表——运行边界", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束3", "quote": "办公区域温度应保持在24～27℃"}, {"page": 27, "where": "约束3", "quote": "消防、安防、数据机房等关键负荷不得自动削减"}], "answer": "判断条件：策略可能使办公温度超出24～27℃，或自动削减关键负荷。处理动作：不执行该越界策略，保证温度和关键负荷约束。", "remaining": "温度范围及不得削减的对象直接抄；“不执行/调整策略”是为了填动作栏作的必要改写。"}, {"id": 24, "group": "B3 能源", "title": "任务一（2）：规则表——执行失败", "level": "直接摘抄", "sources": [{"page": 27, "where": "约束4", "quote": "调节指令发出后60秒内未收到成功反馈，应停止继续下发，恢复安全策略并通知值班人员"}], "answer": "判断条件：指令发出后60秒内未收到成功反馈。处理动作：停止继续下发、恢复安全策略、通知值班人员。", "remaining": "这一行几乎照原文分列填写即可；别把“未收到成功反馈”写成“肯定执行成功”。"}, {"id": 25, "group": "B3 能源", "title": "任务一（3）及任务二（3）：流程、人机边界与审计记录", "level": "大段可摘", "sources": [{"page": 27, "where": "约束5", "quote": "策略、审批人、设备指令、执行结果和时间必须完整留痕"}, {"page": 27, "where": "约束5", "quote": "高风险策略必须由能源管理员确认后执行"}, {"page": 27, "where": "约束1", "quote": "同时通知运维人员核查"}, {"page": 27, "where": "约束4", "quote": "恢复安全策略并通知值班人员"}], "answer": "系统采集数据、预测、推荐、执行已确认策略、返回反馈并留痕；能源管理员确认高风险策略，运维核查数据异常，值班人员处理执行异常。留痕字段直接用策略、审批人、设备指令、执行结果和时间。", "remaining": "流程图仍需将这些动作组合为6～8个主节点；不要把“系统给建议”改成“系统无条件执行高风险策略”。"}, {"id": 26, "group": "B3 能源", "title": "任务二（1）：四项验收值里哪些能抄", "level": "两项直接抄，两项计算", "sources": [{"page": 28, "where": "验收目标", "quote": "最大用电负荷比现状降低12%"}, {"page": 28, "where": "验收目标", "quote": "月均电费比现状降低8%"}, {"page": 28, "where": "验收目标", "quote": "能源数据完整率达到99%以上"}, {"page": 28, "where": "验收目标", "quote": "峰值风险平均响应时间缩短至5分钟以内"}], "answer": "完整率：≥99%；平均响应时间：≤5分钟。这两个目标值可直接由题目换成符号。最大负荷：1680×(1−12%)=1478.4kW；月电费：125×(1−8%)=115万元。", "remaining": "1478.4kW和115万元是计算结果，不能归类为原题直接给出的现成数值。"}, {"id": 27, "group": "B3 能源", "title": "任务二（2）：三阶段名称及时间", "level": "直接摘抄框架", "sources": [{"page": 28, "where": "实施计划表", "quote": "数据接入与基线建立"}, {"page": 28, "where": "实施计划表", "quote": "第1～2周"}, {"page": 28, "where": "实施计划表", "quote": "策略仿真与小范围试点"}, {"page": 28, "where": "实施计划表", "quote": "第3～5周"}, {"page": 28, "where": "实施计划表", "quote": "推广上线与指标验收"}, {"page": 28, "where": "实施计划表", "quote": "第6～8周"}], "answer": "数据接入与基线建立：第1～2周；策略仿真与小范围试点：第3～5周；推广上线与指标验收：第6～8周。", "remaining": "题目已经给好阶段和周数，别再背；关键任务、验收输出、主要责任人三列仍须填写。"}, {"id": 28, "group": "B3 能源", "title": "任务二（4）：运行风险控制中的两类现成措施", "level": "直接摘抄两类", "sources": [{"page": 27, "where": "约束1", "quote": "系统重试采集并标记异常"}, {"page": 27, "where": "约束1", "quote": "使用最近可靠值形成临时估计，同时通知运维人员核查"}, {"page": 27, "where": "约束4", "quote": "停止继续下发，恢复安全策略并通知值班人员"}], "answer": "仪表离线/数据异常：重试、标记、临时估计、通知运维。控制失败/设备异常：停止继续下发、恢复安全策略、通知值班。", "remaining": "季节或业态变化导致预测失准的监控、重训、回退措施没有现成完整答案，必须自己补。"}, {"id": 29, "group": "B4 客服培训", "title": "第（1）问：知识培训内容的核心可以抄", "level": "可摘片段", "sources": [{"page": 30, "where": "业务背景", "quote": "该系统可完成对话摘要、客户意图识别、知识条目推荐和回复草稿生成"}, {"page": 30, "where": "培训对象", "quote": "三级/高级工及以下级别人员"}], "answer": "知识培训：向三级/高级工及以下人员讲解系统的对话摘要、客户意图识别、知识条目推荐和回复草稿生成功能及使用边界。", "remaining": "四个系统功能直接抄；“培训计划”的目标、教法、考核及边界说明需要组织。技术培训可以用题干给的主题“人工智能回复核验与纠错”，但主题名不是完整培训方案。"}, {"id": 30, "group": "B4 客服培训", "title": "第（2）（3）问：能抄的只有主题和答题骨架", "level": "只给框架", "sources": [{"page": 30, "where": "第（2）问", "quote": "人工智能回复核验与纠错"}, {"page": 30, "where": "第（3）问", "quote": "知识依据核对、错误回复修订及不确定结果处理"}], "answer": "按“知识依据核对→错误回复修订→不确定结果处理”分三段写。", "remaining": "“优先核对依据”“正反例示范、学员实操”“拿不准升级人工”等具体方法要自己写；不能只把题干三项再抄一遍。"}, {"id": 31, "group": "C 客流系统", "title": "任务一：三张功能卡的名称与核心行为", "level": "大段可摘", "sources": [{"page": 32, "where": "功能卡题目", "quote": "客流态势监测"}, {"page": 32, "where": "功能卡题目", "quote": "疏导方案生成"}, {"page": 32, "where": "功能卡题目", "quote": "处置反馈闭环"}, {"page": 32, "where": "业务背景", "quote": "结合区域容量和近期客流变化预测未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "系统生成入口分流、路线引导和人员调度建议"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "F-01客流态势监测：结合区域容量及近期变化预测未来15分钟风险；F-02疏导方案生成：生成入口分流、路线引导和人员调度建议，负责人确认后发布；F-03处置反馈闭环：记录执行结果。", "remaining": "功能名称和核心行为是题干现成内容；角色、触发条件、输出字段及每张卡的量化验收标准还要补，尤其刷新秒数、预测误差等没有给定。"}, {"id": 32, "group": "C 客流系统", "title": "任务二（1）：协同流程主干", "level": "改写成流程图", "sources": [{"page": 32, "where": "业务背景", "quote": "系统可接入闸机、票务核验、区域客流传感器和工作人员移动终端数据"}, {"page": 32, "where": "业务背景", "quote": "预测未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "预测达到阈值时"}, {"page": 32, "where": "业务背景", "quote": "系统生成入口分流、路线引导和人员调度建议"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "数据接入→态势计算/预测→达到阈值？→生成方案→负责人确认→发布执行→记录反馈。", "remaining": "七个节点的主要动作基本来自背景，但“未达阈值回监测、未确认不发布、异常数据核查”等分支与闭环要自己连起来。"}, {"id": 33, "group": "C 客流系统", "title": "任务二（2）：JSON四个键、两个确定值", "level": "键名直接抄，部分值推导", "sources": [{"page": 33, "where": "JSON要求", "quote": "forecast_window_minutes"}, {"page": 33, "where": "JSON要求", "quote": "risk_threshold"}, {"page": 33, "where": "JSON要求", "quote": "queue_wait_threshold_minutes"}, {"page": 33, "where": "JSON要求", "quote": "manual_confirm_required"}, {"page": 32, "where": "业务背景", "quote": "未来15分钟风险"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布"}], "answer": "四个键名全部复制。forecast_window_minutes填15；manual_confirm_required填true，因为题目要求人工确认后发布。", "remaining": "risk_threshold及queue_wait_threshold_minutes的数值需要自行设计并保持单位、规则一致。参考答案里的0.8或0.85、10分钟不是PDF给定答案。true是把人工确认要求翻译为布尔值。"}, {"id": 34, "group": "C 客流系统", "title": "任务二（3）：输入接口来源", "level": "直接摘抄来源", "sources": [{"page": 32, "where": "业务背景", "quote": "闸机、票务核验、区域客流传感器和工作人员移动终端数据"}, {"page": 32, "where": "业务背景", "quote": "值班负责人"}], "answer": "输入来源可以直接写闸机、票务核验、区域客流传感器、工作人员移动终端；方案输出给值班负责人确认。", "remaining": "关键字段要补成事件/区域/任务编号、时间、人数、容量、执行状态等；广播、屏显、审计库等输出去向是设计方案，不是PDF原文已经给出的系统清单。"}, {"id": 35, "group": "C 客流系统", "title": "任务三（3）：三类场景名字和部分处理过程", "level": "名字可抄，处理要补", "sources": [{"page": 33, "where": "任务三（3）", "quote": "日常客流、高峰风险和数据异常3类运行场景"}, {"page": 32, "where": "业务背景", "quote": "经值班负责人确认后发布，并记录执行结果"}], "answer": "按日常客流、高峰风险、数据异常三行作答；高峰风险的过程可用“预测达到阈值→生成分流/引导/调度建议→负责人确认→发布→记录执行结果”。", "remaining": "具体人数比例、等待时长、数据异常降级方法及日常不触发条件要自己设计。仅抄三个场景名称不算完整答案。"}, {"id": 36, "group": "C 客流系统", "title": "任务二（4）和任务三（1）（2）：原题没有现成的设计答案", "level": "需要自己设计", "sources": [{"page": 33, "where": "任务二（4）", "quote": "写出3项运营统计或审计内容"}, {"page": 33, "where": "任务三（1）", "quote": "设置不少于3个风险等级"}, {"page": 33, "where": "任务三（2）", "quote": "给出任务从生成到结束的4个主要状态"}], "answer": "能直接拿的是题目要求的数量：3项统计/审计、至少3个等级、4个主要状态。", "remaining": "风险等级名称、各级阈值、四个状态名称及进入条件、三项审计的具体内容都要设计。可以用第32页业务动词组织，但不能说原题已给出完整答案。"}];const $=id=>document.getElementById(id);let group='all';let timer;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const groups=[...new Set(records.map(r=>r.group))];function kind(r){if(['直接摘抄','大段可摘','两项直接抄，两项计算','直接摘抄两类'].includes(r.level))return 'direct';if(['改写','结合原文推导','改写成流程图'].includes(r.level))return 'adapt';if(['可摘片段','字段可复制','键名直接抄，部分值推导','直接摘抄来源'].includes(r.level))return 'fragment';return 'outline'}function highlight(text){const query=$('search').value.trim();const e=esc(text);return query?e.split(esc(query)).join('<mark>'+esc(query)+'</mark>'):e}function notify(text){$('toast').textContent=text;$('toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('toast').style.display='none',2200)}function nav(){const rows=[['all','全部题目',records.length],...groups.map(g=>[g,g,records.filter(r=>r.group===g).length])];$('groups').replaceChildren(...rows.map(([id,label,n])=>{const b=document.createElement('button');b.className=group===id?'active':'';b.innerHTML='<span>'+esc(label)+'</span><small>'+n+'</small>';b.onclick=()=>{group=id;nav();render();if(innerWidth>800)window.scrollTo(0,0)};return b}))}function render(){const query=$('search').value.trim().toLowerCase(),filter=$('kind').value;const filtered=records.filter(r=>(group==='all'||r.group===group)&&(filter==='all'||kind(r)===filter)&&(!query||[r.group,r.title,r.level,r.answer,r.remaining,...r.sources.map(s=>'P'+s.page+' 第'+s.page+'页 '+s.where+' '+s.quote)].join(' ').toLowerCase().includes(query)));$('count').textContent='当前显示 '+filtered.length+' / '+records.length+' 项'+(group==='all'?'':' · '+group);$('items').innerHTML=filtered.length?filtered.map(r=>`<article class="item" id="item-${r.id}"><header class="itemheader"><div class="meta"><span>${esc(r.group)}</span><span>· ${String(r.id).padStart(2,'0')}</span><span class="badge ${kind(r)==='direct'?'green':kind(r)==='outline'?'amber':''}">${esc(r.level)}</span></div><h3>${highlight(r.title)}</h3></header><div class="itembody"><div class="label">原题里有这些话</div><div class="sources">${r.sources.map(s=>`<div class="source"><small>原卷第 ${s.page} 页 · ${esc(s.where)}</small><blockquote>${highlight(s.quote)}</blockquote></div>`).join('')}</div><div class="answer"><div class="answerhead"><span>可以写进答案</span><button class="copy" data-copy="${r.id}">复制这段</button></div><p>${highlight(r.answer)}</p></div><div class="remain"><strong>还要补什么 / 哪里不能照搬</strong>${highlight(r.remaining)}</div></div></article>`).join(''):'<div class="empty">没有找到匹配项，试试其他关键词或取材类型。</div>';$('items').querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{const r=records.find(r=>r.id===+b.dataset.copy);try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(r.answer);else{const ta=document.createElement('textarea');ta.value=r.answer;ta.style.position='fixed';ta.style.opacity='0';document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy')}notify('已复制答案片段')}catch{notify('复制失败，请选中文字复制')}})}$('search').oninput=render;$('kind').onchange=render;const hash=decodeURIComponent(location.hash.slice(1));if(groups.includes(hash))group=hash;nav();render();
</script></body></html>
