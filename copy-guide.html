="polite"></div><div id="items"></div><p class="footer">“可写进答案”是对应片段，不代表整题已经答完。选择题取材按本地参考答案核对。原卷、解析课件及本清单保留各自的判断和设计示例。</p></main></div><div class="toast" id="toast" role="status"></div><script>
const fullTasks={"A-SA-1": {"id": "A-SA-1", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 1 题", "prompts": ["某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-1\">\u003ch3 id=\"A-SA-1-full-1\">（1）事件日志要求\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>以每笔信贷工单作为一个流程实例，日志至少记录工单编号、活动名称、操作人、操作角色、发生时间、操作类型、审批结果和前后状态。申请提交、复核通过或退回、补件、放款等关键活动都要留痕，保证能够还原同一工单的完整时间顺序。\u003c/p>\u003cp>日志需要有权限控制、可靠时间戳、版本及修改留痕，不能由业务人员随意覆盖或删除。保留期限应按照实际业务和制度确定；其他题目出现的“180天”不能直接套成本题固定要求。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-2\">\u003ch3 id=\"A-SA-1-full-2\">（2）标准流程模型\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>建立“申请→复核→放款”的标准主路径，标出各环节允许操作的角色、进入条件、输出状态和必要审批。明确退回补件、重新申请、拒绝和终止等合法分支，不能把所有偏离主路径的行为都当作违规。\u003c/p>\u003cp>形成可检查的流程图或流程模型，并维护对应的权限矩阵。申请人、复核人和放款操作人应满足职责分离要求；业务规则变更时同步更新模型和权限。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-3\">\u003ch3 id=\"A-SA-1-full-3\">（3）符合性检查\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>按工单编号归集日志，按时间重建实际活动序列，与标准模型逐项比对，识别缺少复核直接放款、步骤颠倒、未经授权的回退、重复放款等异常。对每一条异常给出工单、异常活动、时间、操作角色和命中的规则。\u003c/p>\u003cp>对日志缺失、时间异常与真实业务违规分别标记，避免因记录不完整直接下错误结论。统计异常工单占比、步骤跳过次数等指标，并抽取正常与异常工单进行人工核验。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-4\">\u003ch3 id=\"A-SA-1-full-4\">（4）职责分离验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>检查同一工单申请、复核和放款环节的角色及实际操作者，验证是否存在一人兼任不相容角色、借用账号、超权限审批等情况。还应检查角色分配本身是否冲突，而不只比较页面上显示的姓名。\u003c/p>\u003cp>将操作日志与账号、岗位、授权记录对应起来；遇到同人跨环节或越权操作，输出可复查的证据清单，交合规或业务负责人确认。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-5\">\u003ch3 id=\"A-SA-1-full-5\">（5）异常处置\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>保全原始日志、审批材料、权限记录及模型版本，按影响范围和严重性分级处置。存在资金或授权风险时，按既定权限暂停相关高风险操作并升级处理；一般流程偏差安排复核、纠正及限期整改。\u003c/p>\u003cp>记录问题负责人、原因、整改动作、完成期限和复查结果。不能以删除日志、补一条虚假的审批记录或直接覆盖历史状态作为整改。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-1-full-6\">\u003ch3 id=\"A-SA-1-full-6\">（6）持续监控\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>建立越权次数、职责冲突工单数、步骤跳过率和整改关闭率等监控口径，明确统计窗口、告警阈值与责任人。新增异常及时告警，定期抽样检查模型之外的例外情况。\u003c/p>\u003cp>整改后复查相同规则是否仍被触发，检查合法业务是否被误拦截；流程或岗位变化时同步调整模型、权限和测试用例，形成“检查—整改—复核—持续监控”闭环。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "A-SA-2": {"id": "A-SA-2", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 2 题", "prompts": ["某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-1\">\u003ch3 id=\"A-SA-2-full-1\">（1）明确指标口径\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>先明确评估对象、投放渠道、目标人群、投放周期与归因窗口。分别定义新增用户、激活、付费转化、净收入或贡献毛利，说明分母、去重、退款、跨渠道重复用户及延迟付费的处理方式，避免投放前后口径变化。\u003c/p>\u003cp>将广告带来的增量付费或增量贡献毛利作为核心效果指标，同时记录广告成本、获客成本、留存和投诉等约束指标。新增与收入同时上升只是现象，不能直接据此计算广告的因果增量。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-2\">\u003ch3 id=\"A-SA-2-full-2\">（2）构造合理对照\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>优先对符合条件的人群或地区随机分组，一组接受投放，一组作为同期不投放对照。检查两组规模、历史活跃和付费水平是否可比，并控制其他渠道重复触达及组间串扰。\u003c/p>\u003cp>观察同一时间窗口下两组的结果差异，估计“如果没有投放会怎样”。只比较投放前后总收入，无法排除自然增长或节日影响，不能替代对照。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-3\">\u003ch3 id=\"A-SA-2-full-3\">（3）处理混杂因素\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>排查节假日、季节性、促销、价格变动、渠道流量结构、产品改版和用户构成变化等因素。按渠道或人群分层比较转化率，同时看样本量，防止高转化渠道占比增加造成总体指标虚高。\u003c/p>\u003cp>在设计上尽量控制同期其他干预；无法控制时，记录其发生时间和影响范围，并在模型、分层或敏感性分析中说明处理方式与局限。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-4\">\u003ch3 id=\"A-SA-2-full-4\">（4）选择实验或准实验方法\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>能随机时采用随机对照实验，提前确定分组、主指标、样本量与观察时长。不能随机时，可选择可比地区或人群，以投放组和未投放组的前后变化做双重差分。\u003c/p>\u003cp>准实验需要说明可比性、平行趋势等识别假设，必要时结合匹配及敏感性分析；不是写出方法名称就证明因果关系。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-5\">\u003ch3 id=\"A-SA-2-full-5\">（5）统计判断\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>报告增量估计、效应大小及置信区间，结合样本量、业务上最小有意义提升和观察窗口判断结果。预先规定分析计划，避免不停看数据、挑选显著结果或只报告表现最好的分组。\u003c/p>\u003cp>当区间过宽或样本不足时，应明确结果仍不确定并继续收集数据；统计显著也不代表收益足以覆盖投放成本。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-2-full-6\">\u003ch3 id=\"A-SA-2-full-6\">（6）业务决策\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>将增量收入或贡献毛利与广告成本比较，结合留存、退款、客户长期价值和服务压力决定扩量、维持、调整或停投。分渠道检查收益与风险，防止总体盈利掩盖部分渠道亏损。\u003c/p>\u003cp>扩大投放时设置预算和风险上限，并安排后续复测，确认效果不会因流量饱和、渠道变化或新用户质量下降而消失。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "A-SA-3": {"id": "A-SA-3", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 3 题", "prompts": ["某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-1\">\u003ch3 id=\"A-SA-3-full-1\">（1）按时间切分数据\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>使用过去两年的每日数据，按时间先后划分训练、验证与最终测试窗口；例如将最后四周留作独立测试，较早数据训练，中间窗口用于调参。不能随机打乱日期，把未来数据混入较早时点的训练。\u003c/p>\u003cp>每个回测起点都只使用该时点之前已经形成的数据，预处理、缺失填补和特征选择也应只在相应训练窗口拟合。最终测试不能被反复用于挑模型。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-2\">\u003ch3 id=\"A-SA-3-full-2\">（2）选择预测时可获得的特征\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>可以使用历史销量滞后项、过去若干天或周的移动统计、星期、节假日、已确定的促销计划等信息；使用天气时应选择当时可获得的预报，而不是预测期事后观测到的真实天气。\u003c/p>\u003cp>不能把未来四周实际销量、事后补录标签或未来才知道的业务结果作为输入。还要检查缺货、停售和数据补录是否使“观察到的销量”偏离真实需求。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-3\">\u003ch3 id=\"A-SA-3-full-3\">（3）建立基线模型\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>使用上周同日销量、季节性朴素预测或历史移动均值等容易解释的基线。候选模型与基线必须在同一商品、同一预测起点及同一四周窗口上比较。\u003c/p>\u003cp>如果复杂模型不能稳定改善基线误差，或改善不足以覆盖维护成本，应优先保留简单可用的方案；不能只凭模型名称高级就判定更好。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-4\">\u003ch3 id=\"A-SA-3-full-4\">（4）评价指标\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>可同时报告MAE和RMSE：MAE反映平均绝对偏差，RMSE更强调大误差。需要相对误差时可使用WAPE等指标；使用MAPE前必须说明零销量或极小分母问题。\u003c/p>\u003cp>按商品类别、销量层级和重要业务场景分别报告误差与样本量，避免畅销商品把长尾商品的失败掩盖。指标应与缺货、积压和补货成本等业务后果相联系。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-5\">\u003ch3 id=\"A-SA-3-full-5\">（5）滚动回测\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>在历史两年中设置多个预测起点，每次用此前数据训练或更新模型，完整预测未来四周，再将起点向后滚动。各模型采用一致的训练更新规则和窗口长度，模拟真实上线过程。\u003c/p>\u003cp>如果采用多步递推预测，回测中也不能偷用未来实际销量去更新中间步骤。保留每次起点、训练范围、参数和预测结果，检查不同季节及促销期的稳定性。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-3-full-6\">\u003ch3 id=\"A-SA-3-full-6\">（6）解释结果\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>报告相对基线的改善、各窗口的波动，以及哪些商品或时段容易系统性高估或低估。结合促销、新品、节假日和缺货记录解释误差，并说明证据与不确定性。\u003c/p>\u003cp>将预测区间和误差转化为库存决策建议，例如对高不确定性商品保留人工复核或安全库存。不能只给一个总体分数就宣布模型适用于所有商品。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "A-SA-4": {"id": "A-SA-4", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 4 题", "prompts": ["一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-1\">\u003ch3 id=\"A-SA-4-full-1\">（1）输入质量监控\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>监控输入字段缺失、数据类型、取值范围、重复记录、数据延迟及来源变化，比较线上数据与训练时期的分布。按时间和来源定位异常，区分数据管道故障与真实业务分布变化。\u003c/p>\u003cp>对缺失率突增、字段定义变更或传输中断设置告警，保存涉及的数据范围、模型版本与时间，保证后续能复现。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-2\">\u003ch3 id=\"A-SA-4-full-2\">（2）分群性能监控\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>除总体准确率外，按类别、地区、渠道、人群及关键业务场景报告精确率、召回率、误报漏报和样本量。类别不平衡时，总体准确率不变也可能掩盖少数类或重要分群显著恶化。\u003c/p>\u003cp>将投诉记录关联到相应模型输出和业务结果；标签有延迟时，先用代理信号监控，待真实标签形成后再核验，不能把代理指标当作最终性能结论。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-3\">\u003ch3 id=\"A-SA-4-full-3\">（3）告警规则\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>预先规定数据质量、分群性能、投诉和漂移指标的阈值与持续窗口，按严重性分级告警，并指定响应人和时限。告警信息应包含异常指标、影响分群、样本量、数据与模型版本。\u003c/p>\u003cp>阈值应结合历史波动及业务风险设定；单次小样本波动不应无条件触发重训，严重安全或业务风险也不能等待统计窗口结束才处置。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-4\">\u003ch3 id=\"A-SA-4-full-4\">（4）人工复核\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>抽取告警样本、投诉样本和必要的对照样本，由业务人员复核标签及模型输出，判断是数据错误、标签口径变化、规则变化还是模型能力退化。对争议样本进行仲裁并保留复核依据。\u003c/p>\u003cp>将可靠的复核结果整理为后续评估和改进样本，先定位原因，再决定修复数据、调整阈值、更新规则或重新训练。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-5\">\u003ch3 id=\"A-SA-4-full-5\">（5）再训练触发条件\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>在确认重要分群性能持续下降、出现新的有效业务场景、标签规则改变或数据分布变化已影响效果时启动再训练。明确触发阈值、持续时长、最低样本量和批准责任人。\u003c/p>\u003cp>重训前修复数据与标注问题，记录数据版本、特征处理、参数及训练过程。不能把所有漂移告警都直接等同于需要更换模型。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-6\">\u003ch3 id=\"A-SA-4-full-6\">（6）灰度验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>在未参与训练和调参的独立数据上比较新旧模型，重点检查投诉集中分群、少数类及高风险场景。确认业务代价和系统性能可接受后，进行影子运行或小流量灰度。\u003c/p>\u003cp>灰度期间继续监控整体与分群指标、投诉和误报漏报，设置放量条件及停止条件；通过后再逐步扩大范围。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-4-full-7\">\u003ch3 id=\"A-SA-4-full-7\">（7）回滚与闭环\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>保留已验证的旧模型、特征配置和部署参数，准备可执行的回滚步骤与责任人。新版本指标或风险不达标时回滚，并核实服务、数据和业务状态已恢复。\u003c/p>\u003cp>记录触发原因、处置过程、版本变化、验证结果和未解决问题，把投诉、监控、人工复核、改进、灰度和回滚连成完整闭环。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "A-SA-5": {"id": "A-SA-5", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 5 题", "prompts": ["企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-1\">\u003ch3 id=\"A-SA-5-full-1\">（1）标签体系\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>建立投诉主题层级和标注手册，为每类写明定义、纳入与排除边界、正反例、易混类别及无法判断的处理规则。明确多主题投诉采用主标签、多标签还是升级复核，不能由标注员自行猜测。\u003c/p>\u003cp>标签版本要可追溯。长尾类别可以采用层级标签、补样本等方式处理，不能为了提高总体分数随意把业务上重要的少数类全部合并为“其他”。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-2\">\u003ch3 id=\"A-SA-5-full-2\">（2）抽样与样本准备\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>按渠道、时间、主要主题与长尾类别分层抽样，覆盖正常表达、口语、错别字、复杂多主题和难例；对不足类别定向补充样本并复核质量。\u003c/p>\u003cp>训练时可采取适当的重采样或类别权重，测试集应尽量反映目标业务分布，并另报重要少数类表现。不能把人为均衡后的测试集结果直接当作线上自然分布效果。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-3\">\u003ch3 id=\"A-SA-5-full-3\">（3）标注一致性\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>先用一批样本试标，由两人独立标注部分重叠样本，计算一致率或适当的一致性系数。分析分歧是否来自标签边界、缺少上下文或操作失误，再由仲裁人员复核。\u003c/p>\u003cp>修订手册并对受影响样本回查，培训后再次试标，确认口径稳定再扩量。不能只追求标注速度或用多数票掩盖规则本身不清楚的问题。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-4\">\u003ch3 id=\"A-SA-5-full-4\">（4）数据划分\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>去重后划分训练、验证和独立测试集；同一工单、会话或客户衍生的相似文本应按组隔离，必要时按时间留出，避免同一投诉的复本跨集合造成泄漏。\u003c/p>\u003cp>调参和阈值选择使用验证集，最终测试集只做独立验收。预处理、词表及特征选择也不能提前利用测试集信息。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-5\">\u003ch3 id=\"A-SA-5-full-5\">（5）评价指标\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>报告Macro-F1、每类Precision和Recall、混淆矩阵及各类样本量，同时查看整体指标。宏平均有助于发现长尾类别被忽视的问题，但还应结合少样本不稳定性解释结果。\u003c/p>\u003cp>对高风险投诉主题单列召回率及误报代价，不只报告准确率或加权平均分。模型与基线应采用相同数据划分及标签版本比较。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-5-full-6\">\u003ch3 id=\"A-SA-5-full-6\">（6）错误分析与改进\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>抽取验证集误分类和长尾漏检样本，按标签模糊、标注错误、信息不足、噪声、主题混淆与模型能力不足分类归因，查看混淆矩阵中最突出的类别对。\u003c/p>\u003cp>针对性修订标签规则、复核标注、补充难例或调整特征与模型，再在验证集检查变化。最后用未参与改进的新测试数据确认收益，同时检查其他类别是否退化。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "A-SA-6": {"id": "A-SA-6", "exam": "A-SA", "exam_title": "理论 · 简答题", "source": "四、简答题（每题5 分）\n\n    1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现\n  部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少\n  说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处\n  置和持续监控。\n\n    2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断\n  广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂\n  因素、实验或准实验方法、统计判断和业务决策。\n\n    3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请\n  设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚\n  动回测和结果解释。\n\n    4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设\n  计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复\n  核、触发条件、灰度验证和回滚。\n\n    5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有\n  标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、\n  抽样、标注一致性、数据划分、指标和错误分析。\n\n    6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成\n  身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、\n  检查标准、定量与定性证据、问题分级和复测。", "pages": [15, 15], "title": "第 6 题", "prompts": ["某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-1\">\u003ch3 id=\"A-SA-6-full-1\">（1）用户招募\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>招募不同年龄、数字技能与智能手机熟练程度的老年用户，以及不同视力状况、读屏和辅助技术使用经验的视障用户。覆盖目标用户的真实差异，不只找熟练的内部员工代替。\u003c/p>\u003cp>取得测试同意，提供必要的环境说明和辅助设备；研究人员可以解释测试规则，但不能代替用户完成身份核验，以免把协助完成误计为独立完成。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-2\">\u003ch3 id=\"A-SA-6-full-2\">（2）任务设计\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>围绕独立完成身份核验设计完整任务：找到入口、理解说明、输入或上传测试信息、完成核验、查看结果，并覆盖输入错误、验证失败、超时、纠错和退出等分支。\u003c/p>\u003cp>使用测试身份信息和安全的模拟环境，避免收集真实敏感资料。记录用户自然操作过程，并区分自行完成、少量提示后完成和代操作完成。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-3\">\u003ch3 id=\"A-SA-6-full-3\">（3）检查标准\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>检查文字放大、足够对比度、非颜色提示、键盘与焦点顺序、屏幕阅读器的名称和状态播报，以及表单标签、错误提示、验证码替代、超时提醒与延长机制。\u003c/p>\u003cp>将人工检查、工具扫描和目标用户的实际任务结合起来；不能只靠自动扫描或声称支持读屏就认定可用。具体符合性要求与等级应按所采用标准核对，不把所有建议都叫作同一等级强制要求。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-4\">\u003ch3 id=\"A-SA-6-full-4\">（4）定量与定性证据\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>定量记录独立任务完成率、完成时长、错误次数、求助次数和关键步骤放弃率，并按人群和辅助技术分组报告。明确成功定义，不能把研究人员代办计入独立成功。\u003c/p>\u003cp>定性结合现场观察、情境访谈、出声思维和操作回放，记录看不懂、找不到、听不到或无法纠错的具体卡点。用复现步骤和界面证据支撑结论，避免只给“体验不好”的印象。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-5\">\u003ch3 id=\"A-SA-6-full-5\">（5）问题分级\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>按影响和可绕行程度分级：阻断级是无法独立完成核验；严重问题会造成高成本绕行或重要误操作；一般问题影响效率或理解但可自行完成。标明受影响人群、设备与辅助技术。\u003c/p>\u003cp>优先修复阻断和高风险错误，给出责任人、修复建议、验证方式和完成时限；评分高低不能代替对关键阻断点的处置。\u003c/p>\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"A-SA-6-full-6\">\u003ch3 id=\"A-SA-6-full-6\">（6）修复与复测\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>修复后使用原用户或同画像用户、同类但不完全重复的新任务进行复测，检查独立完成率、耗时与错误是否改善，并确认没有对另一类用户引入新障碍。\u003c/p>\u003cp>保留测试版本、问题清单、修复记录、复测证据和仍未解决的限制；达成事先定义的目标后再安排上线，并在上线后持续收集无障碍反馈。\u003c/p>\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>四、简答题（每题5 分）\u003c/h4>\u003cp>1. 某信贷审批流程要求申请、复核和放款由不同角色完成，但审计发现部分工单存在越权操作和步骤跳过。请设计一套流程合规核查方案，至少说明事件日志要求、标准流程模型、符合性检查、职责分离验证、异常处置和持续监控。\u003c/p>\u003cp>2. 某平台投放新广告后，新增用户和付费收入同时上升，团队希望判断广告带来的增量效果。请设计评估方案，说明指标口径、对照构造、混杂因素、实验或准实验方法、统计判断和业务决策。\u003c/p>\u003cp>3. 某零售企业准备使用过去两年的每日数据预测未来四周商品需求。请设计模型评估方案，说明时间切分、可用特征、基线模型、评价指标、滚动回测和结果解释。\u003c/p>\u003cp>4. 一个已上线的分类模型近期投诉增加，但总体准确率变化不大。请设计模型监控与再训练闭环，至少涵盖输入质量、分群性能、告警、人工复核、触发条件、灰度验证和回滚。\u003c/p>\u003cp>5. 企业要训练一个用于识别客户投诉主题的中文文本分类模型，但现有标签边界模糊且长尾类别较多。请设计数据与评估方案，说明标签体系、抽样、标注一致性、数据划分、指标和错误分析。\u003c/p>\u003cp>6. 某公共服务App准备改版，目标是让老年用户和视障用户都能独立完成身份核验。请设计一套无障碍体验评估方案，说明用户招募、任务设计、检查标准、定量与定性证据、问题分级和复测。\u003c/p>\u003c/div>"}, "B1.1-T1": {"id": "B1.1-T1", "exam": "B1.1", "exam_title": "产品外观智能质检业务框架与流程设计", "source": "（一）业务背景\n\n  某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\n\n操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由\n\n质量人员决定返工或报废。\n\n  企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表\n\n示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量\n\n结论。\n\n  企业准备将模型接入业务流程，但存在以下问题：\n\n      1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\n\n      2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\n\n      3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录\n\n不同步而进入包装。\n\n      4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改\n\n进流程。\n\n  （二）试运行记录\n\n  下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，\n\n人工结论不是预先可用的输入。\n\n产品编号 批次 图像质量 模型缺陷分数 人工最终结论 人工说明\nP001      B01 清晰       0.08     合格     无明显缺陷\nP002      B01 清晰       0.92     不合格    明显划伤\nP003      B01 清晰       0.55     合格     正常纹理被模型关注\nP004      B02 模糊       0.04     不合格    检查实物后发现划伤\nP005      B02 清晰       0.12     不合格    细小凹陷漏检\nP006      B02 清晰       0.86     合格     反光被误判为缺陷\n\n  （三）业务规则\n\n  以下为企业拟采用的试行规则：\n\n      1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后\n\n仍不可用，转质检员检查实物，不得自动放行。\n\n      2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，\n\n转人工复核；大于或等于0.80，自动隔离待质量人员处理。\n\n      3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品\n\n保持待检状态，由质量主管继续处理，不得默认合格。\n\n      4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后\n\n重新进入检测流程，不直接送包装。\n\n      5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录\n\n人员、理由及时间。\n\n  任务一：业务框架设计\n\n  用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\n\n         四个必要业务模块及各自作用。\n\n         系统与质检人员的职责边界。\n\n         一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关\n\n    键字段。\n\n  任务二：业务流程与处置规则设计\n\n      1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和\n\n高分四种情况。\n\n      2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，\n\n以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有\n\n异常支线。\n\n      3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\n\n  任务三：设计验证与改进方案\n\n      1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是\n\n否有效。\n\n      2. 给出两个能够衡量新流程效果的指标，写清统计口径。", "pages": [16, 18], "title": "任务1：业务框架设计", "prompts": ["（1）写出四个必要业务模块及作用。", "（2）说明系统与质检人员的职责边界。", "（3）列出追溯记录的方向、来源/去向和关键字段。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T1-section-1\">\u003ch3 id=\"B1.1-T1-section-1\">要点 1 · 四个必要业务模块\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>图像采集与质量检查\u003c/strong>：绑定产品编号、批次和图像；检查模糊、反光、主体不完整，先挡住不可用图像。\u003c/li>\n\u003cli>\u003cstrong>模型检测与规则分流\u003c/strong>：图像可用才推理，记录分数和模型版本，按 0.20、0.80 两个阈值分流。\u003c/li>\n\u003cli>\u003cstrong>人工复核与隔离处置\u003c/strong>：质检员检查不确定样本，质量人员决定隔离品放行、返工或报废。\u003c/li>\n\u003cli>\u003cstrong>状态追溯与包装联锁\u003c/strong>：统一保存状态和改判记录，包装只接受当前有效状态为“已放行”的产品。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T1-section-2\">\u003ch3 id=\"B1.1-T1-section-2\">要点 2 · 系统与人员的职责边界\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>系统负责采图检查、模型推理、规则分流、状态同步和记录，不把分数当作已验证的缺陷概率。\u003c/li>\n\u003cli>质检员有人工裁定权；确认合格可放行，不合格隔离，暂时无法判断则保持待检并交质量主管。\u003c/li>\n\u003cli>隔离不是报废；返工必须重新检测，不直接去包装。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T1-section-3\">\u003ch3 id=\"B1.1-T1-section-3\">要点 3 · 一组输入输出追溯记录\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>输入方向\u003c/strong>：生产现场/相机 → 质检系统；字段含产品编号、批次、图像编号与地址、拍摄时间、质量检查结果。\u003c/li>\n\u003cli>\u003cstrong>检测记录\u003c/strong>：视觉模型 → 规则模块；字段含图像编号、缺陷分数、模型版本和推理时间。\u003c/li>\n\u003cli>\u003cstrong>人工输出\u003c/strong>：质检人员 → 状态系统；字段含最终结论、当前状态、人员、改判理由和时间。\u003c/li>\n\u003cli>\u003cstrong>包装输出\u003c/strong>：状态系统 → 包装工位；返回产品编号、当前有效状态、状态版本与允许包装标志。旧状态不得覆盖新改判。\u003c/li>\n\u003cli>\u003cstrong>处置输出\u003c/strong>：系统 → 质量人员/返工线；记录产品编号、处置决定、人员与时间，返工后生成新的检测记录。\u003c/li>\n\u003cli>\u003cstrong>改进输出\u003c/strong>：系统 → 模型训练环节；回流图像、原分数、人工结论、错误类型及模型版本。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\u003c/h4>\u003cp>操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由质量人员决定返工或报废。\u003c/p>\u003cp>企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量结论。\u003c/p>\u003cp>企业准备将模型接入业务流程，但存在以下问题：\u003c/p>\u003cp>1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\u003c/p>\u003cp>2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\u003c/p>\u003cp>3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录不同步而进入包装。\u003c/p>\u003cp>4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改进流程。\u003c/p>\u003ch4>（二）试运行记录下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，人工结论不是预先可用的输入。\u003c/h4>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"试运行逐件复核记录\">\u003ctable class=\"original-source-table\" data-source-table=\"quality-trial\">\u003ccolgroup>\u003ccol style=\"width:12%\">\u003ccol style=\"width:9%\">\u003ccol style=\"width:12%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:35%\">\u003c/colgroup>\u003ccaption>试运行逐件复核记录\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">产品编号\u003c/th>\u003cth scope=\"col\">批次\u003c/th>\u003cth scope=\"col\">图像质量\u003c/th>\u003cth scope=\"col\">模型缺陷分数\u003c/th>\u003cth scope=\"col\">人工最终结论\u003c/th>\u003cth scope=\"col\">人工说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">P001\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.08\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>无明显缺陷\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P002\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.92\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>明显划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P003\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.55\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>正常纹理被模型关注\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P004\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>模糊\u003c/td>\u003ctd>0.04\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>检查实物后发现划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P005\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.12\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>细小凹陷漏检\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P006\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.86\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>反光被误判为缺陷\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>（三）业务规则以下为企业拟采用的试行规则：\u003c/h4>\u003cp>1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后仍不可用，转质检员检查实物，不得自动放行。\u003c/p>\u003cp>2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，转人工复核；大于或等于0.80，自动隔离待质量人员处理。\u003c/p>\u003cp>3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格。\u003c/p>\u003cp>4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后重新进入检测流程，不直接送包装。\u003c/p>\u003cp>5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录人员、理由及时间。\u003c/p>\u003ch4>任务一：业务框架设计用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\u003c/h4>\u003cp>• 四个必要业务模块及各自作用。\u003c/p>\u003cp>• 系统与质检人员的职责边界。\u003c/p>\u003cp>• 一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关键字段。\u003c/p>\u003ch4>任务二：业务流程与处置规则设计\u003c/h4>\u003cp>1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和高分四种情况。\u003c/p>\u003cp>2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有异常支线。\u003c/p>\u003cp>3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\u003c/p>\u003ch4>任务三：设计验证与改进方案\u003c/h4>\u003cp>1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是否有效。\u003c/p>\u003cp>2. 给出两个能够衡量新流程效果的指标，写清统计口径。\u003c/p>\u003c/div>"}, "B1.1-T2": {"id": "B1.1-T2", "exam": "B1.1", "exam_title": "产品外观智能质检业务框架与流程设计", "source": "（一）业务背景\n\n  某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\n\n操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由\n\n质量人员决定返工或报废。\n\n  企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表\n\n示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量\n\n结论。\n\n  企业准备将模型接入业务流程，但存在以下问题：\n\n      1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\n\n      2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\n\n      3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录\n\n不同步而进入包装。\n\n      4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改\n\n进流程。\n\n  （二）试运行记录\n\n  下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，\n\n人工结论不是预先可用的输入。\n\n产品编号 批次 图像质量 模型缺陷分数 人工最终结论 人工说明\nP001      B01 清晰       0.08     合格     无明显缺陷\nP002      B01 清晰       0.92     不合格    明显划伤\nP003      B01 清晰       0.55     合格     正常纹理被模型关注\nP004      B02 模糊       0.04     不合格    检查实物后发现划伤\nP005      B02 清晰       0.12     不合格    细小凹陷漏检\nP006      B02 清晰       0.86     合格     反光被误判为缺陷\n\n  （三）业务规则\n\n  以下为企业拟采用的试行规则：\n\n      1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后\n\n仍不可用，转质检员检查实物，不得自动放行。\n\n      2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，\n\n转人工复核；大于或等于0.80，自动隔离待质量人员处理。\n\n      3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品\n\n保持待检状态，由质量主管继续处理，不得默认合格。\n\n      4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后\n\n重新进入检测流程，不直接送包装。\n\n      5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录\n\n人员、理由及时间。\n\n  任务一：业务框架设计\n\n  用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\n\n         四个必要业务模块及各自作用。\n\n         系统与质检人员的职责边界。\n\n         一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关\n\n    键字段。\n\n  任务二：业务流程与处置规则设计\n\n      1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和\n\n高分四种情况。\n\n      2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，\n\n以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有\n\n异常支线。\n\n      3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\n\n  任务三：设计验证与改进方案\n\n      1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是\n\n否有效。\n\n      2. 给出两个能够衡量新流程效果的指标，写清统计口径。", "pages": [16, 18], "title": "任务2：业务流程与处置规则", "prompts": ["（1）规则表覆盖图像不可用、低分、中间分数、高分。", "（2）画图体现图像检查、模型检测、放行/复核/隔离及结果记录。", "（3）分别说明 P004、P005 按上线规则会进入的路径。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T2-section-1\">\u003ch3 id=\"B1.1-T2-section-1\">（1）条件—处理动作—后续去向规则表\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>条件\u003c/th>\n\u003cth>处理动作\u003c/th>\n\u003cth>后续去向\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>图像模糊、严重反光或主体不完整\u003c/td>\n\u003ctd>原分数无效，先补拍一次；仍不可用由质检员检查实物\u003c/td>\n\u003ctd>人工合格放行；不合格隔离；不确定保持待检\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图像可用，分数 &lt; 0.20\u003c/td>\n\u003ctd>自动放行并记录状态\u003c/td>\n\u003ctd>当前有效状态为已放行后，允许包装\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图像可用，0.20 ≤ 分数 &lt; 0.80\u003c/td>\n\u003ctd>人工复核，保存人员、理由和时间\u003c/td>\n\u003ctd>合格放行，不合格隔离，无法判断交主管\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>图像可用，分数 ≥ 0.80\u003c/td>\n\u003ctd>自动隔离，等待质量人员处置\u003c/td>\n\u003ctd>决定放行、返工或报废；返工后重检\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T2-section-2\">\u003ch3 id=\"B1.1-T2-section-2\">（2）业务流程图\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cp>\u003cimg src=\"assets/5ca1fb89ca8aea073621fc6e.svg\" alt=\"外观质检流程\">\u003c/p>\n\u003cul>\n\u003cli>先检查图像，再使用模型分数；正式自动分流不能提前读取“人工最终结论”。\u003c/li>\n\u003cli>人工改判后立即同步状态，包装环节再次核对当前状态。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T2-section-3\">\u003ch3 id=\"B1.1-T2-section-3\">（3）P004、P005 的上线规则路径\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>P004\u003c/strong>：图像模糊，0.04 分无效 → 先补拍一次；补拍可用后重新推理并按新分数分流，仍不可用才检查实物。不能用旧低分直接放行，也不能提前把试运行人工结论作为输入。\u003c/li>\n\u003cli>\u003cstrong>P005\u003c/strong>：图像清晰，0.12 &lt; 0.20 → 按试行规则会自动放行；试运行人工结论却是不合格，说明低分路径存在漏检风险，需要在验证中暴露并改进。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\u003c/h4>\u003cp>操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由质量人员决定返工或报废。\u003c/p>\u003cp>企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量结论。\u003c/p>\u003cp>企业准备将模型接入业务流程，但存在以下问题：\u003c/p>\u003cp>1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\u003c/p>\u003cp>2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\u003c/p>\u003cp>3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录不同步而进入包装。\u003c/p>\u003cp>4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改进流程。\u003c/p>\u003ch4>（二）试运行记录下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，人工结论不是预先可用的输入。\u003c/h4>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"试运行逐件复核记录\">\u003ctable class=\"original-source-table\" data-source-table=\"quality-trial\">\u003ccolgroup>\u003ccol style=\"width:12%\">\u003ccol style=\"width:9%\">\u003ccol style=\"width:12%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:35%\">\u003c/colgroup>\u003ccaption>试运行逐件复核记录\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">产品编号\u003c/th>\u003cth scope=\"col\">批次\u003c/th>\u003cth scope=\"col\">图像质量\u003c/th>\u003cth scope=\"col\">模型缺陷分数\u003c/th>\u003cth scope=\"col\">人工最终结论\u003c/th>\u003cth scope=\"col\">人工说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">P001\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.08\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>无明显缺陷\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P002\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.92\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>明显划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P003\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.55\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>正常纹理被模型关注\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P004\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>模糊\u003c/td>\u003ctd>0.04\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>检查实物后发现划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P005\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.12\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>细小凹陷漏检\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P006\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.86\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>反光被误判为缺陷\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>（三）业务规则以下为企业拟采用的试行规则：\u003c/h4>\u003cp>1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后仍不可用，转质检员检查实物，不得自动放行。\u003c/p>\u003cp>2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，转人工复核；大于或等于0.80，自动隔离待质量人员处理。\u003c/p>\u003cp>3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格。\u003c/p>\u003cp>4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后重新进入检测流程，不直接送包装。\u003c/p>\u003cp>5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录人员、理由及时间。\u003c/p>\u003ch4>任务一：业务框架设计用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\u003c/h4>\u003cp>• 四个必要业务模块及各自作用。\u003c/p>\u003cp>• 系统与质检人员的职责边界。\u003c/p>\u003cp>• 一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关键字段。\u003c/p>\u003ch4>任务二：业务流程与处置规则设计\u003c/h4>\u003cp>1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和高分四种情况。\u003c/p>\u003cp>2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有异常支线。\u003c/p>\u003cp>3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\u003c/p>\u003ch4>任务三：设计验证与改进方案\u003c/h4>\u003cp>1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是否有效。\u003c/p>\u003cp>2. 给出两个能够衡量新流程效果的指标，写清统计口径。\u003c/p>\u003c/div>"}, "B1.1-T3": {"id": "B1.1-T3", "exam": "B1.1", "exam_title": "产品外观智能质检业务框架与流程设计", "source": "（一）业务背景\n\n  某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\n\n操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由\n\n质量人员决定返工或报废。\n\n  企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表\n\n示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量\n\n结论。\n\n  企业准备将模型接入业务流程，但存在以下问题：\n\n      1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\n\n      2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\n\n      3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录\n\n不同步而进入包装。\n\n      4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改\n\n进流程。\n\n  （二）试运行记录\n\n  下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，\n\n人工结论不是预先可用的输入。\n\n产品编号 批次 图像质量 模型缺陷分数 人工最终结论 人工说明\nP001      B01 清晰       0.08     合格     无明显缺陷\nP002      B01 清晰       0.92     不合格    明显划伤\nP003      B01 清晰       0.55     合格     正常纹理被模型关注\nP004      B02 模糊       0.04     不合格    检查实物后发现划伤\nP005      B02 清晰       0.12     不合格    细小凹陷漏检\nP006      B02 清晰       0.86     合格     反光被误判为缺陷\n\n  （三）业务规则\n\n  以下为企业拟采用的试行规则：\n\n      1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后\n\n仍不可用，转质检员检查实物，不得自动放行。\n\n      2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，\n\n转人工复核；大于或等于0.80，自动隔离待质量人员处理。\n\n      3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品\n\n保持待检状态，由质量主管继续处理，不得默认合格。\n\n      4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后\n\n重新进入检测流程，不直接送包装。\n\n      5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录\n\n人员、理由及时间。\n\n  任务一：业务框架设计\n\n  用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\n\n         四个必要业务模块及各自作用。\n\n         系统与质检人员的职责边界。\n\n         一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关\n\n    键字段。\n\n  任务二：业务流程与处置规则设计\n\n      1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和\n\n高分四种情况。\n\n      2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，\n\n以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有\n\n异常支线。\n\n      3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\n\n  任务三：设计验证与改进方案\n\n      1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是\n\n否有效。\n\n      2. 给出两个能够衡量新流程效果的指标，写清统计口径。", "pages": [16, 18], "title": "任务3：验证与改进方案", "prompts": ["（1）针对 P005 漏检、P006 误判各提出措施与验证方法。", "（2）给出两个流程效果指标，写清统计口径。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T3-section-1\">\u003ch3 id=\"B1.1-T3-section-1\">（1）漏检、误判的改进与验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>P005 细小凹陷漏检\u003c/strong>：补充不同角度、浅色、微小凹陷样本并复核标注，改善光照和采图分辨率，再训练或调阈值。\u003c/li>\n\u003cli>\u003cstrong>如何验证漏检改进\u003c/strong>：用独立、含细小凹陷的人工标注测试集，比改进前后的漏检率；同时看误拦截和人工工作量，不能只验证 P005 一个样本。\u003c/li>\n\u003cli>\u003cstrong>P006 反光误判\u003c/strong>：优化光源或偏振采图，增加反光正常品作为难负样本，重新验证图像质量规则与模型。\u003c/li>\n\u003cli>\u003cstrong>如何验证误判改进\u003c/strong>：用反光正常品测试集比较误隔离率，并确认真实缺陷召回没有明显下降。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.1-T3-section-2\">\u003ch3 id=\"B1.1-T3-section-2\">（2）两个流程效果指标及口径（按课件）\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>漏检流出率\u003c/strong> = 同期自动放行件中经抽检或投诉核实不合格的件数 ÷ 同期自动放行总件数，衡量错误放行风险。\u003c/li>\n\u003cli>\u003cstrong>人工复核负担率\u003c/strong> = 同期转人工复核件数 ÷ 同期检测总件数；也可报告自动处理率，衡量人工减负效果。\u003c/li>\n\u003cli>同一周期、同一核验口径前后比较；只抽检部分产品时，应同时报告抽检覆盖率，不能把未发现当作没有漏检。\u003c/li>\n\u003cli>备选：高分隔离件中人工改判合格占比、改判记录完整率。这里的漏检流出率与“不合格品中漏掉多少”的召回口径分母不同。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某制造企业生产小家电塑料外壳，需要在包装前检查划伤、凹陷等外观缺陷。现有流程为：\u003c/h4>\u003cp>操作员取件检查外观，在纸质表单中记录结果，合格品进入包装，不合格品放入周转箱，再由质量人员决定返工或报废。\u003c/p>\u003cp>企业已试运行视觉检测模型。模型根据产品图像输出0～1 的“缺陷分数”，分数越高表示模型越倾向于认为存在缺陷。缺陷分数不是已经验证的实际缺陷概率，也不能替代最终质量结论。\u003c/p>\u003cp>企业准备将模型接入业务流程，但存在以下问题：\u003c/p>\u003cp>1. 部分图像模糊或反光，模型仍会输出分数，直接使用可能导致错误放行。\u003c/p>\u003cp>2. 浅色划伤、细小凹陷容易漏检，反光或正常纹理容易被误判为缺陷。\u003c/p>\u003cp>3. 模型不确定时由谁检查、检查后如何流转尚未明确；已判定不合格的产品也可能因记录不同步而进入包装。\u003c/p>\u003cp>4. 人工纠正结果只记在纸上，无法与原始图像、模型版本关联，也没有形成稳定的模型改进流程。\u003c/p>\u003ch4>（二）试运行记录下表中的人工结论来自试运行阶段的逐件复核，仅用于分析模型错误。正式自动处理时，人工结论不是预先可用的输入。\u003c/h4>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"试运行逐件复核记录\">\u003ctable class=\"original-source-table\" data-source-table=\"quality-trial\">\u003ccolgroup>\u003ccol style=\"width:12%\">\u003ccol style=\"width:9%\">\u003ccol style=\"width:12%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:16%\">\u003ccol style=\"width:35%\">\u003c/colgroup>\u003ccaption>试运行逐件复核记录\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">产品编号\u003c/th>\u003cth scope=\"col\">批次\u003c/th>\u003cth scope=\"col\">图像质量\u003c/th>\u003cth scope=\"col\">模型缺陷分数\u003c/th>\u003cth scope=\"col\">人工最终结论\u003c/th>\u003cth scope=\"col\">人工说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">P001\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.08\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>无明显缺陷\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P002\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.92\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>明显划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P003\u003c/th>\u003ctd>B01\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.55\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>正常纹理被模型关注\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P004\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>模糊\u003c/td>\u003ctd>0.04\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>检查实物后发现划伤\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P005\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.12\u003c/td>\u003ctd>不合格\u003c/td>\u003ctd>细小凹陷漏检\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">P006\u003c/th>\u003ctd>B02\u003c/td>\u003ctd>清晰\u003c/td>\u003ctd>0.86\u003c/td>\u003ctd>合格\u003c/td>\u003ctd>反光被误判为缺陷\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>（三）业务规则以下为企业拟采用的试行规则：\u003c/h4>\u003cp>1. 先检查图像质量。模糊、严重反光或主体不完整时，原分数无效，先补拍一次。补拍后仍不可用，转质检员检查实物，不得自动放行。\u003c/p>\u003cp>2. 图像可用时按分数分流。缺陷分数小于0.20，自动放行；大于或等于0.20 且小于0.80，转人工复核；大于或等于0.80，自动隔离待质量人员处理。\u003c/p>\u003cp>3. 人工复核具有裁定权。人工确认合格可放行，确认不合格应隔离；暂时无法判断的产品保持待检状态，由质量主管继续处理，不得默认合格。\u003c/p>\u003cp>4. 隔离不等于报废。隔离产品由质量人员按企业标准决定放行、返工或报废。返工完成后重新进入检测流程，不直接送包装。\u003c/p>\u003cp>5. 必须记录状态。只有当前有效状态为“已放行”的产品才能进入包装；人工改判需要记录人员、理由及时间。\u003c/p>\u003ch4>任务一：业务框架设计用文字说明系统如何连接生产现场、视觉模型、质检人员和包装环节。至少写出：\u003c/h4>\u003cp>• 四个必要业务模块及各自作用。\u003c/p>\u003cp>• 系统与质检人员的职责边界。\u003c/p>\u003cp>• 一组用于产品追溯的输入、输出记录。需要包括记录方向，来源或去向，关键字段。\u003c/p>\u003ch4>任务二：业务流程与处置规则设计\u003c/h4>\u003cp>1. 编写简短的“条件—处理动作—后续去向”规则表，覆盖图像不可用、低分、中间分数和高分四种情况。\u003c/p>\u003cp>2. 绘制一张简洁的业务流程图，体现图像检查、模型检测、放行／人工复核／隔离分流，以及处理结果记录。人工复核后的去向和隔离后的处置可直接写在对应节点中，无需画出所有异常支线。\u003c/p>\u003cp>3. 分别说明P004、P005 按拟上线规则会进入哪条路径。\u003c/p>\u003ch4>任务三：设计验证与改进方案\u003c/h4>\u003cp>1. 针对P005 的漏检和P006 的误判，各提出一项具体改进措施，说明如何判断措施是否有效。\u003c/p>\u003cp>2. 给出两个能够衡量新流程效果的指标，写清统计口径。\u003c/p>\u003c/div>"}, "B1.2-T1": {"id": "B1.2-T1", "exam": "B1.2", "exam_title": "共享会议室预约与空间利用业务场景挖掘", "source": "（一）业务背景\n\n  某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\n\n平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，\n\n而员工仍反馈难以找到合适的会议空间。\n\n  企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善\n\n的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断\n\n其容量是否得到合理利用。\n\n   你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为\n\n其中一个机会点设计人工智能应用方案。\n\n（二）数据集说明\n\n      1. 预约记录meeting_bookings.csv\n\n   预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，\n\n其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\n\n字段      含义       说明\nbooking_id   预约编号     同一编号代表同一笔预约，分析前按此字段去重\nroom_id    会议室编号    与会议室资料表关联\nbooked_at    提交预约时间   格式为年-月-日时:分:秒\nstart_time    预约开始时间   格式为年-月-日时:分:秒\ntime_slot    预约时段        上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；\n                            傍晚16:00—18:00\ndepartment   预约部门     研发部、销售部、运营部或人事部\nstatus     最终预约状态   已使用、爽约、已取消\nattendees    实际参会人数   已使用记录为正整数；爽约及已取消记录为0\n  每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且\n\n该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\n\n      2. 会议室资料meeting_rooms.csv\n\n字段    含义    说明\nroom_id   会议室编号 唯一，不重复\nroom_name 会议室名称 用于展示结果\ncapacity   核定座位数 正整数\nequipment  配套设施  如白板、投屏、视频会议\n  数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均\n\n为UTF-8 编码，带BOM，可使用encoding=\"utf-8-sig\" 读取。\n\n（三）任务要求\n\n  任务一挖掘业务场景潜在机会点\n\n    使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能\n\n系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\n\n      1. 会议室预约效率优化\n\n  分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议\n\n室释放策略提供依据。\n\n      2. 会议室空间匹配优化\n\n  结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实\n\n际参会人数匹配不佳的会议室，为空间分配提供依据。\n\n  任务二挖掘隐藏价值\n\n  针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相\n\n应的改进措施。\n\n  任务三提出解决方案\n\n  针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使\n\n用方式、所选算法模型、业务应用方式和预期效果、验证方法。", "pages": [20, 22], "title": "任务1：挖掘潜在机会点", "prompts": ["（1）分析各时段有效预约、爽约数和爽约率，识别预约效率机会。", "（2）分析已使用会议室的容量匹配、场次及平均座位利用率，输出候选清单。", "补全素材 M1—M4，使用图表展示结果。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T1-section-1\">\u003ch3 id=\"B1.2-T1-section-1\">数据准备：M1\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">clean = bookings.drop_duplicates(subset='booking_id').copy()\nvalid = clean.loc[clean['status'].ne('已取消')].copy()\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>原始 246 行，按预约编号去重后 \u003cstrong>240 笔\u003c/strong>；排除已取消后 \u003cstrong>216 笔有效预约\u003c/strong>。\u003c/li>\n\u003cli>有效预约包括“已使用”和“爽约”，爽约不能当成取消删除。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T1-section-2\">\u003ch3 id=\"B1.2-T1-section-2\">（1）预约效率优化：M2\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">valid['is_no_show'] = valid['status'].eq('爽约').astype(int)\nslot_summary = valid.groupby('time_slot').agg(\n    valid_bookings=('booking_id', 'size'),\n    no_shows=('is_no_show', 'sum'),\n    no_show_rate=('is_no_show', 'mean')\n).sort_values('no_show_rate', ascending=False)\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>午间：42 笔有效，15 笔爽约，\u003cstrong>35.71%\u003c/strong>。\u003c/li>\n\u003cli>傍晚：54 笔有效，18 笔爽约，\u003cstrong>33.33%\u003c/strong>。\u003c/li>\n\u003cli>上午：60 笔有效，6 笔爽约，10%；下午：60 笔有效，3 笔爽约，5%。\u003c/li>\n\u003cli>用柱状图展示爽约率，同时列出样本量。午间、傍晚更值得优先试点提醒与确认，但样本期只有 10 个工作日。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T1-section-3\">\u003ch3 id=\"B1.2-T1-section-3\">（2）空间匹配优化：M3、M4\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">used = valid.loc[valid['status'] == '已使用'].merge(\n    rooms, on='room_id', how='left'\n)\nused['seat_util'] = used['attendees'] / used['capacity']\nroom_summary = used.groupby(\n    ['room_id', 'room_name', 'capacity'], as_index=False\n).agg(used_count=('booking_id', 'size'),\n      avg_seat_util=('seat_util', 'mean'))\ncandidates = room_summary.loc[\n    (room_summary['capacity'] &gt;= 12) &amp;\n    (room_summary['used_count'] &gt;= 20) &amp;\n    (room_summary['avg_seat_util'] &lt; 0.4)].copy()\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>冬青室 R04\u003c/strong>：12 座、使用 28 场、平均座位利用率 \u003cstrong>25%\u003c/strong>。\u003c/li>\n\u003cli>\u003cstrong>星河室 R05\u003c/strong>：16 座、使用 28 场、平均座位利用率 \u003cstrong>37.5%\u003c/strong>。\u003c/li>\n\u003cli>两者满足候选条件；远山室虽有 20 座，但平均座位利用率 80%，不能因为大就列为低利用候选。\u003c/li>\n\u003cli>\u003cstrong>M3 写法说明\u003c/strong>：\u003ccode>loc\u003c/code> 筛选“已使用”记录并保留整张表；\u003ccode>merge\u003c/code> 按 \u003ccode>room_id\u003c/code> 关联会议室容量；\u003ccode>attendees / capacity\u003c/code> 计算座位利用率。\u003c/li>\n\u003cli>筛选后不要只取某一列，也不要提前汇总，否则可能变成 Series，取不到 \u003ccode>attendees\u003c/code> 或 \u003ccode>capacity\u003c/code>。\u003c/li>\n\u003cli>座位利用率只对“已使用”记录计算；这不是会议室时间占用率。用柱状图比较各会议室。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\u003c/h4>\u003cp>平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，而员工仍反馈难以找到合适的会议空间。\u003c/p>\u003cp>企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断其容量是否得到合理利用。\u003c/p>\u003cp>你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为其中一个机会点设计人工智能应用方案。\u003c/p>\u003ch4>（二）数据集说明\u003c/h4>\u003cp>1. 预约记录meeting_bookings.csv预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"预约记录 meeting_bookings.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"booking-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>预约记录 meeting_bookings.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">booking_id\u003c/th>\u003ctd>预约编号\u003c/td>\u003ctd>同一编号代表同一笔预约，分析前按此字段去重\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>与会议室资料表关联\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">booked_at\u003c/th>\u003ctd>提交预约时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">start_time\u003c/th>\u003ctd>预约开始时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">time_slot\u003c/th>\u003ctd>预约时段\u003c/td>\u003ctd>上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；傍晚16:00—18:00\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">department\u003c/th>\u003ctd>预约部门\u003c/td>\u003ctd>研发部、销售部、运营部或人事部\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">status\u003c/th>\u003ctd>最终预约状态\u003c/td>\u003ctd>已使用、爽约、已取消\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">attendees\u003c/th>\u003ctd>实际参会人数\u003c/td>\u003ctd>已使用记录为正整数；爽约及已取消记录为0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\u003c/p>\u003cp>2. 会议室资料meeting_rooms.csv\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"会议室资料 meeting_rooms.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"room-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>会议室资料 meeting_rooms.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>唯一，不重复\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_name\u003c/th>\u003ctd>会议室名称\u003c/td>\u003ctd>用于展示结果\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">capacity\u003c/th>\u003ctd>核定座位数\u003c/td>\u003ctd>正整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">equipment\u003c/th>\u003ctd>配套设施\u003c/td>\u003ctd>如白板、投屏、视频会议\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均为UTF-8 编码，带BOM，可使用encoding=&quot;utf-8-sig&quot; 读取。\u003c/p>\u003ch4>（三）任务要求\u003c/h4>\u003ch4>任务一挖掘业务场景潜在机会点使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\u003c/h4>\u003cp>1. 会议室预约效率优化分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议室释放策略提供依据。\u003c/p>\u003cp>2. 会议室空间匹配优化结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实际参会人数匹配不佳的会议室，为空间分配提供依据。\u003c/p>\u003ch4>任务二挖掘隐藏价值针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相应的改进措施。\u003c/h4>\u003ch4>任务三提出解决方案针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使用方式、所选算法模型、业务应用方式和预期效果、验证方法。\u003c/h4>\u003c/div>"}, "B1.2-T2": {"id": "B1.2-T2", "exam": "B1.2", "exam_title": "共享会议室预约与空间利用业务场景挖掘", "source": "（一）业务背景\n\n  某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\n\n平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，\n\n而员工仍反馈难以找到合适的会议空间。\n\n  企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善\n\n的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断\n\n其容量是否得到合理利用。\n\n   你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为\n\n其中一个机会点设计人工智能应用方案。\n\n（二）数据集说明\n\n      1. 预约记录meeting_bookings.csv\n\n   预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，\n\n其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\n\n字段      含义       说明\nbooking_id   预约编号     同一编号代表同一笔预约，分析前按此字段去重\nroom_id    会议室编号    与会议室资料表关联\nbooked_at    提交预约时间   格式为年-月-日时:分:秒\nstart_time    预约开始时间   格式为年-月-日时:分:秒\ntime_slot    预约时段        上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；\n                            傍晚16:00—18:00\ndepartment   预约部门     研发部、销售部、运营部或人事部\nstatus     最终预约状态   已使用、爽约、已取消\nattendees    实际参会人数   已使用记录为正整数；爽约及已取消记录为0\n  每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且\n\n该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\n\n      2. 会议室资料meeting_rooms.csv\n\n字段    含义    说明\nroom_id   会议室编号 唯一，不重复\nroom_name 会议室名称 用于展示结果\ncapacity   核定座位数 正整数\nequipment  配套设施  如白板、投屏、视频会议\n  数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均\n\n为UTF-8 编码，带BOM，可使用encoding=\"utf-8-sig\" 读取。\n\n（三）任务要求\n\n  任务一挖掘业务场景潜在机会点\n\n    使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能\n\n系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\n\n      1. 会议室预约效率优化\n\n  分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议\n\n室释放策略提供依据。\n\n      2. 会议室空间匹配优化\n\n  结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实\n\n际参会人数匹配不佳的会议室，为空间分配提供依据。\n\n  任务二挖掘隐藏价值\n\n  针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相\n\n应的改进措施。\n\n  任务三提出解决方案\n\n  针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使\n\n用方式、所选算法模型、业务应用方式和预期效果、验证方法。", "pages": [20, 22], "title": "任务2：挖掘隐藏价值", "prompts": ["（1）结合预约效率结果说明业务价值和改进措施。", "（2）结合空间匹配结果说明运营价值和改进措施。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T2-section-1\">\u003ch3 id=\"B1.2-T2-section-1\">（1）预约效率：发现—价值—改进\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>发现\u003c/strong>：午间和傍晚爽约率较高，分别为 35.71%、33.33%。\u003c/li>\n\u003cli>\u003cstrong>价值\u003c/strong>：减少无效占用，让显示已预订但无人使用的空间有机会重新分配，降低人工询问成本。\u003c/li>\n\u003cli>\u003cstrong>措施\u003c/strong>：午间/傍晚会前15分钟提醒、到场签到、便捷取消；按公示的确认与超时规则释放并通知候补人员，异常转人工核实。反复爽约可先宣导，再按制度限制预约。\u003c/li>\n\u003cli>\u003cstrong>验证\u003c/strong>：比较有效预约爽约率、释放后再利用率、误释放及投诉；不能仅看提醒发送量。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T2-section-2\">\u003ch3 id=\"B1.2-T2-section-2\">（2）空间匹配：发现—价值—改进\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>\u003cstrong>发现\u003c/strong>：冬青室、星河室使用场次均达 28 场，但平均座位利用率仅 25%、37.5%，相当于平均约3人、6人使用；小会议室为75%～87.5%。这是容量错配线索，不能仅据座位利用率断定小房间已供不应求。\u003c/li>\n\u003cli>\u003cstrong>价值\u003c/strong>：把小型会议优先分到合适房间，为大会议保留容量，提高空间配置效率。\u003c/li>\n\u003cli>\u003cstrong>措施\u003c/strong>：预约时采集预计人数、设备与无障碍需求；优先推荐满足条件的较小房间；冬青室、星河室可评估分隔或置换，按月输出利用率报告，保留设备和无障碍需求例外。\u003c/li>\n\u003cli>\u003cstrong>验证\u003c/strong>：看平均座位利用率、找房成功率、会议需求满足率；不能为抬高利用率牺牲视频设备等真实需求。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\u003c/h4>\u003cp>平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，而员工仍反馈难以找到合适的会议空间。\u003c/p>\u003cp>企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断其容量是否得到合理利用。\u003c/p>\u003cp>你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为其中一个机会点设计人工智能应用方案。\u003c/p>\u003ch4>（二）数据集说明\u003c/h4>\u003cp>1. 预约记录meeting_bookings.csv预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"预约记录 meeting_bookings.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"booking-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>预约记录 meeting_bookings.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">booking_id\u003c/th>\u003ctd>预约编号\u003c/td>\u003ctd>同一编号代表同一笔预约，分析前按此字段去重\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>与会议室资料表关联\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">booked_at\u003c/th>\u003ctd>提交预约时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">start_time\u003c/th>\u003ctd>预约开始时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">time_slot\u003c/th>\u003ctd>预约时段\u003c/td>\u003ctd>上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；傍晚16:00—18:00\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">department\u003c/th>\u003ctd>预约部门\u003c/td>\u003ctd>研发部、销售部、运营部或人事部\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">status\u003c/th>\u003ctd>最终预约状态\u003c/td>\u003ctd>已使用、爽约、已取消\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">attendees\u003c/th>\u003ctd>实际参会人数\u003c/td>\u003ctd>已使用记录为正整数；爽约及已取消记录为0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\u003c/p>\u003cp>2. 会议室资料meeting_rooms.csv\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"会议室资料 meeting_rooms.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"room-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>会议室资料 meeting_rooms.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>唯一，不重复\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_name\u003c/th>\u003ctd>会议室名称\u003c/td>\u003ctd>用于展示结果\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">capacity\u003c/th>\u003ctd>核定座位数\u003c/td>\u003ctd>正整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">equipment\u003c/th>\u003ctd>配套设施\u003c/td>\u003ctd>如白板、投屏、视频会议\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均为UTF-8 编码，带BOM，可使用encoding=&quot;utf-8-sig&quot; 读取。\u003c/p>\u003ch4>（三）任务要求\u003c/h4>\u003ch4>任务一挖掘业务场景潜在机会点使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\u003c/h4>\u003cp>1. 会议室预约效率优化分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议室释放策略提供依据。\u003c/p>\u003cp>2. 会议室空间匹配优化结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实际参会人数匹配不佳的会议室，为空间分配提供依据。\u003c/p>\u003ch4>任务二挖掘隐藏价值针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相应的改进措施。\u003c/h4>\u003ch4>任务三提出解决方案针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使用方式、所选算法模型、业务应用方式和预期效果、验证方法。\u003c/h4>\u003c/div>"}, "B1.2-T3": {"id": "B1.2-T3", "exam": "B1.2", "exam_title": "共享会议室预约与空间利用业务场景挖掘", "source": "（一）业务背景\n\n  某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\n\n平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，\n\n而员工仍反馈难以找到合适的会议空间。\n\n  企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善\n\n的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断\n\n其容量是否得到合理利用。\n\n   你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为\n\n其中一个机会点设计人工智能应用方案。\n\n（二）数据集说明\n\n      1. 预约记录meeting_bookings.csv\n\n   预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，\n\n其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\n\n字段      含义       说明\nbooking_id   预约编号     同一编号代表同一笔预约，分析前按此字段去重\nroom_id    会议室编号    与会议室资料表关联\nbooked_at    提交预约时间   格式为年-月-日时:分:秒\nstart_time    预约开始时间   格式为年-月-日时:分:秒\ntime_slot    预约时段        上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；\n                            傍晚16:00—18:00\ndepartment   预约部门     研发部、销售部、运营部或人事部\nstatus     最终预约状态   已使用、爽约、已取消\nattendees    实际参会人数   已使用记录为正整数；爽约及已取消记录为0\n  每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且\n\n该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\n\n      2. 会议室资料meeting_rooms.csv\n\n字段    含义    说明\nroom_id   会议室编号 唯一，不重复\nroom_name 会议室名称 用于展示结果\ncapacity   核定座位数 正整数\nequipment  配套设施  如白板、投屏、视频会议\n  数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均\n\n为UTF-8 编码，带BOM，可使用encoding=\"utf-8-sig\" 读取。\n\n（三）任务要求\n\n  任务一挖掘业务场景潜在机会点\n\n    使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能\n\n系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\n\n      1. 会议室预约效率优化\n\n  分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议\n\n室释放策略提供依据。\n\n      2. 会议室空间匹配优化\n\n  结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实\n\n际参会人数匹配不佳的会议室，为空间分配提供依据。\n\n  任务二挖掘隐藏价值\n\n  针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相\n\n应的改进措施。\n\n  任务三提出解决方案\n\n  针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使\n\n用方式、所选算法模型、业务应用方式和预期效果、验证方法。", "pages": [20, 22], "title": "任务3：AI 应用方案", "prompts": ["任选一个机会点，说明数据使用、算法模型、业务应用及预期效果、验证方法。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T3-section-1\">\u003ch3 id=\"B1.2-T3-section-1\">要点 1 · 数据使用：选择“爽约风险提醒”\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>按预约编号去重、排除取消，已使用记 0、爽约记 1，形成历史监督标签。\u003c/li>\n\u003cli>预测只能用提醒时点之前已知的信息：时段、星期、部门、房间容量、设备、预约提前量及此前已形成的历史爽约记录。\u003c/li>\n\u003cli>最终状态和实际参会人数是事后数据，不能直接作为预测输入。按较早日期训练、较晚日期验证。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T3-section-2\">\u003ch3 id=\"B1.2-T3-section-2\">要点 2 · 模型与业务应用\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>先用“午间/傍晚优先提醒”的简单规则作基线；数据积累后用逻辑回归或浅层决策树输出爽约风险。\u003c/li>\n\u003cli>高风险预约收到二次确认、便捷取消入口，中风险常规提醒、低风险少打扰；未确认预约按公示的超时释放规则执行，异常交行政核实，不仅凭模型分数取消。\u003c/li>\n\u003cli>调整提醒阈值与频次，避免过多打扰；只处理业务必要数据并控制查看权限。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B1.2-T3-section-3\">\u003ch3 id=\"B1.2-T3-section-3\">要点 3 · 预期效果与验证\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cul>\n\u003cli>预期降低爽约和无效占用、提高重新分配效率，不把期望写成已经实现。\u003c/li>\n\u003cli>按房间、时段随机分组对照，可持续4周，比较爽约率、误释放率、再利用率和投诉。\u003c/li>\n\u003cli>模型看精确率、召回率和分组表现，业务看真实改善；仅 10 天数据不能证明模型长期有效。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003ch4>（一）业务背景某企业办公园区设有6 间共享会议室，员工通过预约平台预订固定时段。行政人员发现：\u003c/h4>\u003cp>平台经常显示会议室已被预约，但到现场却无人使用；部分大会议室实际只有少数人员参会，而员工仍反馈难以找到合适的会议空间。\u003c/p>\u003cp>企业希望分析历史预约和实际使用数据，找出可通过智能提醒、预约确认和空间匹配改善的业务机会。当前尚不能确定哪些时段爽约问题更突出，也不能仅凭会议室被预约的次数判断其容量是否得到合理利用。\u003c/p>\u003cp>你作为人工智能训练师，需要使用pandas 完成数据分析，根据结果提出业务建议，并为其中一个机会点设计人工智能应用方案。\u003c/p>\u003ch4>（二）数据集说明\u003c/h4>\u003cp>1. 预约记录meeting_bookings.csv预约开始日期覆盖2026 年8 月3 日至8 月14 日的10 个工作日。原始文件包含246 行，其中存在同一预约被重复导出的记录；重复记录的内容完全相同。\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"预约记录 meeting_bookings.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"booking-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>预约记录 meeting_bookings.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">booking_id\u003c/th>\u003ctd>预约编号\u003c/td>\u003ctd>同一编号代表同一笔预约，分析前按此字段去重\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>与会议室资料表关联\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">booked_at\u003c/th>\u003ctd>提交预约时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">start_time\u003c/th>\u003ctd>预约开始时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">time_slot\u003c/th>\u003ctd>预约时段\u003c/td>\u003ctd>上午09:00—11:00；午间11:00—13:00；下午14:00—16:00；傍晚16:00—18:00\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">department\u003c/th>\u003ctd>预约部门\u003c/td>\u003ctd>研发部、销售部、运营部或人事部\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">status\u003c/th>\u003ctd>最终预约状态\u003c/td>\u003ctd>已使用、爽约、已取消\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">attendees\u003c/th>\u003ctd>实际参会人数\u003c/td>\u003ctd>已使用记录为正整数；爽约及已取消记录为0\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>每笔预约占用一个固定的2 小时时段。已取消表示在开始前取消，爽约表示未提前取消且该时段无人使用。实际人数已经过核验，不要求考生另行处理人数缺失或检测误差。\u003c/p>\u003cp>2. 会议室资料meeting_rooms.csv\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"会议室资料 meeting_rooms.csv · 字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"room-fields\">\u003ccolgroup>\u003ccol style=\"width:26%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:54%\">\u003c/colgroup>\u003ccaption>会议室资料 meeting_rooms.csv · 字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">room_id\u003c/th>\u003ctd>会议室编号\u003c/td>\u003ctd>唯一，不重复\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">room_name\u003c/th>\u003ctd>会议室名称\u003c/td>\u003ctd>用于展示结果\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">capacity\u003c/th>\u003ctd>核定座位数\u003c/td>\u003ctd>正整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">equipment\u003c/th>\u003ctd>配套设施\u003c/td>\u003ctd>如白板、投屏、视频会议\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003cp>数据共6 行。预约表中的会议室均可在资料表中匹配，字段没有缺失。两份CSV 文件均为UTF-8 编码，带BOM，可使用encoding=&quot;utf-8-sig&quot; 读取。\u003c/p>\u003ch4>（三）任务要求\u003c/h4>\u003ch4>任务一挖掘业务场景潜在机会点使用Python 代码读取并分析提供的数据集，按照统计口径完成必要的数据处理，挖掘智能系统在以下两个业务场景中的潜在机会点，并使用数据可视化技术展示分析结果：\u003c/h4>\u003cp>1. 会议室预约效率优化分析不同时段的有效预约及爽约情况，识别爽约问题较为突出的时段，为预约提醒和会议室释放策略提供依据。\u003c/p>\u003cp>2. 会议室空间匹配优化结合预约记录和会议室资料，分析不同会议室的实际使用及座位利用情况，找出容量与实际参会人数匹配不佳的会议室，为空间分配提供依据。\u003c/p>\u003ch4>任务二挖掘隐藏价值针对任务一中的两个业务场景，结合分析结果说明其中隐藏的业务和运营价值，并提出相应的改进措施。\u003c/h4>\u003ch4>任务三提出解决方案针对任务一中的其中一个业务场景，结合人工智能技术提出解决方案。方案应包括数据使用方式、所选算法模型、业务应用方式和预期效果、验证方法。\u003c/h4>\u003c/div>"}, "B2-T1": {"id": "B2-T1", "exam": "B2", "exam_title": "冷链运输温控异常预警算法测试与数据分析", "source": "某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输\n\n时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供\n\n数据文件cold_chain_shipments.csv，需完成以下操作:\n\n  数据字段说明：\n\n字段           含义     说明\n\n                    同一编号代表同一运输任务，原始数据中包含少量\nshipment_id        运输单号\n                    重复记录\n\ndepart_time        发车时间  格式为年-月-日时:分:秒\n\nroute_region       线路区域  华东、华南、华北或西南\n\nvehicle_type       车辆类型  冷藏车、冷冻车或混合温区车\n\ncargo_type        货物类型  疫苗、生鲜食品、冷冻食品或乳制品\n\n             计划运输时\nplanned_hours             单位：小时，少量非法值需清理\n             长\n\noutside_temp       外部温度  单位：℃\n\n             车厢平均温\navg_temp               单位：℃，存在少量缺失值\n             度\n\n             车厢最高温\nmax_temp                单位：℃\n             度\n\ndoor_open_count      开门次数  非负整数\n\n             传感器缺失\nsensor_missing_rate           0～1，少量非法值需清理\n             率\n\ndriver_experience_years  驾驶经验  单位：年\n\n             温控异常标\ntemp_alarm                             1 表示异常，0 表示正常\n             签\n\n  任务一：数据清洗与业务分布分析\n\n    在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按\n\n货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率\n\n及平均传感器缺失率。\n\n  任务二：算法训练与测试\n\n    在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集\n\n和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型\n\n在测试集中的召回率。\n\n  任务三：形成算法测试结论\n\n  结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测\n试表现存在明显差异的情况提出一项改进措施。", "pages": [23, 24], "title": "任务1：数据清洗与分布分析", "prompts": ["转换发车时间并提取小时，按运输单号去重，删除运输时长≤0或传感器缺失率不在[0,1]的记录。", "按货物类型中位数填补 avg_temp，统计货物类型×线路区域的样本数、报警率、平均传感器缺失率。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T1-section-1\">\u003ch3 id=\"B2-T1-section-1\">（1）清洗与时间处理\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">df['depart_time'] = pd.to_datetime(df['depart_time'])\ndf['depart_hour'] = df['depart_time'].dt.hour\ndf = df.drop_duplicates(subset='shipment_id').copy()\ndf = df.loc[(df['planned_hours'] &gt; 0) &amp;\n            df['sensor_missing_rate'].between(0, 1)].copy()\ndf['avg_temp'] = df['avg_temp'].fillna(\n    df.groupby('cargo_type')['avg_temp'].transform('median'))\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>按运输单号去重；运输时长必须大于 0，缺失率必须在闭区间 [0,1]。\u003c/li>\n\u003cli>课件额外写了 \u003ccode>planned_hours &lt;= 72\u003c/code>，原题未指定此上限，属于补充假设；本素材最大22小时，这个条件不会改变结果。\u003c/li>\n\u003cli>同类货物温区更可比，按货物类型中位数填补平均温度；清洗后 \u003cstrong>1578 条\u003c/strong>。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T1-section-2\">\u003ch3 id=\"B2-T1-section-2\">（2）货物类型 × 线路区域分布\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">cargo_region_summary = df.groupby(\n    ['cargo_type', 'route_region']\n).agg(sample_count=('shipment_id', 'size'),\n      alarm_rate=('temp_alarm', 'mean'),\n      avg_missing_rate=('sensor_missing_rate', 'mean'))\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>size\u003c/code> 是样本数，0/1 标签均值是报警率，缺失率均值反映传感器质量。\u003c/li>\n\u003cli>例如疫苗华南 70 条，报警率约 47.14%；冷冻食品华东 133 条，约 9.02%。比较时也要看样本量，不能把样本结构差异直接当算法能力差异。\u003c/li>\n\u003cli>\u003cstrong>分布发现\u003c/strong>：疫苗、生鲜报警率较高；乳制品、生鲜、疫苗均以华南最高，冷冻食品则是西南最高（约17.65%），不是所有类型都以华南最高。报警率差异是观察结果，原因需进一步核查。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>", "source_html": "\u003cdiv class=\"source-rich\">\u003cp>某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供数据文件cold_chain_shipments.csv，需完成以下操作:\u003c/p>\u003cp>数据字段说明：\u003c/p>\u003cdiv class=\"original-table-wrap\" role=\"region\" tabindex=\"0\" aria-label=\"冷链运输 cold_chain_shipments.csv · 数据字段说明\">\u003ctable class=\"original-source-table\" data-source-table=\"shipment-fields\">\u003ccolgroup>\u003ccol style=\"width:31%\">\u003ccol style=\"width:20%\">\u003ccol style=\"width:49%\">\u003c/colgroup>\u003ccaption>冷链运输 cold_chain_shipments.csv · 数据字段说明\u003c/caption>\u003cthead>\u003ctr>\u003cth scope=\"col\">字段\u003c/th>\u003cth scope=\"col\">含义\u003c/th>\u003cth scope=\"col\">说明\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\u003ctr>\u003cth scope=\"row\">shipment_id\u003c/th>\u003ctd>运输单号\u003c/td>\u003ctd>同一编号代表同一运输任务，原始数据中包含少量重复记录\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">depart_time\u003c/th>\u003ctd>发车时间\u003c/td>\u003ctd>格式为年-月-日 时:分:秒\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">route_region\u003c/th>\u003ctd>线路区域\u003c/td>\u003ctd>华东、华南、华北或西南\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">vehicle_type\u003c/th>\u003ctd>车辆类型\u003c/td>\u003ctd>冷藏车、冷冻车或混合温区车\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">cargo_type\u003c/th>\u003ctd>货物类型\u003c/td>\u003ctd>疫苗、生鲜食品、冷冻食品或乳制品\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">planned_hours\u003c/th>\u003ctd>计划运输时长\u003c/td>\u003ctd>单位：小时，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">outside_temp\u003c/th>\u003ctd>外部温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">avg_temp\u003c/th>\u003ctd>车厢平均温度\u003c/td>\u003ctd>单位：℃，存在少量缺失值\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">max_temp\u003c/th>\u003ctd>车厢最高温度\u003c/td>\u003ctd>单位：℃\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">door_open_count\u003c/th>\u003ctd>开门次数\u003c/td>\u003ctd>非负整数\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">sensor_missing_rate\u003c/th>\u003ctd>传感器缺失率\u003c/td>\u003ctd>0～1，少量非法值需清理\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">driver_experience_years\u003c/th>\u003ctd>驾驶经验\u003c/td>\u003ctd>单位：年\u003c/td>\u003c/tr>\u003ctr>\u003cth scope=\"row\">temp_alarm\u003c/th>\u003ctd>温控异常标签\u003c/td>\u003ctd>1表示异常，0表示正常\u003c/td>\u003c/tr>\u003c/tbody>\u003c/table>\u003c/div>\u003ch4>任务一：数据清洗与业务分布分析在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率及平均传感器缺失率。\u003c/h4>\u003ch4>任务二：算法训练与测试在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型在测试集中的召回率。\u003c/h4>\u003ch4>任务三：形成算法测试结论结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测试表现存在明显差异的情况提出一项改进措施。\u003c/h4>\u003c/div>"}, "B2-T2": {"id": "B2-T2", "exam": "B2", "exam_title": "冷链运输温控异常预警算法测试与数据分析", "source": "某冷链物流企业正在测试运输温控异常预警算法。系统需要根据线路、车辆、货物、运输\n\n时长、环境温度、开门次数及传感器数据，预测运输过程中是否会触发温控异常报警。现提供\n\n数据文件cold_chain_shipments.csv，需完成以下操作:\n\n  数据字段说明：\n\n字段           含义     说明\n\n                    同一编号代表同一运输任务，原始数据中包含少量\nshipment_id        运输单号\n                    重复记录\n\ndepart_time        发车时间  格式为年-月-日时:分:秒\n\nroute_region       线路区域  华东、华南、华北或西南\n\nvehicle_type       车辆类型  冷藏车、冷冻车或混合温区车\n\ncargo_type        货物类型  疫苗、生鲜食品、冷冻食品或乳制品\n\n             计划运输时\nplanned_hours             单位：小时，少量非法值需清理\n             长\n\noutside_temp       外部温度  单位：℃\n\n             车厢平均温\navg_temp               单位：℃，存在少量缺失值\n             度\n\n             车厢最高温\nmax_temp                单位：℃\n             度\n\ndoor_open_count      开门次数  非负整数\n\n             传感器缺失\nsensor_missing_rate           0～1，少量非法值需清理\n             率\n\ndriver_experience_years  驾驶经验  单位：年\n\n             温控异常标\ntemp_alarm                             1 表示异常，0 表示正常\n             签\n\n  任务一：数据清洗与业务分布分析\n\n    在B2.ipynb 中补全代码：转换时间并提取发车小时；按运输单号去重并清除非法记录；按\n\n货物类型的中位数填补平均温度缺失值；统计不同货物类型和线路区域的样本数、温控报警率\n\n及平均传感器缺失率。\n\n  任务二：算法训练与测试\n\n    在B2.ipynb 中补全代码：构造特征矩阵并对分类变量编码；采用分层随机划分形成训练集\n\n和测试集；训练随机森林分类器；计算精确率、召回率、F1 值和混淆矩阵；比较不同货物类型\n\n在测试集中的召回率。\n\n  任务三：形成算法测试结论\n\n  结合冷链温控异常预警业务，说明应优先关注的分类指标及理由，并针对不同货物类型测\n试表现存在明显差异的情况提出一项改进措施。", "pages": [23, 24], "title": "任务2：算法训练与测试", "prompts": ["分类变量独热编码，75%/25%按标签分层随机切分，random_state=42。", "随机森林：100 棵树、最大深度 6、平衡类别权重、random_state=42。", "计算 Precision、Recall、F1、混淆矩阵及不同货物类型的召回率。"], "reference_html": "\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T2-section-1\">\u003ch3 id=\"B2-T2-section-1\">（1）特征编码与分层划分\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">X = pd.get_dummies(df[feature_cols], columns=category_cols)\ny = df['temp_alarm']\nX_train, X_test, y_train, y_test = train_test_split(\n    X, y, test_size=0.25, stratify=y, random_state=42)\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>训练集 \u003cstrong>1183 条\u003c/strong>，测试集 \u003cstrong>395 条\u003c/strong>；分层尽量保持报警标签比例，固定种子便于复现。\u003c/li>\n\u003cli>不把运输单号和目标标签混进特征矩阵。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T2-section-2\">\u003ch3 id=\"B2-T2-section-2\">（2）随机森林训练与整体评估\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">model = RandomForestClassifier(n_estimators=100, max_depth=6,\n    class_weight='balanced', random_state=42)\nmodel.fit(X_train, y_train)\ny_pred = model.predict(X_test)\nprecision = precision_score(y_test, y_pred, zero_division=0)\nrecall = recall_score(y_test, y_pred, zero_division=0)\nf1 = f1_score(y_test, y_pred, zero_division=0)\ncm = confusion_matrix(y_test, y_pred)\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>当前素材实跑\u003c/strong>：精确率 \u003cstrong>0.661\u003c/strong>、召回率 \u003cstrong>0.673\u003c/strong>、F1 \u003cstrong>0.667\u003c/strong>；已把课件原代码与当前代码在同一环境复跑，两者结果一致。\u003c/li>\n\u003cli>混淆矩阵按实际行、预测列：[正常预测正常 251，正常误报 37；异常漏报 35，异常命中 72]。\u003c/li>\n\u003cli>召回率 = 72/(72+35)，精确率 = 72/(72+37)，不要把行列读反。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T2-section-3\">\u003ch3 id=\"B2-T2-section-3\">（3）按货物类型比较召回率\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003cpre>\u003ccode class=\"language-python\">test_result = df.loc[X_test.index, ['shipment_id', 'cargo_type']].copy()\ntest_result['actual'] = y_test.to_numpy()\ntest_result['predicted'] = y_pred\ncargo_recall = test_result.groupby('cargo_type')[['actual', 'predicted']].apply(\n    lambda g: recall_score(g['actual'], g['predicted'], zero_division=0))\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>乳制品约 \u003cstrong>0.611\u003c/strong>，冷冻食品 \u003cstrong>0.067\u003c/strong>，生鲜 \u003cstrong>0.788\u003c/strong>，疫苗 \u003cstrong>0.864\u003c/strong>。\u003c/li>\n\u003cli>报告各组阳性样本数，少样本分组结果不稳定，不能只拿总体均值宣称全部达标。\u003c/li>\n\u003c/ul>\n\u003c/div>\u003c/section>\u003csection class=\"reference-subquestion\" aria-labelledby=\"B2-T2-section-4\">\u003ch3 id=\"B2-T2-section-4\">课件列值与复跑对照\u003c/h3>\u003cdiv class=\"reference-subquestion-body\">\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>指定课件正文列值\u003c/th>\n\u003cth>课件代码/当前代码实跑\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Precision\u003c/td>\n\u003ctd>0.638\u003c/td>\n\u003ctd>0.661\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Recall\u003c/td>\n\u003ctd>0.692\u003c/td>\n\u003ctd>0.67
